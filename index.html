<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY VISION OOH</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f4f6f8;
color:#172033;
}

header{
height:60px;
background:#111827;
color:white;
display:flex;
align-items:center;
padding:0 18px;
gap:12px;
}

.logo{
font-size:21px;
font-weight:bold;
}

.logo span{
color:#19a7e0;
}

.header-right{
margin-left:auto;
display:flex;
align-items:center;
gap:8px;
}

button{
border:0;
border-radius:7px;
padding:10px 14px;
font-weight:bold;
cursor:pointer;
}

.blue{
background:#0787c8;
color:white;
}

.green{
background:#16a34a;
color:white;
}

.red{
background:#dc2626;
color:white;
}

.gray{
background:#e5e7eb;
color:#111827;
}

.layout{
display:grid;
grid-template-columns:360px 1fr;
height:calc(100vh - 60px);
}

.sidebar{
background:white;
border-right:1px solid #ddd;
overflow:auto;
padding:12px;
}

#map{
height:100%;
width:100%;
}

.card{
background:white;
border:1px solid #ddd;
border-radius:10px;
padding:13px;
margin-bottom:12px;
}

h2,h3{
margin:4px 0 12px;
}

label{
display:block;
font-size:12px;
font-weight:bold;
margin:8px 0 4px;
}

input,select,textarea{
width:100%;
padding:9px;
border:1px solid #cbd5e1;
border-radius:6px;
font-size:14px;
}

textarea{
height:70px;
resize:vertical;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
}

.search-row{
display:grid;
grid-template-columns:1fr auto;
gap:7px;
}

.site{
border:1px solid #ddd;
border-radius:7px;
padding:9px;
margin-top:7px;
}

.site-name{
font-weight:bold;
font-size:14px;
}

.small{
font-size:11px;
color:#667085;
margin-top:3px;
}

.site-buttons{
display:flex;
gap:5px;
margin-top:7px;
}

.site-buttons button{
font-size:11px;
padding:6px 8px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:10px;
}

.stat{
background:#f4f6f8;
padding:10px;
border-radius:7px;
}

.stat b{
display:block;
font-size:20px;
}

#message{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#111827;
color:white;
padding:10px 18px;
border-radius:7px;
display:none;
z-index:9999;
}

#loginScreen{
position:fixed;
inset:0;
background:#111827;
display:flex;
align-items:center;
justify-content:center;
z-index:99999;
}

.login-box{
background:white;
width:360px;
max-width:90%;
padding:25px;
border-radius:12px;
}

.photo-preview{
max-width:100%;
max-height:130px;
margin-top:7px;
border-radius:7px;
display:none;
}

@media(max-width:800px){

.layout{
grid-template-columns:1fr;
height:auto;
}

.sidebar{
height:auto;
}

#map{
height:60vh;
}

}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

<div class="login-box">

<h2>MY VISION <span style="color:#0787c8">OOH</span></h2>

<p class="small">
Login to save your OOH sites permanently online.
</p>

<label>Email</label>

<input
id="email"
type="email"
placeholder="your@email.com"
>

<label>Password</label>

<input
id="password"
type="password"
placeholder="Minimum 6 characters"
>

<br><br>

<button
class="blue"
style="width:100%"
onclick="login()"
>
LOGIN
</button>

<br><br>

<button
class="gray"
style="width:100%"
onclick="signup()"
>
CREATE FREE ACCOUNT
</button>

<p id="loginMessage" class="small"></p>

</div>

</div>


<!-- HEADER -->

<header>

<div class="logo">
MY VISION <span>OOH</span>
</div>

<div class="header-right">

<span id="userEmail"></span>

<button
class="gray"
onclick="logout()"
>
Logout
</button>

<button
class="green"
onclick="exportExcel()"
>
Export Excel
</button>

<button
class="green"
onclick="exportPPT()"
>
Export PPT
</button>

</div>

</header>


<div class="layout">

<!-- SIDEBAR -->

<div class="sidebar">


<!-- CAMPAIGN -->

<div class="card">

<h3>Campaign</h3>

<input
id="campaign"
placeholder="Client / Campaign Name"
>

<div class="stats">

<div class="stat">
Total Sites
<b id="totalSites">0</b>
</div>

<div class="stat">
Selected
<b id="selectedSites">0</b>
</div>

</div>

</div>


<!-- SEARCH -->

<div class="card">

<h3>📍 Find Location</h3>

<label>
Latitude
</label>

<input
id="searchLat"
type="number"
step="any"
placeholder="19.1197"
>

<label>
Longitude
</label>

<input
id="searchLng"
type="number"
step="any"
placeholder="72.8468"
>

<button
class="blue"
style="width:100%;margin-top:8px"
onclick="locateCoordinates()"
>
📍 LOCATE ON MAP
</button>

<br>

<button
class="gray"
style="width:100%;margin-top:7px"
onclick="useMyLocation()"

📌 USE MY CURRENT LOCATION

</div>


<!-- ADD SITE -->

<div class="card">

<h3 id="formTitle">
➕ Add OOH Site
</h3>

<input
id="editId"
type="hidden"
>

</label>

<input
id="siteName"

>

<label>
Location
</label>

<input
id="siteLocation"

>

<div class="row">

<div>

<label>Latitude</label>

id="latitude"
type="number"

>

<label>Longitude</label>

<div class="row">

<div>

<label>Media Type</label>

<select id="mediaType">

<option>Billboard</option>
<option>Unipole</option>

<option>Digital</option>
<option>Other</option>

</select>

</div>

<div>

<label>Illumination</label>

<select id="illumination">

<option>Lit</option>
<option>Non-Lit</option>
<option>Digital</option>

</select>

</div>

</div>


<div class="row">

<div>

<label>Monthly Rate ₹</label>

<input
id="rate"
type="number"
value="0"
>

</div>

<div>

<label>Status</label>

<select id="status">

<option>Available</option>
<option>Booked</option>
<option>Hold</option>

</div>

</div>

Site Photo

id="photo"

💾 SAVE SITE ONLINE
</button>

onclick="clearForm()"
>
CLEAR FORM

</div>


<!-- SAVED SITES -->

<div class="card">

<h3>
📌 My Saved OOH Sites
</h3>

<input
id="siteSearch"
placeholder="Search saved sites..."
oninput="renderSites()"
>

<div id="siteList"></div>

</div>


</div>


<!-- MAP -->

<div id="map"></div>

</div>


<div id="message"></div>


<!-- LIBRARIES -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>


<script>

/* =========================================================
   IMPORTANT:
   AFTER CREATING YOUR SUPABASE PROJECT,
   PUT YOUR SUPABASE URL AND KEY HERE.
   ========================================================= */

const SUPABASE_URL =
"PASTE_YOUR_SUPABASE_URL_HERE";

const SUPABASE_KEY =
"PASTE_YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY_HERE";


let supabaseClient = null;

let currentUser = null;

let sites = [];

let selectedSites = new Set();

let map;

let markers = [];

let searchMarker = null;

let currentPhoto = "";


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text){

const box =
document.getElementById("message");

box.innerText = text;

box.style.display = "block";

setTimeout(function(){

box.style.display = "none";

},2500);

}


/* =========================================================
   MAP
   ========================================================= */

function initializeMap(){

map =
L.map("map")
.setView(
[19.0760,72.8777],
10
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap contributors"
}
).addTo(map);


/* CLICK MAP */

map.on(
"click",
function(event){

const lat =
event.latlng.lat;

const lng =
event.latlng.lng;

document.getElementById("latitude").value =
lat.toFixed(6);

document.getElementById("longitude").value =
lng.toFixed(6);

placeSearchMarker(
lat,
lng,
"Selected Site"
);

showMessage(
"Coordinates added"
);

}
);

}


/* =========================================================
   SEARCH LAT LONG
   ========================================================= */

function locateCoordinates(){

const lat =
parseFloat(
document.getElementById("searchLat").value
);

const lng =
parseFloat(
document.getElementById("searchLng").value
);


if(
isNaN(lat) ||
isNaN(lng) ||
lat < -90 ||
lat > 90 ||
lng < -180 ||
lng > 180
){

showMessage(
"Please enter valid Latitude and Longitude"
);

return;

}


map.setView(
[lat,lng],
17
);


placeSearchMarker(
lat,
lng,
"Selected Location"
);


/* ALSO PUT COORDINATES IN SAVE FORM */

document.getElementById("latitude").value =
lat;

document.getElementById("longitude").value =
lng;

showMessage(
"Location found on map"
);

}


/* =========================================================
   CURRENT LOCATION
   ========================================================= */

function useMyLocation(){

if(!navigator.geolocation){

showMessage(
"Location not supported"
);

return;

}


navigator.geolocation.getCurrentPosition(

function(position){

const lat =
position.coords.latitude;

const lng =
position.coords.longitude;


document.getElementById("searchLat").value =
lat.toFixed(6);

document.getElementById("searchLng").value =
lng.toFixed(6);

locateCoordinates();

},

function(){

showMessage(
"Please allow location permission"
);

}

);

}


/* =========================================================
   MAP MARKER
   ========================================================= */

function placeSearchMarker(
lat,
lng,
title
){

if(searchMarker){

searchMarker.remove();

}


searchMarker =
L.marker(
[lat,lng]
)
.addTo(map)
.bindPopup(
"<b>"+title+"</b><br>"+
lat.toFixed(6)+
", "+
lng.toFixed(6)
)
.openPopup();

}


/* =========================================================
   SUPABASE SETUP
   ========================================================= */

function initializeSupabase(){

if(
SUPABASE_URL.includes("PASTE_") ||
SUPABASE_KEY.includes("PASTE_")
){

document.getElementById("loginMessage").innerText =
"Supabase setup required. Add your Supabase URL and key in the code.";

return false;

}


supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

return true;

}


/* =========================================================
   SIGN UP
   ========================================================= */

async function signup(){

if(!supabaseClient){

showMessage(
"First add Supabase URL and key"
);

return;

}


const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;


if(!email || password.length < 6){

document.getElementById("loginMessage").innerText =
"Enter email and password of at least 6 characters.";

return;

}


const result =
await supabaseClient.auth.signUp({

email:email,

password:password

});


if(result.error){

document.getElementById("loginMessage").innerText =
result.error.message;

return;

}


document.getElementById("loginMessage").innerText =
"Account created. Check your email if verification is enabled.";

}


/* =========================================================
   LOGIN
   ========================================================= */

async function login(){

if(!supabaseClient){

showMessage(
"First add Supabase URL and key"
);

return;

}


const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;


const result =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});


if(result.error){

document.getElementById("loginMessage").innerText =
result.error.message;

return;

}


showApp(
result.data.user
);

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

await supabaseClient.auth.signOut();

location.reload();

}


/* =========================================================
   SHOW APP
   ========================================================= */

async function showApp(user){

currentUser =
user;

document.getElementById("loginScreen").style.display =
"none";

document.getElementById("userEmail").innerText =
user.email;

await loadSites();

}


/* =========================================================
   LOAD SITES ONLINE
   ========================================================= */

async function loadSites(){

const result =
await supabaseClient
.from("ooh_sites")
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(result.error){

showMessage(
result.error.message
);

return;

}


sites =
result.data || [];

selectedSites.clear();

renderSites();

renderMarkers();

}


/* =========================================================
   SAVE SITE ONLINE
   ========================================================= */

async function saveSite(){

if(!currentUser){

showMessage(
"Please login first"
);

return;

}


const siteName =
document.getElementById("siteName").value.trim();

const location =
document.getElementById("siteLocation").value.trim();

const lat =
parseFloat(
document.getElementById("latitude").value
);

const lng =
parseFloat(
document.getElementById("longitude").value
);


if(!siteName){

showMessage(
"Enter Site Name"
);

return;

}


if(
isNaN(lat) ||
isNaN(lng)
){

showMessage(
"Enter valid coordinates"
);

return;

}


/* PHOTO */

let photoData =
currentPhoto;


const photoFile =
document.getElementById("photo").files[0];


if(photoFile){

photoData =
await convertPhoto(
photoFile
);

}


const siteData = {

user_id:
currentUser.id,

site_name:
siteName,

location:
location,

latitude:
lat,

longitude:
lng,

width_ft:
parseFloat(
document.getElementById("width").value
) || 0,

height_ft:
parseFloat(
document.getElementById("height").value
) || 0,

media_type:
document.getElementById("mediaType").value,

illumination:
document.getElementById("illumination").value,

monthly_rate:
parseFloat(
document.getElementById("rate").value
) || 0,

status:
document.getElementById("status").value,

photo_data:
photoData,

remarks:
document.getElementById("remarks").value

};


const editId =
document.getElementById("editId").value;


let result;


if(editId){

result =
await supabaseClient
.from("ooh_sites")
.update(siteData)
.eq("id",editId)
.select()
.single();

}else{

result =
await supabaseClient
.from("ooh_sites")
.insert(siteData)
.select()
.single();

}


if(result.error){

showMessage(
result.error.message
);

return;

}


if(editId){

sites =
sites.map(
function(site){

return site.id === editId
?
result.data
:
site;

}
);

}else{

sites.unshift(
result.data
);

}


selectedSites.add(
result.data.id
);


renderSites();

renderMarkers();

showMessage(
"Site saved permanently online"
);

clearForm();

}


/* =========================================================
   PHOTO CONVERSION
   ========================================================= */

function convertPhoto(file){

return new Promise(
function(resolve,reject){

const reader =
new FileReader();


reader.onload =
function(event){

const image =
new Image();


image.onload =
function(){

const canvas =
document.createElement(
"canvas"
);

const max =
1200;

let width =
image.width;

let height =
image.height;


if(width > max){

height =
height *
max /
width;

width =
max;

}


if(height > max){

width =
width *
max /
height;

height =
max;

}


canvas.width =
width;

canvas.height =
height;


const context =
canvas.getContext("2d");


context.drawImage(
image,
0,
0,
width,
height
);


resolve(
canvas.toDataURL(
"image/jpeg",
0.75
)
);

};


image.src =
event.target.result;

};


reader.onerror =
reject;

reader.readAsDataURL(file);

}
);

}


/* =========================================================
   PHOTO PREVIEW
   ========================================================= */

function previewPhoto(event){

const file =
event.target.files[0];


if(!file){

return;

}


const reader =
new FileReader();


reader.onload =
function(e){

const img =
document.getElementById(
"photoPreview"
);

img.src =
e.target.result;

img.style.display =
"block";

currentPhoto =
e.target.result;

};


reader.readAsDataURL(file);

}


/* =========================================================
   RENDER MARKERS
   ========================================================= */

function renderMarkers(){

markers.forEach(
function(marker){

marker.remove();

}
);

markers = [];


sites.forEach(
function(site){

const marker =
L.marker(
[
site.latitude,
site.longitude
]
)
.addTo(map);


marker.bindPopup(

"<b>"+
escapeHtml(site.site_name)+
"</b><br>"+

escapeHtml(
site.location || ""
)+

"<br><br>"+

"Size: "+
site.width_ft+
" × "+
site.height_ft+
" ft<br>"+

"Rate: ₹"+
Number(
site.monthly_rate || 0
).toLocaleString("en-IN")+
"<br>"+

"Status: "+
escapeHtml(site.status)

);


marker.on(
"click",
function(){

selectedSites.add(
site.id
);

renderSites();

}
);


markers.push(
marker
);

}
);

}


/* =========================================================
   RENDER SAVED SITES
   ========================================================= */

function renderSites(){

const list =
document.getElementById(
"siteList"
);


const search =
document.getElementById(
"siteSearch"
).value.toLowerCase();


const filtered =
sites.filter(
function(site){

return (

site.site_name
+
" "+
(site.location || "")

)
.toLowerCase()
.includes(search);

}
);


list.innerHTML =
"";


filtered.forEach(
function(site){

const div =
document.createElement(
"div"
);

div.className =
"site";


const selected =
selectedSites.has(
site.id
);


div.innerHTML =

"<div class='site-name'>"+
(selected ? "☑ " : "☐ ")+
escapeHtml(site.site_name)+
"</div>"+

"<div class='small'>"+
escapeHtml(
site.location || ""
)+
"</div>"+

"<div class='small'>"+
site.latitude+
", "+
site.longitude+
"</div>"+

"<div class='small'>"+
site.width_ft+
" × "+
site.height_ft+
" ft | ₹"+
Number(
site.monthly_rate || 0
).toLocaleString("en-IN")+
"</div>"+

"<div class='site-buttons'>"+

"<button class='blue' onclick=\"viewSite('"+
site.id+
"')\">MAP</button>"+

"<button class='gray' onclick=\"selectSite('"+
site.id+
"')\">"+
(selected ? "UNSELECT" : "SELECT")+
"</button>"+

"<button class='gray' onclick=\"editSite('"+
site.id+
"')\">EDIT</button>"+

"<button class='red' onclick=\"deleteSite('"+
site.id+
"')\">DELETE</button>"+

"</div>";


list.appendChild(
div
);

}
);


document.getElementById(
"totalSites"
).innerText =
sites.length;


document.getElementById(
"selectedSites"
).innerText =
selectedSites.size;

}


/* =========================================================
   SELECT SITE
   ========================================================= */

function selectSite(id){

if(
selectedSites.has(id)
){

selectedSites.delete(id);

}else{

selectedSites.add(id);

}

renderSites();

}


/* =========================================================
   VIEW SITE
   ========================================================= */

function viewSite(id){

const site =
sites.find(
function(s){

return s.id === id;

}
);


if(!site)return;


map.setView(
[
site.latitude,
site.longitude
],
17
);


placeSearchMarker(
site.latitude,
site.longitude,
site.site_name
);

}


/* =========================================================
   EDIT SITE
   ========================================================= */

function editSite(id){

const site =
sites.find(
function(s){

return s.id === id;

}
);


if(!site)return;


document.getElementById(
"editId"
).value =
site.id;


document.getElementById(
"siteName"
).value =
site.site_name;


document.getElementById(
"siteLocation"
).value =
site.location || "";


document.getElementById(
"latitude"
).value =
site.latitude;


document.getElementById(
"longitude"
).value =
site.longitude;


document.getElementById(
"width"
).value =
site.width_ft;


document.getElementById(
"height"
).value =
site.height_ft;


document.getElementById(
"mediaType"
).value =
site.media_type;


document.getElementById(
"illumination"
).value =
site.illumination;


document.getElementById(
"rate"
).value =
site.monthly_rate;


document.getElementById(
"status"
).value =
site.status;


document.getElementById(
"remarks"
).value =
site.remarks || "";


currentPhoto =
site.photo_data || "";


if(site.photo_data){

const image =
document.getElementById(
"photoPreview"
);

image.src =
site.photo_data;

image.style.display =
"block";

}


document.getElementById(
"formTitle"
).innerText =
"✏️ Edit OOH Site";


viewSite(id);

}


/* =========================================================
   DELETE SITE
   ========================================================= */

async function deleteSite(id){

if(
!confirm(
"Delete this site permanently?"
)
){

return;

}


const result =
await supabaseClient
.from("ooh_sites")
.delete()
.eq(
"id",
id
);


if(result.error){

showMessage(
result.error.message
);

return;

}


sites =
sites.filter(
function(site){

return site.id !== id;

}
);


selectedSites.delete(
id
);


renderSites();

renderMarkers();

showMessage(
"Site deleted"
);

}

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(text){

return String(text || "")
.replace(
/[&<>"']/g,
function(match){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[match];

}
);

}

);

);

data.map(

"Latitude":
site.latitude,

"Longitude":
site.longitude,

site.width_ft,

site.height_ft,

site.status,

site.remarks,

);

);

);
