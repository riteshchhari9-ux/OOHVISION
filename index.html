<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY VISION OOH</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f5f8;
  color:#172033;
}

header{
  height:64px;
  background:#101827;
  color:white;
  display:flex;
  align-items:center;
  padding:0 18px;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#20aef3;
}

.header-actions{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
}

.user-email{
  font-size:12px;
  color:#cbd5e1;
  margin-right:8px;
}

button{
  border:0;
  border-radius:7px;
  padding:9px 12px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:.9;
}

.btn-blue{
  background:#0787c8;
  color:white;
}

.btn-green{
  background:#16a34a;
  color:white;
}

.btn-red{
  background:#dc2626;
  color:white;
}

.btn-gray{
  background:#e5e7eb;
  color:#111827;
}

.full{
  width:100%;
  margin-top:8px;
}

.main{
  display:grid;
  grid-template-columns:390px 1fr;
  height:calc(100vh - 64px);
}

.sidebar{
  background:white;
  border-right:1px solid #ddd;
  overflow-y:auto;
  padding:12px;
}

.map-container{
  position:relative;
}

#map{
  width:100%;
  height:100%;
}

.card{
  background:white;
  border:1px solid #dce1e7;
  border-radius:10px;
  padding:14px;
  margin-bottom:12px;
}

.card h3{
  margin:0 0 12px;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin:8px 0 4px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:6px;
  padding:9px;
  font-size:14px;
}

textarea{
  resize:vertical;
  min-height:70px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.stat{
  background:#f1f5f9;
  padding:10px;
  border-radius:8px;
}

.stat strong{
  display:block;
  font-size:22px;
  margin-top:3px;
}

.site{
  border:1px solid #d8dee6;
  border-radius:9px;
  padding:9px;
  margin-top:8px;
  background:#fff;
}

.saved-site-row{
  display:flex;
  gap:10px;
  align-items:center;
}

.saved-site-image{
  width:82px;
  height:68px;
  flex-shrink:0;
}

.saved-site-photo{
  width:82px;
  height:68px;
  object-fit:cover;
  border-radius:7px;
  cursor:pointer;
  border:1px solid #d1d5db;
}

.no-site-photo{
  width:82px;
  height:68px;
  background:#e5e7eb;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.saved-site-details{
  flex:1;
  min-width:0;
}

.site-name{
  font-weight:bold;
  font-size:14px;
  word-break:break-word;
}

.site-info{
  font-size:11px;
  color:#64748b;
  margin-top:4px;
  line-height:1.5;
}

.site-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px;
}

.site-buttons button{
  padding:6px 8px;
  font-size:10px;
}

.photo-preview{
  max-width:100%;
  max-height:150px;
  border-radius:7px;
  margin-top:7px;
  display:none;
}

.empty{
  text-align:center;
  color:#64748b;
  padding:15px 5px;
  font-size:13px;
}

#message{
  position:fixed;
  z-index:99999;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  background:#111827;
  color:white;
  padding:11px 18px;
  border-radius:8px;
  display:none;
}

#loginScreen{
  position:fixed;
  inset:0;
  background:#101827;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100000;
}

.login-box{
  width:380px;
  max-width:92%;
  background:white;
  border-radius:14px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.login-logo{
  text-align:center;
  font-size:27px;
  font-weight:800;
  margin-bottom:8px;
}

.login-logo span{
  color:#0787c8;
}

.login-subtitle{
  text-align:center;
  color:#64748b;
  font-size:13px;
  margin-bottom:20px;
}

.auth-message{
  margin-top:10px;
  font-size:13px;
  text-align:center;
  color:#dc2626;
}

.auth-switch{
  text-align:center;
  margin-top:15px;
  font-size:13px;
  color:#64748b;
}

.auth-switch span{
  color:#0787c8;
  font-weight:bold;
  cursor:pointer;
}

.hidden{
  display:none !important;
}

@media(max-width:850px){

  header{
    height:auto;
    min-height:64px;
    flex-wrap:wrap;
    padding:10px;
  }

  .header-actions{
    margin-left:auto;
  }

  .main{
    display:block;
    height:auto;
  }

  .sidebar{
    height:auto;
  }

  #map{
    height:60vh;
  }

  .user-email{
    display:none;
  }

}

</style>

</head>

</div>


<!-- MAIN APP -->

<header>

<div class="main">

  <div class="sidebar">

    <!-- CAMPAIGN -->

    <!-- LOCATION -->

    <div class="card">

        id="locationSearch"

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://fbzwaqeqndnaveuqiqtu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_PuG3tL1I_UOvL77prZ2-iA_3Ga2DU49";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GLOBALS
   ========================================================= */

let currentUser = null;

let sites = [];

let selectedSites = new Set();

let map = null;

let markers = [];

let searchMarker = null;


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text){

  const box =
    document.getElementById("message");

  box.innerText = text;

  box.style.display = "block";

  clearTimeout(window.messageTimer);

  window.messageTimer =
    setTimeout(function(){

      box.style.display = "none";

    },2500);

}


/* =========================================================
   AUTH UI
   ========================================================= */

function showSignup(){

  document.getElementById("loginForm")
    .classList.add("hidden");

  document.getElementById("signupForm")
    .classList.remove("hidden");

  document.getElementById("authMessage")
    .innerText = "";

}


function showLogin(){

  document.getElementById("signupForm")
    .classList.add("hidden");

  document.getElementById("loginForm")
    .classList.remove("hidden");

  document.getElementById("authMessage")
    .innerText = "";

}


/* =========================================================
   SIGNUP
   ========================================================= */

async function signupUser(){

  const email =
    document.getElementById("signupEmail")
      .value.trim();

  const password =
    document.getElementById("signupPassword")
      .value;

  if(!email || !password){

    setAuthMessage(
      "Enter email and password."
    );

    return;

  }

  if(password.length < 6){

    setAuthMessage(
      "Password must be at least 6 characters."
    );

    return;

  }

  setAuthMessage("Creating account...");

  const { data, error } =
    await supabaseClient.auth.signUp({
      email,
      password
    });

  if(error){

    setAuthMessage(error.message);

    return;

  }

  if(data.session){

    currentUser = data.user;

    await enterApplication();

  }
  else{

    setAuthMessage(
      "Account created. Check your email to confirm your account, then login."
    );

  }

}


/* =========================================================
   LOGIN
   ========================================================= */

async function loginUser(){

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  if(!email || !password){

    setAuthMessage(
      "Enter email and password."
    );

    return;

  }

  setAuthMessage("Logging in...");

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    setAuthMessage(error.message);

    return;

  }

  currentUser = data.user;

  await enterApplication();

}


function setAuthMessage(text){

  document.getElementById(
    "authMessage"
  ).innerText = text;

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logoutUser(){

  await supabaseClient.auth.signOut();

  currentUser = null;

  sites = [];

  selectedSites.clear();

  document.getElementById(
    "loginScreen"
  ).style.display = "flex";

  showLogin();

}


/* =========================================================
   ENTER APP
   ========================================================= */

async function enterApplication(){

  document.getElementById(
    "loginScreen"
  ).style.display = "none";

  document.getElementById(
    "userEmail"
  ).innerText =
    currentUser.email;

  initializeMap();

  await loadSites();

}


/* =========================================================
   LOAD SITES FROM SUPABASE
   ========================================================= */

async function loadSites(){

  showMessage("Loading sites...");

  const { data, error } =
    await supabaseClient
      .from("sites")
      .select("*")
      .eq("user_id", currentUser.id)
      .order("created_at", {
        ascending:false
      });

  if(error){

    console.error(error);

    showMessage(
      "Could not load sites"
    );

    return;

  }

  sites = data || [];

  selectedSites.clear();

  renderSites();

  renderMarkers();

  showMessage(
    sites.length + " site(s) loaded"
  );

}


/* =========================================================
   SAVE SITE
   ========================================================= */

async function saveSite(){

  if(!currentUser){

    return;

  }

  const name =
    document.getElementById("siteName")
      .value.trim();

  const location =
    document.getElementById("siteLocation")
      .value.trim();

  const lat =
    parseFloat(
      document.getElementById("latitude").value
    );

  const lng =
    parseFloat(
      document.getElementById("longitude").value
    );

  if(!name){

    showMessage(
      "Enter Site Name / ID"
    );

    return;

  }

  if(
    Number.isNaN(lat) ||
    Number.isNaN(lng)
  ){

    showMessage(
      "Select a location first"
    );

    return;

  }

  let photoURL =
    document.getElementById(
      "photoPreview"
    ).dataset.url || null;


  /* PHOTO UPLOAD */

  const photoFile =
    document.getElementById(
      "photo"
    ).files[0];


  if(photoFile){

    showMessage(
      "Uploading photo..."
    );

    const extension =
      photoFile.name
        .split(".")
        .pop()
        .toLowerCase();

    const fileName =
      currentUser.id +
      "/" +
      crypto.randomUUID() +
      "." +
      extension;


    const { error: uploadError } =
      await supabaseClient.storage
        .from("site-photos")
        .upload(
          fileName,
          photoFile,
          {
            upsert:false
          }
        );


    if(uploadError){

      console.error(uploadError);

      showMessage(
        "Photo upload failed"
      );

      return;

    }


    const { data:urlData } =
      supabaseClient.storage
        .from("site-photos")
        .getPublicUrl(fileName);

    photoURL =
      urlData.publicUrl;

  }


  const editId =
    document.getElementById(
      "editId"
    ).value;


  const siteData = {

    site_name:name,

    location:location,

    latitude:lat,

    longitude:lng,

    width:
      Number(
        document.getElementById("width").value
      ) || 0,

    height:
      Number(
        document.getElementById("height").value
      ) || 0,

    media_type:
      document.getElementById(
        "mediaType"
      ).value,

    illumination:
      document.getElementById(
        "illumination"
      ).value,

    monthly_rate:
      Number(
        document.getElementById("rate").value
      ) || 0,

    status:
      document.getElementById(
        "status"
      ).value,

    photo_url:
      photoURL,

    remarks:
      document.getElementById(
        "remarks"
      ).value,

    updated_at:
      new Date().toISOString()

  };


  let result;


  if(editId){

    result =
      await supabaseClient
        .from("sites")
        .update(siteData)
        .eq("id",editId)
        .eq("user_id",currentUser.id)
        .select()
        .single();

  }
  else{

    siteData.user_id =
      currentUser.id;

    result =
      await supabaseClient
        .from("sites")
        .insert(siteData)
        .select()
        .single();

  }


  if(result.error){

    console.error(result.error);

    showMessage(
      "Could not save site"
    );

    return;

  }


  if(editId){

    const index =
      sites.findIndex(
        site => site.id === editId
      );

    if(index !== -1){

      sites[index] =
        result.data;

    }

    showMessage(
      "Site updated successfully"
    );

  }
  else{

    sites.unshift(
      result.data
    );

    selectedSites.add(
      result.data.id
    );

    showMessage(
      "Site saved to cloud"
    );

  }


  renderSites();

  renderMarkers();

  clearForm();

}


/* =========================================================
   MAP
   ========================================================= */

function initializeMap(){

  if(map){

    setTimeout(function(){

      map.invalidateSize();

    },200);

    return;

  }


  map =
    L.map("map")
      .setView(
        [19.0760,72.8777],
        11
      );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:
        "© OpenStreetMap contributors"
    }
  ).addTo(map);


  map.on(
    "click",
    function(event){

      const lat =
        event.latlng.lat;

      const lng =
        event.latlng.lng;


      document.getElementById(
        "latitude"
      ).value =
        lat.toFixed(6);


      document.getElementById(
        "longitude"
      ).value =
        lng.toFixed(6);


      document.getElementById(
        "searchLat"
      ).value =
        lat.toFixed(6);


      document.getElementById(
        "searchLng"
      ).value =
        lng.toFixed(6);


      placeSearchMarker(
        lat,
        lng,
        "Selected Location"
      );

    }
  );

}


/* =========================================================
   LOCATION SEARCH
   ========================================================= */

async function searchLocation(){

  const query =
    document.getElementById(
      "locationSearch"
    ).value.trim();

  if(!query){

    showMessage(
      "Enter a location"
    );

    return;

  }

  showMessage("Searching...");

  try{

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json&limit=1&q=" +
      encodeURIComponent(query);


    const response =
      await fetch(url);

    const data =
      await response.json();


    if(!data.length){

      showMessage(
        "Location not found"
      );

      return;

    }


    const result =
      data[0];


    showLocation(
      parseFloat(result.lat),
      parseFloat(result.lon),
      result.display_name
    );

  }
  catch(error){

    console.error(error);

    showMessage(
      "Location search failed"
    );

  }

}


/* =========================================================
   COORDINATES
   ========================================================= */

function searchCoordinates(){

  const lat =
    parseFloat(
      document.getElementById(
        "searchLat"
      ).value
    );

  const lng =
    parseFloat(
      document.getElementById(
        "searchLng"
      ).value
    );


  if(
    Number.isNaN(lat) ||
    Number.isNaN(lng)
  ){

    showMessage(
      "Enter valid coordinates"
    );

    return;

  }


  showLocation(
    lat,
    lng,
    "Selected Coordinates"
  );

}


/* =========================================================
   SHOW LOCATION
   ========================================================= */

function showLocation(
  lat,
  lng,
  name
){

  map.setView(
    [lat,lng],
    17
  );


  placeSearchMarker(
    lat,
    lng,
    name
  );


  document.getElementById(
    "latitude"
  ).value =
    lat.toFixed(6);


  document.getElementById(
    "longitude"
  ).value =
    lng.toFixed(6);


  document.getElementById(
    "searchLat"
  ).value =
    lat.toFixed(6);


  document.getElementById(
    "searchLng"
  ).value =
    lng.toFixed(6);


  if(
    name !== "Selected Coordinates"
  ){

    document.getElementById(
      "siteLocation"
    ).value =
      name;

  }


  const box =
    document.getElementById(
      "locationResult"
    );


  box.style.display =
    "block";


  box.innerHTML =
    "<b>📍 Location Found</b><br>" +
    escapeHTML(name) +
    "<br><br>" +
    "<b>Lat:</b> " +
    lat.toFixed(6) +
    "<br>" +
    "<b>Long:</b> " +
    lng.toFixed(6);

}


/* =========================================================
   SEARCH MARKER
   ========================================================= */

function placeSearchMarker(
  lat,
  lng,
  name
){

  if(searchMarker){

    searchMarker.remove();

  }


  searchMarker =
    L.marker(
      [lat,lng]
    )
    .addTo(map)
    .bindPopup(
      "<b>📍 " +
      escapeHTML(name) +
      "</b><br><br>" +
      lat.toFixed(6) +
      ", " +
      lng.toFixed(6)
    )
    .openPopup();

}


/* =========================================================
   MY LOCATION
   ========================================================= */

function useMyLocation(){

  if(!navigator.geolocation){

    showMessage(
      "Geolocation not supported"
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      showLocation(
        position.coords.latitude,
        position.coords.longitude,
        "My Current Location"
      );

    },

    function(){

      showMessage(
        "Allow location permission"
      );

    }

  );

}


/* =========================================================
   MARKERS
   ========================================================= */

function renderMarkers(){

  markers.forEach(
    marker => marker.remove()
  );

  markers = [];


  sites.forEach(
    function(site){

      if(
        Number.isNaN(
          Number(site.latitude)
        ) ||
        Number.isNaN(
          Number(site.longitude)
        )
      ){

        return;

      }


      const marker =
        L.marker([
          Number(site.latitude),
          Number(site.longitude)
        ])
        .addTo(map);


      let popup =
        "<b>" +
        escapeHTML(site.site_name) +
        "</b><br>" +

        escapeHTML(
          site.location || ""
        ) +

        "<br><br>" +

        "Size: " +
        site.width +
        " × " +
        site.height +
        " ft<br>" +

        "Media: " +
        escapeHTML(
          site.media_type
        ) +

        "<br>" +

        "Rate: ₹" +
        Number(
          site.monthly_rate || 0
        ).toLocaleString("en-IN") +

        "<br>" +

        "Status: " +
        escapeHTML(
          site.status
        );


      if(site.photo_url){

        popup +=
          "<br><br>" +
          "<img src='" +
          site.photo_url +
          "' style='width:180px;height:120px;object-fit:cover;border-radius:6px'>";

      }


      marker.bindPopup(
        popup
      );


      marker.on(
        "click",
        function(){

          selectedSites.add(
            site.id
          );

          renderSites();

        }
      );


      markers.push(marker);

    }
  );

}


/* =========================================================
   SITE LIST
   ========================================================= */

function renderSites(){

  const list =
    document.getElementById(
      "siteList"
    );


  const search =
    document.getElementById(
      "siteSearch"
    ).value
      .toLowerCase()
      .trim();


  const filtered =
    sites.filter(
      function(site){

        const text =
          [
            site.site_name,
            site.location,
            site.latitude,
            site.longitude,
            site.media_type,
            site.status,
            site.width,
            site.height,
            site.remarks
          ]
          .join(" ")
          .toLowerCase();


        return text.includes(search);

      }
    );


  list.innerHTML = "";


  if(!filtered.length){

    list.innerHTML =
      "<div class='empty'>" +
      "No saved sites found" +
      "</div>";

  }


  filtered.forEach(
    function(site){

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "site";


      const selected =
        selectedSites.has(
          site.id
        );


      let photoHTML;


      if(site.photo_url){

        photoHTML =
          "<img " +
          "src='" +
          escapeAttribute(site.photo_url) +
          "' " +
          "class='saved-site-photo' " +
          "onclick=\"viewSite('" +
          site.id +
          "')\">";

      }
      else{

        photoHTML =
          "<div class='no-site-photo'>📷</div>";

      }


      div.innerHTML =

        "<div class='saved-site-row'>" +

          "<div class='saved-site-image'>" +
            photoHTML +
          "</div>" +

          "<div class='saved-site-details'>" +

            "<div class='site-name'>" +

              (selected ? "☑ " : "☐ ") +

              escapeHTML(
                site.site_name
              ) +

            "</div>" +

            "<div class='site-info'>" +

              escapeHTML(
                site.location || ""
              ) +

              "<br>" +

              "📍 " +
              site.latitude +
              ", " +
              site.longitude +

              "<br>" +

              "📐 " +
              site.width +
              " × " +
              site.height +
              " ft" +

              "<br>" +

              escapeHTML(
                site.media_type || ""
              ) +

              " | " +

              escapeHTML(
                site.status || ""
              ) +

            "</div>" +

          "</div>" +

        "</div>" +


        "<div class='site-buttons'>" +

          "<button " +
          "class='btn-blue' " +
          "onclick=\"viewSite('" +
          site.id +
          "')\">" +
          "MAP" +
          "</button>" +

          "<button " +
          "class='btn-gray' " +
          "onclick=\"selectSite('" +
          site.id +
          "')\">" +
          (
            selected ?
            "UNSELECT" :
            "SELECT"
          ) +
          "</button>" +

          "<button " +
          "class='btn-gray' " +
          "onclick=\"editSite('" +
          site.id +
          "')\">" +
          "EDIT" +
          "</button>" +

          "<button " +
          "class='btn-red' " +
          "onclick=\"deleteSite('" +
          site.id +
          "')\">" +
          "DELETE" +
          "</button>" +

        "</div>";


      list.appendChild(
        div
      );

    }
  );


  document.getElementById(
    "totalSites"
  ).innerText =
    sites.length;


  document.getElementById(
    "selectedSites"
  ).innerText =
    selectedSites.size;

}


/* =========================================================
   SELECT
   ========================================================= */

function selectSite(id){

  if(
    selectedSites.has(id)
  ){

    selectedSites.delete(id);

  }
  else{

    selectedSites.add(id);

  }


  renderSites();

}


/* =========================================================
   VIEW SITE
   ========================================================= */

function viewSite(id){

  const site =
    sites.find(
      item => item.id === id
    );


  if(!site){

    return;

  }


  map.setView(
    [
      Number(site.latitude),
      Number(site.longitude)
    ],
    17
  );


  placeSearchMarker(
    Number(site.latitude),
    Number(site.longitude),
    site.site_name
  );


  selectedSites.add(
    site.id
  );


  renderSites();

}


/* =========================================================
   EDIT
   ========================================================= */

function editSite(id){

  const site =
    sites.find(
      item => item.id === id
    );


  if(!site){

    return;

  }


  document.getElementById(
    "editId"
  ).value =
    site.id;


  document.getElementById(
    "siteName"
  ).value =
    site.site_name;


  document.getElementById(
    "siteLocation"
  ).value =
    site.location || "";


  document.getElementById(
    "latitude"
  ).value =
    site.latitude;


  document.getElementById(
    "longitude"
  ).value =
    site.longitude;


  document.getElementById(
    "width"
  ).value =
    site.width;


  document.getElementById(
    "height"
  ).value =
    site.height;


  document.getElementById(
    "mediaType"
  ).value =
    site.media_type;


  document.getElementById(
    "illumination"
  ).value =
    site.illumination;


  document.getElementById(
    "rate"
  ).value =
    site.monthly_rate;


  document.getElementById(
    "status"
  ).value =
    site.status;


  document.getElementById(
    "remarks"
  ).value =
    site.remarks || "";


  const preview =
    document.getElementById(
      "photoPreview"
    );


  preview.dataset.url =
    site.photo_url || "";


  if(site.photo_url){

    preview.src =
      site.photo_url;

    preview.style.display =
      "block";

  }
  else{

    preview.style.display =
      "none";

  }


  document.getElementById(
    "formTitle"
  ).innerText =
    "✏️ Edit OOH Site";


  viewSite(id);

}


/* =========================================================
   DELETE
   ========================================================= */

async function deleteSite(id){

  const site =
    sites.find(
      item => item.id === id
    );


  if(!site){

    return;

  }


  if(
    !confirm(
      "Delete " +
      site.site_name +
      " permanently?"
    )
  ){

    return;

  }


  const { error } =
    await supabaseClient
      .from("sites")
      .delete()
      .eq("id",id)
      .eq("user_id",currentUser.id);


  if(error){

    console.error(error);

    showMessage(
      "Could not delete site"
    );

    return;

  }


  sites =
    sites.filter(
      site => site.id !== id
    );


  selectedSites.delete(id);

  renderSites();

  renderMarkers();

  showMessage(
    "Site deleted"
  );

}


/* =========================================================
   CLEAR FORM
   ========================================================= */

function clearForm(){

  document.getElementById(
    "editId"
  ).value = "";


  document.getElementById(
    "siteName"
  ).value = "";


  document.getElementById(
    "siteLocation"
  ).value = "";


  document.getElementById(
    "latitude"
  ).value = "";


  document.getElementById(
    "longitude"
  ).value = "";


  document.getElementById(
    "remarks"
  ).value = "";


  document.getElementById(
    "photo"
  ).value = "";


  const preview =
    document.getElementById(
      "photoPreview"
    );


  preview.src = "";

  preview.dataset.url = "";

  preview.style.display =

  document.getElementById(
    "formTitle"

}


/* =========================================================
   EXCEL
   ========================================================= */

function exportExcel(){

  const data =
    sites.filter(
      site =>
        selectedSites.size === 0 ||
        selectedSites.has(site.id)
    );


  if(!data.length){

    showMessage(
      "No sites to export"
    );

    return;

  }


  const rows =
    data.map(
      function(site,index){

        return {

          "S.No":
            index + 1,

          "Site Name / ID":
            site.site_name,

          "Location":
            site.location,

          "Latitude":
            site.latitude,

          "Longitude":
            site.longitude,

          "Width (ft)":
            site.width,

          "Height (ft)":
            site.height,

          "Media Type":
            site.media_type,

          "Illumination":
            site.illumination,

          "Monthly Rate":
            site.monthly_rate,

          "Status":
            site.status,

          "Remarks":
            site.remarks,

          "Google Maps":
            "https://www.google.com/maps?q=" +
            site.latitude +
            "," +
            site.longitude

        };

      }
    );


  const worksheet =
    XLSX.utils.json_to_sheet(
      rows
    );


  const workbook =
    XLSX.utils.book_new();


  XLSX.utils.book_append_sheet(
    workbook,
    worksheet,
    "OOH Sites"
  );


  XLSX.writeFile(
    workbook,
    "My_Vision_OOH_Sites.xlsx"
  );


  showMessage(
    "Excel downloaded"
  );

}

/* =========================================================
   SECURITY HELPERS
   ========================================================= */

function escapeHTML(text){

  return String(text || "")
    .replace(
      /[&<>"']/g,
      function(character){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[character];

      }
    );

}


function escapeAttribute(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}

    async function(event,session){

      if(
        event === "SIGNED_IN" &&
        session
      ){

        currentUser =
          session.user;

      }

    }
  );

}
