<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Vision OOH — Professional Site Planner</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
:root{
  --bg:#eef3f8;
  --panel:#ffffff;
  --panel2:#f7f9fc;
  --text:#172033;
  --muted:#718096;
  --primary:#087cf5;
  --primary2:#00c6ff;
  --green:#18a86b;
  --orange:#ff9d2e;
  --red:#ef476f;
  --border:#dce5ef;
  --shadow:0 12px 35px rgba(38,62,90,.12);
  --shadow2:0 5px 18px rgba(38,62,90,.10);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 0%,rgba(0,198,255,.10),transparent 30%),
    radial-gradient(circle at 90% 10%,rgba(8,124,245,.10),transparent 30%),
    var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* HEADER */

.topbar{
  height:72px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:relative;
  z-index:2000;
  box-shadow:0 3px 18px rgba(30,60,90,.08);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logoBox{
  width:42px;
  height:42px;
  border-radius:13px;
  background:linear-gradient(135deg,#087cf5,#00d4ff);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:900;
  box-shadow:0 7px 18px rgba(8,124,245,.30);
}

.brandText{
  font-size:21px;
  font-weight:900;
  letter-spacing:-.6px;
}

.brandText span{
  color:#00aeea;
}

.tagline{
  color:#718096;
  font-size:13px;
  margin-left:4px;
}

.headerActions{
  display:flex;
  gap:9px;
  align-items:center;
}

.btn{
  border:0;
  border-radius:11px;
  padding:11px 16px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
  display:flex;
  align-items:center;
  gap:7px;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 18px rgba(0,0,0,.12);
}

.btnBlue{
  background:linear-gradient(135deg,#087cf5,#00bdf5);
  color:white;
}

.btnGreen{
  background:linear-gradient(135deg,#13a765,#27c889);
  color:white;
}

.btnLight{
  background:white;
  color:#334155;
  border:1px solid var(--border);
}

.btnRed{
  background:#fff0f3;
  color:#e6395d;
  border:1px solid #ffd2dc;
}

/* LAYOUT */

.app{
  height:calc(100vh - 72px);
  display:grid;
  grid-template-columns:390px 1fr;
}

/* SIDEBAR */

.sidebar{
  background:rgba(255,255,255,.94);
  border-right:1px solid var(--border);
  overflow-y:auto;
  padding:17px;
  z-index:1000;
}

.sidebar::-webkit-scrollbar{
  width:6px;
}

.sidebar::-webkit-scrollbar-thumb{
  background:#cbd5e1;
  border-radius:10px;
}

.section{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:var(--shadow2);
}

.sectionTitle{
  font-size:13px;
  font-weight:900;
  letter-spacing:.8px;
  text-transform:uppercase;
  color:#8090a5;
  margin-bottom:12px;
}

.input{
  width:100%;
  border:1px solid var(--border);
  background:#f8fafc;
  padding:12px 13px;
  border-radius:11px;
  outline:none;
  font-size:14px;
  color:var(--text);
  transition:.2s;
}

.input:focus{
  border-color:#36aaf7;
  box-shadow:0 0 0 4px rgba(8,124,245,.09);
  background:white;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.stat{
  padding:13px 9px;
  border-radius:13px;
  background:linear-gradient(145deg,#f8fbff,#edf4fa);
  border:1px solid #e1eaf3;
  text-align:center;
}

.statNum{
  font-size:22px;
  font-weight:900;
}

.statLabel{
  font-size:10px;
  text-transform:uppercase;
  color:#8492a6;
  font-weight:800;
  margin-top:3px;
}

/* SELECTED SITES */

.selectedHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.selectedHeader h3{
  margin:0;
  font-size:17px;
}

.siteList{
  display:flex;
  flex-direction:column;
  gap:9px;
  max-height:430px;
  overflow-y:auto;
}

.siteList::-webkit-scrollbar{
  width:5px;
}

.siteList::-webkit-scrollbar-thumb{
  background:#ccd7e4;
  border-radius:10px;
}

.siteCard{
  background:white;
  border:1px solid #dce5ef;
  border-radius:14px;
  padding:8px;
  display:flex;
  gap:10px;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 4px 13px rgba(30,60,90,.06);
}

.siteCard:hover{
  transform:translateY(-2px);
  border-color:#69b8fa;
  box-shadow:0 9px 20px rgba(8,124,245,.12);
}

.siteThumb{
  width:66px;
  height:58px;
  object-fit:cover;
  border-radius:9px;
  background:#e9eef4;
  flex-shrink:0;
}

.siteInfo{
  min-width:0;
  flex:1;
}

.siteName{
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.siteLocation{
  font-size:10px;
  color:#77859a;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:4px;
}

.siteMeta{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-top:6px;
}

.badge{
  padding:3px 6px;
  border-radius:5px;
  background:#eef6ff;
  color:#087cf5;
  font-size:9px;
  font-weight:800;
}

.removeBtn{
  border:0;
  background:#fff1f3;
  color:#e6395d;
  width:25px;
  height:25px;
  border-radius:7px;
  cursor:pointer;
  font-weight:900;
}

/* MAP */

.mapArea{
  position:relative;
  padding:12px;
  background:
    linear-gradient(135deg,#dfeaf4,#f6f9fc);
}

.mapFrame{
  height:100%;
  border-radius:22px;
  overflow:hidden;
  position:relative;
  box-shadow:
    0 20px 55px rgba(31,55,80,.20),
    inset 0 0 0 1px rgba(255,255,255,.8);
  border:1px solid rgba(255,255,255,.9);
}

#map{
  width:100%;
  height:100%;
}

/* 3D MAP CONTROL */

.mapTopCard{
  position:absolute;
  top:18px;
  left:20px;
  z-index:900;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.9);
  border-radius:15px;
  padding:11px 14px;
  box-shadow:0 10px 30px rgba(25,55,85,.16);
}

.mapTopTitle{
  font-size:12px;
  font-weight:900;
}

.mapTopSub{
  color:#718096;
  font-size:10px;
  margin-top:3px;
}

/* SITE FORM */

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.formFull{
  grid-column:1/-1;
}

/* TOAST */

#toast{
  position:fixed;
  right:25px;
  bottom:25px;
  z-index:9999;
  background:#172033;
  color:white;
  padding:13px 18px;
  border-radius:12px;
  box-shadow:0 15px 35px rgba(0,0,0,.22);
  transform:translateY(100px);
  opacity:0;
  transition:.3s;
  font-size:13px;
  font-weight:700;
}

#toast.show{
  transform:translateY(0);
  opacity:1;
}

/* CLOUD */

.cloudStatus{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  font-weight:800;
  color:#18a86b;
}

.cloudDot{
  width:8px;
  height:8px;
  background:#18c77d;
  border-radius:50%;
  box-shadow:0 0 0 4px rgba(24,199,125,.12);
}

/* RESPONSIVE */

@media(max-width:900px){

  body{
    overflow:auto;
  }

  .topbar{
    height:auto;
    min-height:70px;
    flex-wrap:wrap;
    padding:10px;
    gap:8px;
  }

  .tagline{
    display:none;
  }

  .app{
    height:auto;
    display:flex;
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    max-height:none;
  }

  .mapArea{
    height:600px;
  }

  .headerActions{
    width:100%;
    justify-content:flex-end;
  }
}
</style>
</head>

<body>

<header class="topbar">

  <div class="brand">
    <div class="logoBox">MV</div>

    <div>
      <div class="brandText">
        MY VISION <span>OOH</span>
      </div>
      <div class="tagline">
        Professional Outdoor Advertising Site Planner
      </div>
    </div>
  </div>

  <div class="headerActions">

    <button class="btn btnLight" onclick="exportExcel()">
      📊 Excel
    </button>

    <button class="btn btnBlue" onclick="exportPPT()">
      📑 PPT
    </button>

    <button class="btn btnGreen" onclick="saveCurrentSite()">
      ☁ Save Site
    </button>

  </div>

</header>


<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="section">

      <div class="sectionTitle">
        Project
      </div>

      <input
        id="campaignName"
        class="input"
        placeholder="Client / Campaign Name"
      >

      <div style="height:12px"></div>

      <div class="stats">

        <div class="stat">
          <div class="statNum" id="totalCount">0</div>
          <div class="statLabel">Total</div>
        </div>

        <div class="stat">
          <div class="statNum" id="selectedCount">0</div>
          <div class="statLabel">Selected</div>
        </div>

        <div class="stat">
          <div class="statNum" id="cloudCount">0</div>
          <div class="statLabel">Cloud</div>
        </div>

      </div>

      <div style="height:12px"></div>

      <div class="cloudStatus">
        <span class="cloudDot"></span>
        Cloud synced
      </div>

    </div>


    <!-- SITE FORM -->

    <div class="section">

      <div class="sectionTitle">
        Add / Edit Site
      </div>

      <div class="formGrid">

        <input
          id="siteName"
          class="input formFull"
          placeholder="Site Name"
        >

        <input
          id="location"
          class="input formFull"
          placeholder="Location"
        >

        <input
          id="latitude"
          class="input"
          placeholder="Latitude"
        >

        <input
          id="longitude"
          class="input"
          placeholder="Longitude"
        >

        <input
          id="width"
          class="input"
          type="number"
          placeholder="Width (ft)"
        >

        <input
          id="height"
          class="input"
          type="number"
          placeholder="Height (ft)"
        >

        <input
          id="mediaType"
          class="input"
          placeholder="Media Type"
        >

        <select id="illumination" class="input">
          <option value="">Illumination</option>
          <option value="F-LIT">F-LIT</option>
          <option value="Backlit">Backlit</option>
          <option value="Non-Lit">Non-Lit</option>
          <option value="LED">LED</option>
          <option value="Digital">Digital</option>
        </select>

        <input
          id="rate"
          class="input"
          type="number"
          placeholder="Rate ₹"
        >

        <select id="status" class="input">
          <option value="Available">Available</option>
          <option value="Booked">Booked</option>
          <option value="Hold">Hold</option>
        </select>

        <input
          id="photo"
          class="input formFull"
          placeholder="Photo URL"
        >

        <textarea
          id="remarks"
          class="input formFull"
          rows="3"
          placeholder="Remarks"
        ></textarea>

      </div>

      <div style="height:10px"></div>

      <button
        class="btn btnBlue"
        style="width:100%;justify-content:center"
        onclick="addSite()"
      >
        📍 Add Site
      </button>

    </div>


    <!-- SELECTED -->

    <div class="section">

      <div class="selectedHeader">

        <h3>Selected Sites</h3>

        <button
          class="btn btnRed"
          style="padding:7px 10px"
          onclick="clearSelected()"
        >
          CLEAR
        </button>

      </div>

      <div id="siteList" class="siteList"></div>

    </div>


    <!-- SEARCH -->

    <div class="section">

      <div class="sectionTitle">
        Map Search
      </div>

      <input
        id="searchLocation"
        class="input"
        placeholder="Search location..."
      >

      <div style="height:8px"></div>

      <button
        class="btn btnBlue"
        style="width:100%;justify-content:center"
        onclick="searchLocation()"
      >
        🔎 Search Location
      </button>

    </div>

  </aside>


  <!-- MAP -->

  <main class="mapArea">

    <div class="mapFrame">

      <div class="mapTopCard">

        <div class="mapTopTitle">
          🗺️ OOH SITE MAP
        </div>

        <div class="mapTopSub">
          Click anywhere on the map to place a site
        </div>

      </div>

      <div id="map"></div>

    </div>

  </main>

</div>


<div id="toast"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.min.js"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://fdrdswbrjuigzzmskpru.supabase.co";

/*
  IMPORTANT:
  Put your Supabase PUBLISHABLE key below.

  Do NOT put a service-role/secret key here.
*/

const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   APP DATA
========================================================= */

let sites = [];
let selectedSites = [];
let markers = {};

let map;


/* =========================================================
   MAP
========================================================= */

map = L.map("map", {
  zoomControl:true,
  preferCanvas:true
}).setView(
  [19.0760,72.8777],
  11
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);


/* =========================================================
   MARKER STYLE
========================================================= */

function createMarker(site){

  const icon = L.divIcon({

    className:"custom-marker",

    html:`
      <div style="
        width:30px;
        height:30px;
        border-radius:50% 50% 50% 0;
        background:linear-gradient(135deg,#087cf5,#00c6ff);
        transform:rotate(-45deg);
        border:3px solid white;
        box-shadow:0 6px 15px rgba(0,0,0,.25);
      ">
        <div style="
          width:8px;
          height:8px;
          background:white;
          border-radius:50%;
          position:absolute;
          top:8px;
          left:8px;
        "></div>
      </div>
    `,

    iconSize:[30,30],
    iconAnchor:[15,30]
  });

  const marker =
    L.marker(
      [site.latitude,site.longitude],
      {icon}
    ).addTo(map);

  marker.bindPopup(`
    <div style="min-width:220px">

      <b style="font-size:15px">
        ${escapeHtml(site.site_name || "OOH Site")}
      </b>

      <div style="margin-top:5px;color:#64748b">
        ${escapeHtml(site.location || "")}
      </div>

      <hr>

      <div>
        📐 ${site.width || 0} × ${site.height || 0} ft
      </div>

      <div>
        💡 ${escapeHtml(site.illumination || "-")}
      </div>

      <div>
        💰 ₹${site.rate || 0}
      </div>

      ${
        site.photo
        ?
        `<img src="${escapeAttr(site.photo)}"
          style="width:100%;margin-top:8px;border-radius:8px">`
        :
        ""
      }

    </div>
  `);

  markers[site.id] = marker;

  return marker;
}


/* =========================================================
   MAP CLICK
========================================================= */

map.on("click",function(e){

  document.getElementById("latitude").value =
    e.latlng.lat.toFixed(6);

  document.getElementById("longitude").value =
    e.latlng.lng.toFixed(6);

  showToast("📍 Coordinates selected");
});


/* =========================================================
   ADD SITE
========================================================= */

async function addSite(){

  const site = {

    id:
      "site_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2,8),

    site_name:
      document.getElementById("siteName").value.trim(),

    location:
      document.getElementById("location").value.trim(),

    latitude:
      parseFloat(
        document.getElementById("latitude").value
      ),

    longitude:
      parseFloat(
        document.getElementById("longitude").value
      ),

    width:
      Number(
        document.getElementById("width").value
      ) || 0,

    height:
      Number(
        document.getElementById("height").value
      ) || 0,

    media_type:
      document.getElementById("mediaType").value,

    illumination:
      document.getElementById("illumination").value,

    rate:
      Number(
        document.getElementById("rate").value
      ) || 0,

    status:
      document.getElementById("status").value,

    photo:
      document.getElementById("photo").value,

    remarks:
      document.getElementById("remarks").value
  };


  if(!site.site_name){
    showToast("⚠️ Enter site name");
    return;
  }

  if(
    !Number.isFinite(site.latitude) ||
    !Number.isFinite(site.longitude)
  ){
    showToast("⚠️ Select coordinates");
    return;
  }


  sites.push(site);

  selectedSites.push(site);

  createMarker(site);

  renderSites();

  updateStats();

  clearForm();

  showToast("✅ Site added");
}


/* =========================================================
   SAVE TO SUPABASE
========================================================= */

async function saveCurrentSite(){

  if(!selectedSites.length){
    showToast("⚠️ Select/add a site first");
    return;
  }

  try{

    const {
      data:{
        user
      }
    } =
      await supabaseClient
        .auth
        .getUser();

    if(!user){

      showToast(
        "⚠️ Login to Supabase first"
      );

      return;
    }


    const rows =
      selectedSites.map(site => ({

        id:site.id,

        user_id:user.id,

        site_name:site.site_name,

        location:site.location,

        latitude:site.latitude,

        longitude:site.longitude,

        width:site.width,

        height:site.height,

        media_type:site.media_type,

        illumination:site.illumination,

        rate:site.rate,

        status:site.status,

        photo:site.photo,

        remarks:site.remarks,

        updated:new Date().toISOString()

      }));


    const {
      error
    } =
      await supabaseClient
        .from("ooh_sites")
        .upsert(
          rows,
          {
            onConflict:"user_id,id"
          }
        );


    if(error)
      throw error;


    showToast(
      `☁️ ${rows.length} site(s) saved to cloud`
    );

    updateStats();

  }
  catch(error){

    console.error(error);

    showToast(
      "❌ Cloud save failed"
    );
  }
}


/* =========================================================
   LOAD SAVED SITES
========================================================= */

async function loadSavedSites(){

  try{

    const {
      data:{
        user
      }
    } =
      await supabaseClient
        .auth
        .getUser();


    if(!user){

      showToast(
        "Login required to load cloud sites"
      );

      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("ooh_sites")
        .select("*")
        .eq("user_id",user.id)
        .order("updated",{ascending:false});


    if(error)
      throw error;


    sites = data || [];

    selectedSites = [];


    Object.values(markers)
      .forEach(marker =>
        map.removeLayer(marker)
      );

    markers = {};


    sites.forEach(site => {

      if(
        Number.isFinite(site.latitude) &&
        Number.isFinite(site.longitude)
      ){

        createMarker(site);

      }

    });


    renderSites();

    updateStats();


    if(sites.length){

      showToast(
        `☁️ ${sites.length} saved sites loaded`
      );

    }else{

      showToast(
        "☁️ No saved sites found"
      );

    }

  }
  catch(error){

    console.error(error);

    showToast(
      "❌ Could not load saved sites"
    );

  }
}


/* =========================================================
   RENDER SELECTED
========================================================= */

function renderSites(){

  const list =
    document.getElementById("siteList");

  list.innerHTML = "";


  selectedSites.forEach(site => {

    const card =
      document.createElement("div");

    card.className =
      "siteCard";


    card.innerHTML = `

      <img
        class="siteThumb"
        src="${site.photo || "https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=300"}"
        onerror="this.src='https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=300'"
      >

      <div class="siteInfo">

        <div class="siteName">
          ${escapeHtml(site.site_name || "OOH Site")}
        </div>

        <div class="siteLocation">
          ${escapeHtml(site.location || "Location not available")}
        </div>

        <div class="siteMeta">

          <span class="badge">
            ${site.width || 0} × ${site.height || 0} ft
          </span>

          <span class="badge">
            ${escapeHtml(site.illumination || "-")}
          </span>

        </div>

      </div>

      <button
        class="removeBtn"
        onclick="event.stopPropagation();removeSelected('${escapeAttr(site.id)}')"
      >
        ×
      </button>

    `;


    card.onclick = () => {

      if(
        Number.isFinite(site.latitude) &&
        Number.isFinite(site.longitude)
      ){

        map.setView(
          [site.latitude,site.longitude],
          16,
          {
            animate:true
          }
        );

        if(markers[site.id])
          markers[site.id].openPopup();

      }

    };


    list.appendChild(card);

  });


  updateStats();
}


/* =========================================================
   REMOVE SELECTED
========================================================= */

function removeSelected(id){

  selectedSites =
    selectedSites.filter(
      s => s.id !== id
    );

  renderSites();

  showToast("Site removed from selection");
}


/* =========================================================
   CLEAR
========================================================= */

function clearSelected(){

  selectedSites = [];

  renderSites();

  showToast("Selection cleared");
}


/* =========================================================
   SEARCH
========================================================= */

async function searchLocation(){

  const query =
    document
      .getElementById("searchLocation")
      .value
      .trim();

  if(!query){
    showToast("Enter a location");
    return;
  }

  try{

    const response =
      await fetch(
        "https://nominatim.openstreetmap.org/search?" +
        new URLSearchParams({
          q:query,
          format:"json",
          limit:1
        })
      );

    const results =
      await response.json();


    if(!results.length){

      showToast(
        "Location not found"
      );

      return;
    }


    const result =
      results[0];


    map.setView(
      [
        Number(result.lat),
        Number(result.lon)
      ],
      15,
      {
        animate:true
      }
    );


    document.getElementById("latitude").value =
      Number(result.lat).toFixed(6);

    document.getElementById("longitude").value =
      Number(result.lon).toFixed(6);

    document.getElementById("location").value =
      result.display_name;


    showToast(
      "📍 Location found"
    );

  }
  catch(error){

    showToast(
      "Search failed"
    );

  }
}

function exportExcel(){

  if(!selectedSites.length){

    showToast(

    );

    return;
  }


  const rows =
    selectedSites.map((s,index)=>({

      "Sr No":index+1,

      "Site Name":
        s.site_name || "",

      "Location":
        s.location || "",

      "Latitude":
        s.latitude || "",

      "Longitude":
        s.longitude || "",

      "Width (ft)":
        s.width || 0,

      "Height (ft)":
        s.height || 0,

      "Media Type":
        s.media_type || "",

      "Illumination":
        s.illumination || "",

      "Rate":
        s.rate || 0,

      "Status":
        s.status || "",

      "Remarks":
        s.remarks || ""

    }));


  const workbook =
    XLSX.utils.book_new();

  const worksheet =
    XLSX.utils.json_to_sheet(rows);


  XLSX.utils.book_append_sheet(
    workbook,
    worksheet,
    "OOH Sites"
  );


  XLSX.writeFile(
    workbook,
    "My_Vision_OOH_Sites.xlsx"
  );


  showToast(
    "📊 Excel exported"
  );
}

/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    message;

  toast.classList.add("show");


  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(
      () => toast.classList.remove("show"),
      3000
    );
}


/* =========================================================
   SECURITY HELPERS
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(value){

  return escapeHtml(value);
}
