<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY VISION OOH</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f5f8;
  color:#172033;
}

header{
  height:64px;
  background:#101827;
  color:white;
  display:flex;
  align-items:center;
  padding:0 18px;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#20aef3;
}

.header-actions{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
}

button{
  border:0;
  border-radius:7px;
  padding:9px 12px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:.9;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.btn-blue{
  background:#0787c8;
  color:white;
}

.btn-green{
  background:#16a34a;
  color:white;
}

.btn-red{
  background:#dc2626;
  color:white;
}

.btn-gray{
  background:#e5e7eb;
  color:#111827;
}

.full{
  width:100%;
  margin-top:8px;
}

.main{
  display:grid;
  grid-template-columns:390px 1fr;
  height:calc(100vh - 64px);
}

.sidebar{
  background:white;
  border-right:1px solid #ddd;
  overflow-y:auto;
  padding:12px;
}

.map-container{
  position:relative;
}

#map{
  width:100%;
  height:100%;
}

.card{
  background:white;
  border:1px solid #dce1e7;
  border-radius:10px;
  padding:14px;
  margin-bottom:12px;
}

.card h3{
  margin:0 0 12px;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin:8px 0 4px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:6px;
  padding:9px;
  font-size:14px;
}

textarea{
  resize:vertical;
  min-height:70px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.row3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.stat{
  background:#f1f5f9;
  padding:10px;
  border-radius:8px;
}

.stat strong{
  display:block;
  font-size:22px;
  margin-top:3px;
}

.site{
  border:1px solid #d8dee6;
  border-radius:9px;
  padding:9px;
  margin-top:8px;
  background:#fff;
}

.saved-site-row{
  display:flex;
  gap:10px;
  align-items:center;
}

.saved-site-image{
  width:82px;
  height:68px;
  flex-shrink:0;
}

.saved-site-photo{
  width:82px;
  height:68px;
  object-fit:cover;
  border-radius:7px;
  cursor:pointer;
  border:1px solid #d1d5db;
}

.no-site-photo{
  width:82px;
  height:68px;
  background:#e5e7eb;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.saved-site-details{
  flex:1;
  min-width:0;
}

.site-name{
  font-weight:bold;
  font-size:14px;
  word-break:break-word;
}

.site-info{
  font-size:11px;
  color:#64748b;
  margin-top:4px;
  line-height:1.5;
}

.site-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px;
}

.site-buttons button{
  padding:6px 8px;
  font-size:10px;
}

.photo-preview{
  max-width:100%;
  max-height:150px;
  border-radius:7px;
  margin-top:7px;
  display:none;
}

.empty{
  text-align:center;
  color:#64748b;
  padding:15px 5px;
  font-size:13px;
}

.calculation{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:8px;
  padding:10px;
  margin-top:10px;
  font-size:12px;
  line-height:1.7;
}

.calculation strong{
  font-size:15px;
}

#message{
  position:fixed;
  z-index:99999;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  background:#111827;
  color:white;
  padding:11px 18px;
  border-radius:8px;
  display:none;
  max-width:90%;
  text-align:center;
}

#locationResult{
  display:none;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:7px;
  padding:9px;
  margin-top:9px;
  font-size:12px;
}

/* =========================
   PPT PREVIEW / DESIGN HELPERS
========================= */

.ppt-note{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  padding:10px;
  border-radius:8px;
  font-size:11px;
  color:#64748b;
  margin-top:10px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){

  header{
    height:auto;
    min-height:64px;
    flex-wrap:wrap;
    padding:10px;
  }

  .header-actions{
    margin-left:auto;
  }

  .main{
    display:block;
    height:auto;
  }

  .sidebar{
    height:auto;
  }

  #map{
    height:60vh;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">
    MY VISION <span>OOH</span>
  </div>

  <div class="header-actions">

    <button class="btn-green" onclick="exportExcel()">
      📊 Excel
    </button>

    <button id="pptButton"
            class="btn-green"
            onclick="exportPPT()">
      📑 PPT
    </button>

    <button class="btn-gray"
            onclick="clearAllSites()">
      🗑 Clear All
    </button>

  </div>

</header>


<div class="main">

  <div class="sidebar">

    <!-- CAMPAIGN -->

    <div class="card">

      <h3>Campaign</h3>

      <input

      <div class="stats">

        <div class="stat">
          Total Sites

        </div>

        <div class="stat">
          Selected
          <strong id="selectedSites">0</strong>
        </div>

      </div>

    </div>


    <!-- SEARCH -->

    <div class="card">

      <h3>🔎 Search Location</h3>

      <label>Location Name</label>

      <input
        id="locationSearch"
        placeholder="Bandra West, Mumbai"
      >

      <button class="btn-blue full"
              onclick="searchLocation()">
        SEARCH LOCATION
      </button>

      <label>Latitude & Longitude</label>

      <div class="row">

        <div>
          <label>Latitude</label>
          <input id="searchLat"

        </div>

        <div>
          <label>Longitude</label>
          <input id="searchLng"
                 type="number"
                 step="any">
        </div>

      </div>

      <button class="btn-blue full"
              onclick="searchCoordinates()">
        📍 FIND COORDINATES
      </button>

      <button class="btn-gray full"
              onclick="useMyLocation()">
        📌 USE MY LOCATION
      </button>

      <div id="locationResult"></div>

    </div>


    <!-- SITE FORM -->

    <div class="card">

      <h3 id="formTitle">

      </h3>

      <input id="editId"
             type="hidden">

      <div class="row">

        <div>

          <input id="state"

        </div>

        <div>
          <label>City</label>
          <input id="city"
                 placeholder="Mumbai">
        </div>

      </div>

      <label>Location</label>

      <input
        id="siteLocation"
        placeholder="Bandra West, Mumbai"
      >

      <div class="row">

        <div>
          <label>Latitude</label>
          <input id="latitude"
                 type="number"
                 step="any">
        </div>

        <div>
          <label>Longitude</label>

      </div>

      <div class="row3">

        <div>

          <label>Height (ft)</label>

          P&M Charges:
          <strong id="pmPreview">
            ₹24,000

      </div>


      <label>Site Photo</label>

      <button class="btn-blue full"

        CLEAR FORM

    <!-- SAVED SITES -->

    </div>

<div id="message"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>


<script>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let sites = [];

let selectedSites = new Set();

let map = null;

let markers = [];

let searchMarker = null;

let db = null;

const DB_NAME = "MY_VISION_OOH_DATABASE";

const DB_VERSION = 1;

const STORE_NAME = "sites";

const CAMPAIGN_KEY = "my_vision_ooh_campaign";


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

  const box =
    document.getElementById("message");

  box.innerText = text;

  box.style.display = "block";

  clearTimeout(window.messageTimer);

  window.messageTimer =
    setTimeout(function(){

      box.style.display = "none";

    },3000);

}


/* =========================================================
   MONEY
========================================================= */

function money(value){

  return "₹" +
    Number(value || 0)
      .toLocaleString("en-IN");

}


/* =========================================================
   ID
========================================================= */

function generateID(){

  return (
    Date.now().toString(36) +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,10)
  );

}


/* =========================================================
   INDEXED DB
   This removes localStorage photo limit problem.
========================================================= */

function openDatabase(){

  return new Promise(function(resolve,reject){

    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );

    request.onupgradeneeded =
      function(event){

        const database =
          event.target.result;

        if(
          !database.objectStoreNames.contains(
            STORE_NAME
          )
        ){

          database.createObjectStore(
            STORE_NAME,
            {
              keyPath:"id"
            }
          );

        }

      };


    request.onsuccess =
      function(event){

        db =
          event.target.result;

        resolve(db);

      };


    request.onerror =
      function(){

        reject(
          request.error
        );

      };

  });

}


/* =========================================================
   GET ALL SITES
========================================================= */

function getAllSites(){

  return new Promise(function(resolve,reject){

    if(!db){

      reject(
        new Error("Database not ready")
      );

      return;

    }


    const transaction =
      db.transaction(
        STORE_NAME,
        "readonly"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );

    const request =
      store.getAll();


    request.onsuccess =
      function(){

        resolve(
          request.result || []
        );

      };


    request.onerror =
      function(){

        reject(
          request.error
        );

      };

  });

}


/* =========================================================
   SAVE SITE TO INDEXED DB
========================================================= */

function putSite(site){

  return new Promise(function(resolve,reject){

    const transaction =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );

    const request =
      store.put(site);


    request.onsuccess =
      function(){

        resolve();

      };


    request.onerror =
      function(){

        reject(
          request.error
        );

      };

  });

}


/* =========================================================
   DELETE SITE FROM INDEXED DB
========================================================= */

function removeSiteFromDB(id){

  return new Promise(function(resolve,reject){

    const transaction =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );

    const request =
      store.delete(id);


    request.onsuccess =
      function(){

        resolve();

      };


    request.onerror =
      function(){

        reject(
          request.error
        );

      };

  });

}


/* =========================================================
   CLEAR DATABASE
========================================================= */

function clearDatabase(){

  return new Promise(function(resolve,reject){

    const transaction =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );

    const request =
      store.clear();


    request.onsuccess =
      function(){

        resolve();

      };


    request.onerror =
      function(){

        reject(
          request.error
        );

      };

  });

}


/* =========================================================
   CAMPAIGN
========================================================= */

document.getElementById("campaign")
  .addEventListener(
    "input",
    function(){

      try{

        localStorage.setItem(
          CAMPAIGN_KEY,
          this.value
        );

      }
      catch(error){

        console.error(error);

      }

    }
  );


/* =========================================================
   CALCULATIONS
========================================================= */

function calculateValues(){

  const width =
    Number(
      document.getElementById("width").value
    ) || 0;

  const height =
    Number(
      document.getElementById("height").value
    ) || 0;

  const units =
    Number(
      document.getElementById("units").value
    ) || 0;

  const rate =
    Number(
      document.getElementById("rate").value
    ) || 0;

  const duration =
    Number(
      document.getElementById("duration").value
    ) || 0;

  let pmRate =
    Number(
      document.getElementById("pmRate").value
    ) || 0;

  const illumination =
    document.getElementById("illumination").value;


  if(
    illumination === "DOOH"
  ){

    pmRate = 0;

    document.getElementById(
      "pmRate"
    ).value = 0;

  }


  const area =
    width *
    height *
    units;


  const displayCharges =
    rate *
    duration /
    30;


  const pmCharges =
    area *
    pmRate;


  const totalCost =
    displayCharges +
    pmCharges;


  document.getElementById(
    "areaPreview"
  ).innerText =
    area.toLocaleString("en-IN") +
    " sq.ft";


  document.getElementById(
    "displayPreview"
  ).innerText =
    money(displayCharges);


  document.getElementById(
    "pmPreview"
  ).innerText =
    money(pmCharges);


  document.getElementById(
    "totalPreview"
  ).innerText =
    money(totalCost);

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadLocalData(){

  try{

    sites =
      await getAllSites();


    if(
      !Array.isArray(sites)
    ){

      sites = [];

    }

  }
  catch(error){

    console.error(error);

    sites = [];

  }


  const campaign =
    localStorage.getItem(
      CAMPAIGN_KEY
    );


  if(campaign){

    document.getElementById(
      "campaign"
    ).value =
      campaign;

  }


  selectedSites.clear();

  renderSites();

  renderMarkers();

}


/* =========================================================
   MAP
========================================================= */

function initializeMap(){

  if(map){

    setTimeout(function(){

      map.invalidateSize();

    },300);

    return;

  }


  map =
    L.map("map")
      .setView(
        [19.0760,72.8777],
        11
      );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:
        "© OpenStreetMap contributors"
    }
  ).addTo(map);


  map.on(
    "click",
    function(event){

      const lat =
        event.latlng.lat;

      const lng =
        event.latlng.lng;


      document.getElementById(
        "latitude"
      ).value =
        lat.toFixed(6);


      document.getElementById(
        "longitude"
      ).value =
        lng.toFixed(6);


      document.getElementById(
        "searchLat"
      ).value =
        lat.toFixed(6);


      document.getElementById(
        "searchLng"
      ).value =
        lng.toFixed(6);


      placeSearchMarker(
        lat,
        lng,
        "Selected Location"
      );

    }
  );

}


/* =========================================================
   SEARCH LOCATION
========================================================= */

async function searchLocation(){

  const query =
    document.getElementById(
      "locationSearch"
    ).value.trim();


  if(!query){

    showMessage(
      "Enter a location."
    );

    return;

  }


  showMessage(
    "Searching location..."
  );


  try{

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json&limit=1&q=" +
      encodeURIComponent(query);


    const response =
      await fetch(
        url,
        {
          headers:{
            "Accept":
              "application/json"
          }
        }
      );


    if(!response.ok){

      throw new Error(
        "Location service unavailable."
      );

    }


    const data =
      await response.json();


    if(!data.length){

      showMessage(
        "Location not found."
      );

      return;

    }


    const result =
      data[0];


    showLocation(
      parseFloat(result.lat),
      parseFloat(result.lon),
      result.display_name
    );

  }
  catch(error){

    console.error(error);

    showMessage(
      "Location search failed."
    );

  }

}


/* =========================================================
   COORDINATES
========================================================= */

function searchCoordinates(){

  const lat =
    parseFloat(
      document.getElementById(
        "searchLat"
      ).value
    );


  const lng =
    parseFloat(
      document.getElementById(
        "searchLng"
      ).value
    );


  if(
    Number.isNaN(lat) ||
    Number.isNaN(lng)
  ){

    showMessage(
      "Enter valid coordinates."
    );

    return;

  }


  if(
    lat < -90 ||
    lat > 90
  ){

    showMessage(
      "Latitude must be between -90 and 90."
    );

    return;

  }


  if(
    lng < -180 ||
    lng > 180
  ){

    showMessage(
      "Longitude must be between -180 and 180."
    );

    return;

  }


  showLocation(
    lat,
    lng,
    "Selected Coordinates"
  );

}


/* =========================================================
   SHOW LOCATION
========================================================= */

function showLocation(
  lat,
  lng,
  name
){

  if(!map){

    initializeMap();

  }


  map.setView(
    [lat,lng],
    17
  );


  placeSearchMarker(
    lat,
    lng,
    name
  );


  document.getElementById(
    "latitude"
  ).value =
    lat.toFixed(6);


  document.getElementById(
    "longitude"
  ).value =
    lng.toFixed(6);


  document.getElementById(
    "searchLat"
  ).value =
    lat.toFixed(6);


  document.getElementById(
    "searchLng"
  ).value =
    lng.toFixed(6);


  if(
    name !== "Selected Coordinates"
  ){

    document.getElementById(
      "siteLocation"
    ).value =
      name;

  }


  const box =
    document.getElementById(
      "locationResult"
    );


  box.style.display =
    "block";


  box.innerHTML =

  navigator.geolocation.getCurrentPosition(

/* =========================================================
   IMAGE RESIZE
========================================================= */

function resizeImage(
  file,
  maxSize,
  quality
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(event){

          const image =
            new Image();


          image.onload =
            function(){

              let width =
                image.width;

              let height =
                image.height;


              if(
                width > maxSize ||
                height > maxSize
              ){

                if(
                  width > height
                ){

                  height =
                    Math.round(
                      height *
                      maxSize /
                      width
                    );

                  width =
                    maxSize;

                }
                else{

                  width =
                    Math.round(
                      width *
                      maxSize /
                      height
                    );

                  height =
                    maxSize;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                image,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                )
              );

            };


          image.onerror =
            function(){

              reject(
                new Error(
                  "Invalid image."
                )
              );

            };


          image.src =
            event.target.result;

        };


      reader.onerror =
        function(){

          reject(
            new Error(
              "Could not read file."
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   SAVE SITE
========================================================= */

async function saveSite(){

  const name =
    document.getElementById(
      "siteName"
    ).value.trim();


  const location =
    document.getElementById(
      "siteLocation"
    ).value.trim();


  const state =
    document.getElementById(
      "state"
    ).value.trim();


  const city =
    document.getElementById(
      "city"
    ).value.trim();


  const lat =
    parseFloat(
      document.getElementById(
        "latitude"
      ).value
    );


  const lng =
    parseFloat(
      document.getElementById(
        "longitude"
      ).value
    );


  if(!name){

    showMessage(
      "Enter Site Name / ID."
    );

    return;

  }


  if(
    Number.isNaN(lat) ||
    Number.isNaN(lng)
  ){

    showMessage(
      "Select a location on the map first."
    );

    return;

  }


  if(
    lat < -90 ||
    lat > 90
  ){

    showMessage(
      "Invalid latitude."
    );

    return;

  }


  if(
    lng < -180 ||
    lng > 180
  ){

    showMessage(
      "Invalid longitude."
    );

    return;

  }


  const editId =
    document.getElementById(
      "editId"
    ).value.trim();


  let photoURL =
    document.getElementById(
      "photoPreview"
    ).dataset.url || "";


  const photoFile =
    document.getElementById(
      "photo"
    ).files[0];


  if(photoFile){

    try{

      showMessage(
        "Processing site photo..."
      );


      photoURL =
        await resizeImage(
          photoFile,
          1400,
          0.82
        );

    }
    catch(error){

      console.error(error);

      showMessage(
        "Could not process photo."
      );

      return;

    }

  }


  const width =
    Number(
      document.getElementById(
        "width"
      ).value
    ) || 0;


  const height =
    Number(
      document.getElementById(
        "height"
      ).value
    ) || 0;


  const units =
    Number(
      document.getElementById(
        "units"
      ).value
    ) || 1;


  const rate =
    Number(
      document.getElementById(
        "rate"
      ).value
    ) || 0;


  const duration =
    Number(
      document.getElementById(
        "duration"
      ).value
    ) || 1;


  let pmRate =
    Number(
      document.getElementById(
        "pmRate"
      ).value
    ) || 0;


  const illumination =
    document.getElementById(
      "illumination"
    ).value;


  if(
    illumination === "DOOH"
  ){

    pmRate = 0;

  }


  const area =
    width *
    height *
    units;


  const displayCharges =
    rate *
    duration /
    30;


  const pmCharges =
    area *
    pmRate;


  const totalCost =
    displayCharges +
    pmCharges;


  let existingSite = null;


  if(editId){

    existingSite =
      sites.find(
        site =>
          site.id === editId
      );

  }


  const siteData = {

    id:
      editId ||
      generateID(),

    site_name:
      name,

    state:
      state,

    city:
      city,

    location:
      location,

    latitude:
      lat,

    longitude:
      lng,

    width:
      width,

    height:
      height,

    units:
      units,

    total_area:
      area,

    media_type:
      document.getElementById(
        "mediaType"
      ).value,

    illumination:
      illumination,

    traffic:
      document.getElementById(
        "traffic"
      ).value,

    monthly_rate:
      rate,

    duration:
      duration,

    display_charges:
      displayCharges,

    pm_rate:
      pmRate,

    pm_charges:
      pmCharges,

    total_cost:
      totalCost,

    status:
      document.getElementById(
        "status"
      ).value,

    photo_url:
      photoURL,

    remarks:
      document.getElementById(
        "remarks"
      ).value.trim(),

    created_at:
      existingSite?.created_at ||
      new Date().toISOString(),

    updated_at:
      new Date().toISOString()

  };


  try{

    await putSite(
      siteData
    );


    const index =
      sites.findIndex(
        site =>
          site.id ===
          siteData.id
      );


    if(index !== -1){

      sites[index] =
        siteData;

      showMessage(
        "Site updated successfully."
      );

    }
    else{

      sites.unshift(
        siteData
      );

      selectedSites.add(
        siteData.id
      );

      showMessage(
        "Site saved successfully."
      );

    }


    renderSites();

    renderMarkers();

    clearForm();

  }
  catch(error){

    console.error(error);

    showMessage(
      "Could not save site."
    );

  }

}

function renderMarkers(){

  }


  markers.forEach(
    marker =>
      marker.remove()
  );


  markers = [];


  sites.forEach(
    function(site){

      const lat =
        Number(
          site.latitude
        );

      const lng =
        Number(
          site.longitude
        );


      if(
        Number.isNaN(lat) ||
        Number.isNaN(lng)
      ){

        return;

      }


      const marker =
        L.marker(
          [lat,lng]
        )
        .addTo(map);


      let popup =

        "<b>" +
        escapeHTML(
          site.site_name
        ) +
        "</b><br>" +

        escapeHTML(
          site.location || ""
        ) +

        "<br><br>" +

        "Size: " +
        Number(
          site.width || 0
        ) +
        " × " +
        Number(
          site.height || 0
        ) +
        " ft<br>" +

        "Units: " +
        Number(
          site.units || 1
        ) +

        "<br>" +

        "Area: " +
        Number(
          site.total_area || 0
        ).toLocaleString(
          "en-IN"
        ) +
        " sq.ft<br>" +

        "Media: " +
        escapeHTML(
          site.media_type || ""
        ) +

        "<br>" +

        "Type: " +
        escapeHTML(
          site.illumination || ""
        ) +

        "<br>" +

        "Traffic: " +
        escapeHTML(
          site.traffic || ""
        ) +

        "<br>" +

        "Rate: " +
        money(
          site.monthly_rate
        ) +

        "<br>" +

        "Status: " +
        escapeHTML(
          site.status || ""
        );


      if(site.photo_url){

        popup +=

          "<br><br>" +

          "<img src='" +
          escapeAttribute(
            site.photo_url
          ) +
          "' style='width:180px;height:120px;object-fit:cover;border-radius:6px'>";

      }


      popup +=

        "<br><br>" +

        "<a href='https://www.google.com/maps?q=" +
        encodeURIComponent(
          lat + "," + lng
        ) +
        "' target='_blank'>" +

        "📍 Open Google Maps" +

        "</a>";


      marker.bindPopup(
        popup
      );


      marker.on(
        "click",
        function(){

          selectedSites.add(
            site.id
          );

          renderSites();

        }
      );


      markers.push(
        marker
      );

    }
  );

}


/* =========================================================
   RENDER SITES
========================================================= */

function renderSites(){

  const list =
    document.getElementById(
      "siteList"
    );


  if(!list){

    return;

  }


  const searchInput =
    document.getElementById(
      "siteSearch"
    );


  const search =
    searchInput
      ? searchInput.value
          .toLowerCase()
          .trim()
      : "";


  const filtered =
    sites.filter(
      function(site){

        const text = [

          site.site_name,

          site.state,

          site.city,

          site.location,

          site.media_type,

          site.illumination,

          site.traffic,

          site.status,

          site.width,

          site.height,

          site.units,

          site.remarks

        ]
        .join(" ")
        .toLowerCase();


        return text.includes(
          search
        );

      }
    );


  list.innerHTML = "";


  if(!filtered.length){

    list.innerHTML =

      "<div class='empty'>" +

      (
        sites.length
          ? "No matching sites found."
          : "No saved sites yet."
      ) +

      "</div>";

  }


  filtered.forEach(
    function(site){

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "site";


      const selected =
        selectedSites.has(
          site.id
        );


      let photoHTML;


      if(site.photo_url){

        photoHTML =

          "<img src='" +
          escapeAttribute(
            site.photo_url
          ) +
          "' class='saved-site-photo' " +

          "onclick=\"viewSite('" +
          escapeAttribute(
            site.id
          ) +
          "')\">";

      }
      else{

        photoHTML =

          "<div class='no-site-photo'>" +
          "📷" +
          "</div>";

      }


      div.innerHTML =

        "<div class='saved-site-row'>" +

          "<div class='saved-site-image'>" +

            photoHTML +

          "</div>" +

          "<div class='saved-site-details'>" +

            "<div class='site-name'>" +

              (
                selected
                  ? "☑ "
                  : "☐ "
              ) +

              escapeHTML(
                site.site_name
              ) +

            "</div>" +

            "<div class='site-info'>" +

              escapeHTML(
                site.location || ""
              ) +

              "<br>" +

              escapeHTML(
                site.city || ""
              ) +

              ", " +

              escapeHTML(
                site.state || ""
              ) +

              "<br>" +

              "📐 " +

              Number(
                site.width || 0
              ) +

              " × " +

              Number(
                site.height || 0
              ) +

              " ft × " +

              Number(
                site.units || 1
              ) +

              " units" +

              "<br>" +

              "📊 " +

              Number(
                site.total_area || 0
              ).toLocaleString(
                "en-IN"
              ) +

              " sq.ft" +

              "<br>" +

              escapeHTML(
                site.media_type || ""
              ) +

              " | " +

              escapeHTML(
                site.illumination || ""
              ) +

              "<br>" +

              "🚦 " +

              escapeHTML(
                site.traffic || ""
              ) +

            "</div>" +

          "</div>" +

        "</div>" +


        "<div class='site-buttons'>" +

          "<button class='btn-blue' " +

          "onclick=\"viewSite('" +

          escapeAttribute(
            site.id
          ) +

          "')\">" +

          "MAP" +

          "</button>" +


          "<button class='btn-gray' " +

          "onclick=\"selectSite('" +

          escapeAttribute(
            site.id
          ) +

          "')\">" +

          (
            selected
              ? "UNSELECT"
              : "SELECT"
          ) +

          "</button>" +


          "<button class='btn-gray' " +

          "onclick=\"editSite('" +

          escapeAttribute(
            site.id
          ) +

          "')\">" +

          "EDIT" +

          "</button>" +


          "<button class='btn-red' " +

          "onclick=\"deleteSite('" +

          escapeAttribute(
            site.id
          ) +

          "')\">" +

          "DELETE" +

          "</button>" +

        "</div>";


      list.appendChild(

    }

  document.getElementById(
    "totalSites"
  ).innerText =

  document.getElementById(
    "selectedSites"
  ).innerText =

   SELECT
========================================================= */

function selectSite(id){

  if(
    selectedSites.has(id)
  ){

    selectedSites.delete(id);

  }
  else{

    selectedSites.add(id);

  }


  renderSites();

}


/* =========================================================
   VIEW SITE
========================================================= */

function viewSite(id){

  const site =
    sites.find(
      item =>
        item.id === id
    );


  if(!site){

    return;

  }


  const lat =
    Number(
      site.latitude
    );

  const lng =
    Number(
      site.longitude
    );


  if(
    Number.isNaN(lat) ||
    Number.isNaN(lng)
  ){

    showMessage(
      "Site has invalid coordinates."
    );

    return;

  }


  if(!map){

    initializeMap();

  }


  map.setView(
    [lat,lng],
    17
  );


  placeSearchMarker(
    lat,
    lng,
    site.site_name
  );


  selectedSites.add(
    site.id
  );


  renderSites();

}

/* =========================================================
   DELETE
========================================================= */

async function deleteSite(id){

  const site =
    sites.find(
      item =>
        item.id === id
    );


  if(!site){

    return;

  }


  if(
    !confirm(
      "Delete " +
      site.site_name +
      " permanently?"
    )
  ){

    return;

  }


  try{

    await removeSiteFromDB(
      id
    );


    sites =
      sites.filter(
        item =>
          item.id !== id
      );


    selectedSites.delete(
      id
    );


    renderSites();

    renderMarkers();

    showMessage(
      "Site deleted."
    );

  }
  catch(error){

    console.error(error);

    showMessage(
      "Could not delete site."
    );

  }

}

/* =========================================================
   IMAGE FOR PPT
========================================================= */

async function imageUrlToDataUrl(
  url
){

  if(!url){

    return null;

  }


  if(
    String(url)
      .startsWith(
        "data:image/"
      )
  ){

    return url;

  }


  try{

    const response =
      await fetch(
        url,
        {
          mode:"cors",
          cache:"no-cache"
        }
      );


    if(!response.ok){

      throw new Error(
        "Image HTTP " +
        response.status
      );

    }


    const blob =
      await response.blob();


    return await new Promise(
      function(resolve,reject){

        const reader =
          new FileReader();


        reader.onloadend =
          function(){

            resolve(
              reader.result
            );

          };


        reader.onerror =
          function(){

            reject(
              new Error(
                "Could not read image."
              )
            );

          };


        reader.readAsDataURL(
          blob
        );

      }
    );

  }
  catch(error){

    console.error(
      "Could not convert image:",
      error
    );

    return null;

  }

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text){

  return String(
    text ?? ""
  )
  .replace(
    /[&<>"']/g,
    function(character){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[character];

    }
  );

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttribute(text){

  return String(
    text ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  );

}


/* =========================================================
   PHOTO PREVIEW
========================================================= */

document.getElementById(
  "photo"
)
.addEventListener(
  "change",
  async function(){

    const file =
      this.files[0];


    const preview =
      document.getElementById(
        "photoPreview"
      );


    if(!file){

      preview.src = "";

      preview.style.display =
        "none";

      return;

    }


    try{

      const dataURL =
        await resizeImage(
          file,
          1400,
          0.82
        );


      preview.src =
        dataURL;


      preview.dataset.url =
        "";


      preview.style.display =
        "block";

    }
    catch(error){

      console.error(error);

      showMessage(
        "Could not preview image."
      );

    }

  }
);
