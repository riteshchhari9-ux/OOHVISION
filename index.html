<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
"https://fdrdswbrjuigzzmskpru.supabase.co";

const SUPABASE_KEY =
"sb_publishable_H_iVOgmPDIf-cSXUcdAWow_mT3SXLZr";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   APP VARIABLES
   ========================================================= */

let sites = [];
let selectedSites = new Set();
let map;
let markers = [];
let searchMarker = null;
let currentPhoto = "";
let realtimeChannel = null;


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text){

    const box = document.getElementById("message");

    box.innerText = text;
    box.style.display = "block";

    clearTimeout(window.messageTimer);

    window.messageTimer =
        setTimeout(function(){
            box.style.display = "none";
        },2500);
}


/* =========================================================
   SUPABASE STATUS
   ========================================================= */

function setSyncStatus(text,color="#16a34a"){

    const el =
        document.getElementById("syncStatus");

    el.innerText = text;
    el.style.color = color;
}


/* =========================================================
   DATABASE LOAD
   ========================================================= */

async function loadSites(){

    setSyncStatus(
        "Loading cloud sites...",
        "#0787c8"
    );

    const { data,error } =
        await supabaseClient
        .from("ooh_sites")
        .select("*")
        .order("created_at",{ascending:false});

    if(error){

        console.error(error);

        setSyncStatus(
            "Cloud connection error",
            "#dc2626"
        );

        showMessage(
            "Could not load Supabase sites"
        );

        return;

    }

    sites =
        (data || []).map(normalizeSite);

    selectedSites.clear();

    renderSites();
    renderMarkers();

    setSyncStatus(
        sites.length +
        " site(s) synced with cloud"
    );
}


/* =========================================================
   NORMALIZE SUPABASE DATA
   ========================================================= */

function normalizeSite(row){

    return {

        id: row.id,

        siteName:
            row.site_name || "",

        location:
            row.location || "",

        latitude:
            Number(row.latitude),

        longitude:
            Number(row.longitude),

        width:
            Number(row.width || 0),

        height:
            Number(row.height || 0),

        mediaType:
            row.media_type || "Billboard",

        illumination:
            row.illumination || "Lit",

        rate:
            Number(row.rate || 0),

        status:
            row.status || "Available",

        photo:
            row.photo || "",

        remarks:
            row.remarks || "",

        campaign:
            row.campaign || "",

        created_at:
            row.created_at,

        updated:
            row.updated_at

    };

}


/* =========================================================
   SAVE TO SUPABASE
   ========================================================= */

async function saveSiteToCloud(site){

    const row = {

        id: site.id,

        site_name: site.siteName,

        location: site.location,

        latitude: site.latitude,

        longitude: site.longitude,

        width: site.width,

        height: site.height,

        media_type: site.mediaType,

        illumination: site.illumination,

        rate: site.rate,

        status: site.status,

        photo: site.photo || "",

        remarks: site.remarks || "",

        campaign:
            document.getElementById("campaign").value.trim(),

        updated_at:
            new Date().toISOString()

    };

    const { data,error } =
        await supabaseClient
        .from("ooh_sites")
        .upsert(
            row,
            {onConflict:"id"}
        )
        .select()
        .single();

    if(error){

        console.error(error);

        throw error;

    }

    return normalizeSite(data);

}


/* =========================================================
   DELETE FROM SUPABASE
   ========================================================= */

async function deleteSiteFromCloud(id){

    const {error} =
        await supabaseClient
        .from("ooh_sites")
        .delete()
        .eq("id",id);

    if(error){

        console.error(error);

        throw error;

    }

}


/* =========================================================
   REALTIME SYNC
   ========================================================= */

function startRealtime(){

    if(realtimeChannel){

        supabaseClient.removeChannel(
            realtimeChannel
        );

    }

    realtimeChannel =
        supabaseClient
        .channel("ooh-sites-sync")

        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"ooh_sites"
            },
            function(payload){

                console.log(
                    "Supabase change:",
                    payload
                );

                if(
                    payload.eventType === "INSERT"
                ){

                    const site =
                        normalizeSite(
                            payload.new
                        );

                    const index =
                        sites.findIndex(
                            s => s.id === site.id
                        );

                    if(index === -1){

                        sites.unshift(site);

                    }
                    else{

                        sites[index] = site;

                    }

                }

                else if(
                    payload.eventType === "UPDATE"
                ){

                    const site =
                        normalizeSite(
                            payload.new
                        );

                    const index =
                        sites.findIndex(
                            s => s.id === site.id
                        );

                    if(index >= 0){

                        sites[index] = site;

                    }
                    else{

                        sites.unshift(site);

                    }

                }

                else if(
                    payload.eventType === "DELETE"
                ){

                    const id =
                        payload.old.id;

                    sites =
                        sites.filter(
                            s => s.id !== id
                        );

                    selectedSites.delete(id);

                }

                renderSites();
                renderMarkers();

                setSyncStatus(
                    "Cloud synced"
                );

            }
        )

        .subscribe(function(status){

            console.log(
                "Realtime status:",
                status
            );

        });

}


/* =========================================================
   OPTIONAL OLD INDEXEDDB MIGRATION
   ========================================================= */

async function migrateOldIndexedDB(){

    const DB_NAME =
        "MY_VISION_OOH_DATABASE";

    const STORE_NAME =
        "sites";

    try{

        if(!window.indexedDB){

            return;

        }

        const databases =
            indexedDB.databases
            ? await indexedDB.databases()
            : [];

        const exists =
            databases.some(
                db => db.name === DB_NAME
            );

        if(!exists){

            return;

        }

        const oldDB =
            await new Promise(
                function(resolve,reject){

                    const request =
                        indexedDB.open(
                            DB_NAME,
                            1
                        );

                    request.onsuccess =
                        () => resolve(
                            request.result
                        );

                    request.onerror =
                        () => reject(
                            request.error
                        );

                }
            );

        if(
            !oldDB.objectStoreNames.contains(
                STORE_NAME
            )
        ){

            oldDB.close();
            return;

        }

        const oldSites =
            await new Promise(
                function(resolve,reject){

                    const tx =
                        oldDB.transaction(
                            STORE_NAME,
                            "readonly"
                        );

                    const request =
                        tx.objectStore(
                            STORE_NAME
                        ).getAll();

                    request.onsuccess =
                        () => resolve(
                            request.result || []
                        );

                    request.onerror =
                        () => reject(
                            request.error
                        );

                }
            );

        oldDB.close();

        if(!oldSites.length){

            return;

        }

        showMessage(
            "Migrating old saved sites to cloud..."
        );

        for(
            const oldSite of oldSites
        ){

            const site = {

                id:
                    oldSite.id ||
                    crypto.randomUUID(),

                siteName:
                    oldSite.siteName || "",

                location:
                    oldSite.location || "",

                latitude:
                    Number(oldSite.latitude),

                longitude:
                    Number(oldSite.longitude),

                width:
                    Number(oldSite.width || 0),

                height:
                    Number(oldSite.height || 0),

                mediaType:
                    oldSite.mediaType ||
                    "Billboard",

                illumination:
                    oldSite.illumination ||
                    "Lit",

                rate:
                    Number(oldSite.rate || 0),

                status:
                    oldSite.status ||
                    "Available",

                photo:
                    oldSite.photo || "",

                remarks:
                    oldSite.remarks || "",

                campaign:
                    oldSite.campaign || ""

            };

            try{

                await saveSiteToCloud(site);

            }
            catch(error){

                console.error(
                    "Migration failed:",
                    error
                );

            }

        }

        await loadSites();

        showMessage(
            oldSites.length +
            " old site(s) migrated to cloud"
        );

    }
    catch(error){

        console.log(
            "No old IndexedDB migration:",
            error
        );

    }

}


/* =========================================================
   MAP

function initializeMap(){

    map =
        L.map("map")
        .setView(
            [19.0760,72.8777],
            11
        );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            document.getElementById(
                "longitude"

            document.getElementById(
                "searchLat"
            ).value =
                lat.toFixed(6);

            document.getElementById(
                "searchLng"
            ).value =
                lng.toFixed(6);

            placeSearchMarker(
                lat,

                "Selected Location"
            );

            showMessage(
                "Location selected"
            );

    );

}


/* =========================================================
   LOCATION SEARCH
   ========================================================= */

async function searchLocation(){

    const query =
        document.getElementById(
            "locationSearch"
        ).value.trim();

    if(!query){

        showMessage(
            "Enter a location name"
        );

        return;

    }

    showMessage("Searching...");

    try{

        const url =
            "https://nominatim.openstreetmap.org/search"+
            "?format=json&limit=1&q="+
            encodeURIComponent(query);

        const response =
            await fetch(url);

        const data =
            await response.json();

        if(!data.length){

            showMessage(
                "Location not found"
            );

            return;

        }

        const result =
            data[0];

        showLocation(
            parseFloat(result.lat),
            parseFloat(result.lon),
            result.display_name
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            "Location search failed"
        );

    }

}


/* =========================================================
   COORDINATES
   ========================================================= */

function searchCoordinates(){

    const lat =
        parseFloat(
            document.getElementById(
                "searchLat"
            ).value
        );

    const lng =
        parseFloat(
            document.getElementById(
                "searchLng"
            ).value
        );

    if(
        isNaN(lat) ||
        isNaN(lng) ||
        lat < -90 ||
        lat > 90 ||
        lng < -180 ||
        lng > 180
    ){

        showMessage(
            "Enter valid coordinates"
        );

        return;

    }

    showLocation(
        lat,
        lng,
        "Selected Coordinates"
    );

}


/* =========================================================
   SHOW LOCATION
   ========================================================= */

function showLocation(lat,lng,name){

    map.setView(
        [lat,lng],
        17
    );

    placeSearchMarker(
        lat,
        lng,
        name
    );

    document.getElementById(
        "latitude"
    ).value =
        lat.toFixed(6);

    document.getElementById(
        "longitude"
    ).value =
        lng.toFixed(6);

    document.getElementById(
        "searchLat"
    ).value =
        lat.toFixed(6);

    document.getElementById(
        "searchLng"
    ).value =
        lng.toFixed(6);

    if(
        name !== "Selected Coordinates"
    ){

        document.getElementById(

        ).value =

    }

        );

    box.style.display =

    );

}


/* =========================================================
   SEARCH MARKER
   ========================================================= */

function placeSearchMarker(lat,lng,name){

    if(searchMarker){

        searchMarker.remove();

    }

    searchMarker =
        L.marker([lat,lng])
        .addTo(map)
        .bindPopup(
            "<b>"+
            escapeHTML(name)+
            "</b><br><br>"+
            lat.toFixed(6)+
            ", "+
            lng.toFixed(6)
        )
        .openPopup();

}


/* =========================================================
   CURRENT LOCATION
   ========================================================= */

function useMyLocation(){

    if(!navigator.geolocation){

        showMessage(
            "Geolocation not supported"
        );

        return;

    }

    navigator.geolocation.getCurrentPosition(

        function(position){

            showLocation(
                position.coords.latitude,
                position.coords.longitude,
                "My Current Location"
            );

        },

        function(){

            showMessage(
                "Please allow location permission"
            );

        }

    );

}


/* =========================================================
   SAVE SITE
   ========================================================= */

async function saveSite(){

    const name =
        document.getElementById(
            "siteName"
        ).value.trim();

    const location =
        document.getElementById(
            "siteLocation"
        ).value.trim();

    const lat =
        parseFloat(
            document.getElementById(
                "latitude"
            ).value
        );

    const lng =
        parseFloat(
            document.getElementById(
                "longitude"
            ).value
        );

    if(!name){

        showMessage(
            "Enter Site Name / ID"
        );

        return;

    }

    if(
        isNaN(lat) ||
        isNaN(lng)
    ){

        showMessage(
            "Select/search a location first"
        );

        return;

    }

    const editId =
        document.getElementById(
            "editId"
        ).value;

    let photo =
        currentPhoto || "";

    const photoFile =
        document.getElementById(
            "photo"
        ).files[0];

    if(photoFile){

        try{

            photo =
                await resizePhoto(
                    photoFile
                );

        }
        catch(error){

            console.error(error);

            showMessage(
                "Photo processing failed"
            );

            return;

        }

    }

    const site = {

        id:
            editId ||
            crypto.randomUUID(),

        siteName:
            name,

        location:
            location,

        latitude:
            lat,

        longitude:
            lng,

        width:
            Number(
                document.getElementById(
                    "width"
                ).value
            ) || 0,

        height:
            Number(
                document.getElementById(
                    "height"
                ).value
            ) || 0,

        mediaType:
            document.getElementById(
                "mediaType"
            ).value,

        illumination:
            document.getElementById(
                "illumination"
            ).value,

        rate:
            Number(
                document.getElementById(
                    "rate"
                ).value
            ) || 0,

        status:
            document.getElementById(
                "status"
            ).value,

        photo:
            photo,

        remarks:
            document.getElementById(
                "remarks"
            ).value.trim()

    };

    try{

        showMessage(
            "Saving to cloud..."
        );

        const saved =
            await saveSiteToCloud(
                site
            );

        const index =
            sites.findIndex(
                s => s.id === saved.id
            );

        if(index >= 0){

            sites[index] =
                saved;

        }
        else{

            sites.unshift(saved);

            selectedSites.add(
                saved.id
            );

        }

        renderSites();
        renderMarkers();

        setSyncStatus(

/* =========================================================
   PHOTO RESIZE
   ========================================================= */

function resizePhoto(file){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();

            reader.onload =
                function(event){

                    const img =
                        new Image();

                    img.onload =
                        function(){

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            const max = 1200;

                            let width =
                                img.width;

                            let height =
                                img.height;

                            if(width > max){

                                height =
                                    height * max / width;

                                width =
                                    max;

                            }

                            if(height > max){

                                width =
                                    width * max / height;

                                height =
                                    max;

                            }

                            canvas.width =
                                width;

                            canvas.height =
                                height;

                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );

                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );

                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    .65
                                )
                            );

                        };

                    img.onerror =
                        reject;

                    img.src =
                        event.target.result;

                };

            reader.onerror =
                reject;

            reader.readAsDataURL(file);

        }
    );

}

   PHOTO PREVIEW

function previewPhoto(event){

    const file =
        event.target.files[0];

    if(!file){

}


/* =========================================================
   MAP MARKERS
   ========================================================= */

function renderMarkers(){

    markers.forEach(
        marker => marker.remove()
    );

    markers = [];

    sites.forEach(
        function(site){

            if(
                isNaN(site.latitude) ||
                isNaN(site.longitude)
            ){

                return;

            }

            const marker =
                L.marker(
                    [
                        Number(site.latitude),
                        Number(site.longitude)
                    ]
                ).addTo(map);

            let popup =
                "<b>"+
                escapeHTML(site.siteName)+
                "</b><br>"+
                escapeHTML(site.location || "")+
                "<br><br>"+
                "Size: "+
                site.width+
                " × "+
                site.height+
                " ft<br>"+
                "Media: "+
                escapeHTML(site.mediaType)+
                "<br>"+
                "Rate: ₹"+
                Number(site.rate || 0)
                .toLocaleString("en-IN")+
                "<br>"+
                "Status: "+
                escapeHTML(site.status);

            if(site.photo){

                popup +=
                    "<br><br><img src='"+
                    site.photo+
                    "' style='width:180px;height:120px;object-fit:cover;border-radius:6px'>";

            }

            marker.bindPopup(popup);

            marker.on(
                "click",
                function(){

                    selectedSites.add(
                        site.id
                    );

                    renderSites();

                }
            );

            markers.push(marker);

        }
    );

}


/* =========================================================
   SAVED SITES
   ========================================================= */

function renderSites(){

    const list =
        document.getElementById(
            "siteList"
        );

    const search =
        document.getElementById(
            "siteSearch"
        )
        .value
        .toLowerCase()
        .trim();

    const filtered =
        sites.filter(
            function(site){

                const text =
                    [
                        site.siteName,
                        site.location,
                        site.latitude,
                        site.longitude,
                        site.mediaType,
                        site.status,
                        site.width,
                        site.height,
                        site.remarks
                    ]
                    .join(" ")
                    .toLowerCase();

                return text.includes(search);

            }
        );

    list.innerHTML = "";

    if(!filtered.length){

        list.innerHTML =
            "<div class='empty'>"+
            "No saved sites found"+
            "</div>";

    }

    filtered.forEach(
        function(site){

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "site";

            const selected =
                selectedSites.has(
                    site.id
                );

            let photoHTML;

            if(site.photo){

                photoHTML =
                    "<img src=\""+
                    site.photo+
                    "\" class=\"saved-site-photo\" "+
                    "onclick=\"viewSite('"+
                    site.id+
                    "')\">";

            }
            else{

                photoHTML =
                    "<div class='no-site-photo'>📷</div>";

            }

            div.innerHTML =

                "<div class='saved-site-row'>"+
                    "<div class='saved-site-image'>"+
                        photoHTML+
                    "</div>"+

                    "<div class='saved-site-details'>"+

                        "<div class='site-name'>"+
                            (selected ? "☑ " : "☐ ")+
                            escapeHTML(site.siteName)+
                        "</div>"+

                        "<div class='site-info'>"+
                            escapeHTML(site.location || "")+
                            "<br>"+
                            "Lat: "+site.latitude+
                            "<br>"+
                            "Long: "+site.longitude+
                            "<br>"+
                            "Size: "+
                            site.width+
                            " × "+
                            site.height+
                            " ft"+
                            "<br>"+
                            escapeHTML(site.mediaType || "")+
                            " | "+
                            escapeHTML(site.status || "")+
                        "</div>"+

                    "</div>"+
                "</div>"+

                "<div class='site-buttons'>"+

                    "<button class='btn-blue' "+
                    "onclick=\"viewSite('"+
                    site.id+
                    "')\">MAP</button>"+

                    "<button class='btn-gray' "+
                    "onclick=\"selectSite('"+
                    site.id+
                    "')\">"+
                    (selected ? "UNSELECT":"SELECT")+
                    "</button>"+

                    "<button class='btn-gray' "+
                    "onclick=\"editSite('"+
                    site.id+
                    "')\">EDIT</button>"+

                    "<button class='btn-red' "+
                    "onclick=\"deleteSite('"+
                    site.id+
                    "')\">DELETE</button>"+

                "</div>";

            list.appendChild(div);

        }
    );

    document.getElementById(
        "totalSites"
    ).innerText =
        sites.length;

    document.getElementById(
        "selectedSites"
    ).innerText =
        selectedSites.size;

}

   ========================================================= */

function selectSite(id){

    if(selectedSites.has(id)){

        selectedSites.delete(id);

    }
    else{

        selectedSites.add(id);

    }

    renderSites();

}


/* =========================================================
   VIEW SITE
   ========================================================= */

function viewSite(id){

    const site =
        sites.find(
            s => s.id === id
        );

    if(!site){

        return;

    }

    map.setView(
        [
            Number(site.latitude),
            Number(site.longitude)
        ],
        17
    );

    placeSearchMarker(
        Number(site.latitude),
        Number(site.longitude),
        site.siteName
    );

    selectedSites.add(
        site.id
    );

    renderSites();

}

        img.style.display =

        "formTitle"
    ).innerText =

}


/* =========================================================
   DELETE
   ========================================================= */

async function deleteSite(id){

    if(
        !confirm(
            "Delete this site permanently from cloud?"
        )
    ){

        return;

    }

    try{

        showMessage(
            "Deleting from cloud..."
        );

        await deleteSiteFromCloud(id);

        sites =
            sites.filter(
                site => site.id !== id
            );

        selectedSites.delete(id);

        renderSites();
        renderMarkers();

        showMessage(
            "Site deleted from cloud"
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            "Delete failed"
        );

    }

}

function escapeHTML(text){

    return String(text || "")
    .replace(
        /[&<>"']/g,
        function(character){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[character];

        }
    );

}
