<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY VISION OOH</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f5f8;
  color:#172033;
}

header{
  height:64px;
  background:#101827;
  color:white;
  display:flex;
  align-items:center;
  padding:0 18px;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#20aef3;
}

.header-actions{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
}

button{
  border:0;
  border-radius:7px;
  padding:9px 12px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:.9;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.btn-blue{
  background:#0787c8;
  color:white;
}

.btn-green{
  background:#16a34a;
  color:white;
}

.btn-red{
  background:#dc2626;
  color:white;
}

.btn-gray{
  background:#e5e7eb;
  color:#111827;
}

.full{
  width:100%;
  margin-top:8px;
}

.main{
  display:grid;
  grid-template-columns:390px 1fr;
  height:calc(100vh - 64px);
}

.sidebar{
  background:white;
  border-right:1px solid #ddd;
  overflow-y:auto;
  padding:12px;
}

.map-container{
  position:relative;
}

#map{
  width:100%;
  height:100%;
}

.card{
  background:white;
  border:1px solid #dce1e7;
  border-radius:10px;
  padding:14px;
  margin-bottom:12px;
}

.card h3{
  margin:0 0 12px;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin:8px 0 4px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #cbd5e1;
  border-radius:6px;
  padding:9px;
  font-size:14px;
}

textarea{
  resize:vertical;
  min-height:70px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.row3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.stat{
  background:#f1f5f9;
  padding:10px;
  border-radius:8px;
}

.stat strong{
  display:block;
  font-size:22px;
  margin-top:3px;
}

.site{
  border:1px solid #d8dee6;
  border-radius:9px;
  padding:9px;
  margin-top:8px;
  background:#fff;
}

.saved-site-row{
  display:flex;
  gap:10px;
  align-items:center;
}

.saved-site-image{
  width:82px;
  height:68px;
  flex-shrink:0;
}

.saved-site-photo{
  width:82px;
  height:68px;
  object-fit:cover;
  border-radius:7px;
  cursor:pointer;
  border:1px solid #d1d5db;
}

.no-site-photo{
  width:82px;
  height:68px;
  background:#e5e7eb;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.saved-site-details{
  flex:1;
  min-width:0;
}

.site-name{
  font-weight:bold;
  font-size:14px;
  word-break:break-word;
}

.site-info{
  font-size:11px;
  color:#64748b;
  margin-top:4px;
  line-height:1.5;
}

.site-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px;
}

.site-buttons button{
  padding:6px 8px;
  font-size:10px;
}

.photo-preview{
  max-width:100%;
  max-height:150px;
  border-radius:7px;
  margin-top:7px;
  display:none;
}

.empty{
  text-align:center;
  color:#64748b;
  padding:15px 5px;
  font-size:13px;
}

.calculation{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:8px;
  padding:10px;
  margin-top:10px;
  font-size:12px;
  line-height:1.7;
}

.calculation strong{
  font-size:15px;
}

#message{
  position:fixed;
  z-index:99999;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  background:#111827;
  color:white;
  padding:11px 18px;
  border-radius:8px;
  display:none;
  max-width:90%;
  text-align:center;
}

#locationResult{
  display:none;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:7px;
  padding:9px;
  margin-top:9px;
  font-size:12px;
}

.storage-status{
  font-size:10px;
  color:#64748b;
  margin-top:8px;
  text-align:center;
}

@media(max-width:850px){

  header{
    height:auto;
    min-height:64px;
    flex-wrap:wrap;
    padding:10px;
  }

  .header-actions{
    margin-left:auto;
  }

  .main{
    display:block;
    height:auto;
  }

  .sidebar{
    height:auto;
  }

  #map{
    height:60vh;
  }

}

</style>

</head>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<script
  src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
></script>

<script
  src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"
></script>

<script>

/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let sites = [];
let selectedSites = new Set();
let map = null;
let markers = [];
let searchMarker = null;

/* =========================================================
   STORAGE
   ========================================================= */

const DB_NAME = "MY_VISION_OOH_DATABASE";
const DB_VERSION = 1;
const STORE_NAME = "sites";
const STORAGE_KEY = "my_vision_ooh_sites";
const CAMPAIGN_KEY = "my_vision_ooh_campaign";

/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text){

  const box = document.getElementById("message");

  box.innerText = text;
  box.style.display = "block";

  clearTimeout(window.messageTimer);

  window.messageTimer = setTimeout(function(){

    box.style.display = "none";

  },3000);

}

/* =========================================================
   MONEY
   ========================================================= */

function money(value){

  return (
    "₹" +
    Number(value || 0).toLocaleString("en-IN")
  );

}

/* =========================================================
   INDEXED DB
   ========================================================= */

function openOOHDatabase(){

  return new Promise(function(resolve,reject){

    if(!window.indexedDB){

      reject(new Error("IndexedDB is not supported."));
      return;

    }

    const request = indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded = function(event){

      const db = event.target.result;

      if(!db.objectStoreNames.contains(STORE_NAME)){

        db.createObjectStore(STORE_NAME,{keyPath:"id"});

      }

    };

    request.onsuccess = function(){
      resolve(request.result);
    };

    request.onerror = function(){
      reject(request.error);
    };

  });

}

/* =========================================================
   SAVE DATABASE
   ========================================================= */

async function saveLocalData(){

  try{

    const db = await openOOHDatabase();

    await new Promise(function(resolve,reject){

      const transaction = db.transaction(STORE_NAME,"readwrite");
      const store = transaction.objectStore(STORE_NAME);

      store.clear();

      sites.forEach(function(site){
        store.put(site);
      });

      transaction.oncomplete = function(){
        resolve();
      };

      transaction.onerror = function(){
        reject(transaction.error);
      };

      transaction.onabort = function(){
        reject(
          transaction.error ||
          new Error("Transaction aborted.")
        );
      };

    });

    db.close();

    localStorage.setItem(
      CAMPAIGN_KEY,
      document.getElementById("campaign").value.trim()
    );

    return true;

  }
  catch(error){

    console.error("IndexedDB save error:",error);

    showMessage(
      "Could not save site. Browser storage may be unavailable."
    );

    return false;

  }

}

/* =========================================================
   LOAD DATABASE
   ========================================================= */

async function loadLocalData(){

  try{

    const db = await openOOHDatabase();

    const storedSites = await new Promise(function(resolve,reject){

      const transaction = db.transaction(STORE_NAME,"readonly");
      const store = transaction.objectStore(STORE_NAME);
      const request = store.getAll();

      request.onsuccess = function(){
        resolve(request.result || []);
      };

      request.onerror = function(){
        reject(request.error);
      };

    });

    db.close();

    if(Array.isArray(storedSites) && storedSites.length > 0){

      sites = storedSites;

    }
    else{

      try{

        const oldData = localStorage.getItem(STORAGE_KEY);

        if(oldData){

          const oldSites = JSON.parse(oldData);

          if(Array.isArray(oldSites) && oldSites.length > 0){

            sites = oldSites;

            const migrated = await saveLocalData();

            if(migrated){
              localStorage.removeItem(STORAGE_KEY);
            }

          }
          else{
            sites = [];
          }

        }
        else{
          sites = [];
        }

      }
      catch(error){

        console.error("Migration failed:",error);
        sites = [];

      }

    }

    const campaign = localStorage.getItem(CAMPAIGN_KEY);

    if(campaign){

      document.getElementById("campaign").value = campaign;

    }

    selectedSites.clear();

    renderSites();
    renderMarkers();

  }
  catch(error){

    console.error("IndexedDB load error:",error);

    try{

      const oldData = localStorage.getItem(STORAGE_KEY);

      sites = oldData ? JSON.parse(oldData) : [];

      if(!Array.isArray(sites)){
        sites = [];
      }

    }
    catch(fallbackError){

      console.error(fallbackError);
      sites = [];

    }

    renderSites();
    renderMarkers();

  }

}

/* =========================================================
   CLEAR DATABASE
   ========================================================= */

async function clearOOHDatabase(){

  try{

    const db = await openOOHDatabase();

    await new Promise(function(resolve,reject){

      const transaction = db.transaction(STORE_NAME,"readwrite");
      const store = transaction.objectStore(STORE_NAME);
      const request = store.clear();

      request.onsuccess = function(){
        resolve();
      };

      request.onerror = function(){
        reject(request.error);
      };

    });

    db.close();

    localStorage.removeItem(STORAGE_KEY);

    showMessage("All sites deleted.");

  }
  catch(error){

    console.error(error);

    showMessage("Could not clear storage.");

  }

}

/* =========================================================
   CAMPAIGN
   ========================================================= */

document
  .getElementById("campaign")
  .addEventListener("input",function(){

    try{

      localStorage.setItem(
        CAMPAIGN_KEY,
        this.value
      );

    }
    catch(error){

      console.error(error);

    }

  });

/* =========================================================
   CALCULATIONS
   ========================================================= */

function calculateValues(){

  const width = Number(
    document.getElementById("width").value
  ) || 0;

  const height = Number(
    document.getElementById("height").value
  ) || 0;

  const units = Number(
    document.getElementById("units").value
  ) || 0;

  const rate = Number(
    document.getElementById("rate").value
  ) || 0;

  const duration = Number(
    document.getElementById("duration").value
  ) || 0;

  let pmRate = Number(
    document.getElementById("pmRate").value
  ) || 0;

  const illumination =
    document.getElementById("illumination").value;

  if(illumination === "DOOH"){

    pmRate = 0;

    document.getElementById("pmRate").value = 0;

  }

  const area = width * height * units;

  const displayCharges = rate * duration / 30;

  const pmCharges = area * pmRate;

  const totalCost = displayCharges + pmCharges;

  document.getElementById("areaPreview").innerText =
    area.toLocaleString("en-IN") + " sq.ft";

  document.getElementById("displayPreview").innerText =
    money(displayCharges);

  document.getElementById("pmPreview").innerText =
    money(pmCharges);

  document.getElementById("totalPreview").innerText =
    money(totalCost);

}

/* =========================================================
   MAP
   ========================================================= */

function initializeMap(){

  if(map){

    setTimeout(function(){
      map.invalidateSize();
    },300);

    return;

  }

  map = L.map("map").setView(
    [19.0760,72.8777],
    11
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:"© OpenStreetMap contributors"
    }
  ).addTo(map);

  map.on("click",function(event){

    const lat = event.latlng.lat;
    const lng = event.latlng.lng;

    document.getElementById("latitude").value =
      lat.toFixed(6);

    document.getElementById("longitude").value =
      lng.toFixed(6);

    document.getElementById("searchLat").value =
      lat.toFixed(6);

    document.getElementById("searchLng").value =
      lng.toFixed(6);

    placeSearchMarker(
      lat,
      lng,
      "Selected Location"
    );

  });

}

/* =========================================================
   SEARCH LOCATION
   ========================================================= */

async function searchLocation(){

  const query =
    document.getElementById("locationSearch").value.trim();

  if(!query){

    showMessage("Enter a location.");
    return;

  }

  showMessage("Searching location...");

  try{

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json&limit=1&q=" +
      encodeURIComponent(query);

    const response = await fetch(
      url,
      {
        headers:{
          "Accept":"application/json"
        }
      }
    );

    if(!response.ok){
      throw new Error("Location service unavailable.");
    }

    const data = await response.json();

    if(!data.length){

      showMessage("Location not found.");
      return;

    }

    const result = data[0];

    showLocation(
      parseFloat(result.lat),
      parseFloat(result.lon),
      result.display_name
    );

  }
  catch(error){

    console.error(error);
    showMessage("Location search failed.");

  }

}

/* =========================================================
   COORDINATES
   ========================================================= */

function searchCoordinates(){

  const lat = parseFloat(
    document.getElementById("searchLat").value
  );

  const lng = parseFloat(
    document.getElementById("searchLng").value
  );

  if(Number.isNaN(lat) || Number.isNaN(lng)){

    showMessage("Enter valid coordinates.");
    return;

  }

  if(lat < -90 || lat > 90){

    showMessage("Latitude must be between -90 and 90.");
    return;

  }

  if(lng < -180 || lng > 180){

    showMessage("Longitude must be between -180 and 180.");
    return;

  }

  showLocation(
    lat,
    lng,
    "Selected Coordinates"
  );

}

/* =========================================================
   SHOW LOCATION
   ========================================================= */

function showLocation(lat,lng,name){

  if(!map){
    initializeMap();
  }

  map.setView([lat,lng],17);

  placeSearchMarker(lat,lng,name);

  document.getElementById("latitude").value =
    lat.toFixed(6);

  document.getElementById("longitude").value =
    lng.toFixed(6);

  document.getElementById("searchLat").value =
    lat.toFixed(6);

  document.getElementById("searchLng").value =
    lng.toFixed(6);

  if(name !== "Selected Coordinates"){

    document.getElementById("siteLocation").value =
      name;

  }

  const box =
    document.getElementById("locationResult");

  box.style.display = "block";

  box.innerHTML =
    "<b>📍 Location Found</b><br>" +
    escapeHTML(name) +
    "<br><br>" +
    "<b>Lat:</b> " +
    lat.toFixed(6) +
    "<br>" +
    "<b>Long:</b> " +
    lng.toFixed(6);

}

/* =========================================================
   SEARCH MARKER
   ========================================================= */

function placeSearchMarker(lat,lng,name){

  if(searchMarker){
    searchMarker.remove();
  }

  searchMarker =
    L.marker([lat,lng])
      .addTo(map)
      .bindPopup(
        "<b>📍 " +

    }

/* =========================================================
   RESIZE IMAGE
   ========================================================= */

function resizeImage(file,maxSize,quality){

  return new Promise(function(resolve,reject){

    const reader = new FileReader();

    reader.onload = function(event){

      const image = new Image();

      image.onload = function(){

        let width = image.width;
        let height = image.height;

        if(width > maxSize || height > maxSize){

          if(width > height){

            height = Math.round(
              height * maxSize / width
            );

            width = maxSize;

          }
          else{

            width = Math.round(
              width * maxSize / height
            );

            height = maxSize;

          }

        }

        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const context =
          canvas.getContext("2d");

        context.drawImage(
          image,
          0,
          0,
          width,
          height
        );

        resolve(
          canvas.toDataURL(
            "image/jpeg",
            quality
          )
        );

      };

      image.onerror = function(){

        reject(
          new Error("Invalid image.")
        );

      };

      image.src = event.target.result;

    };

    reader.onerror = function(){

      reject(
        new Error("Could not read file.")
      );

    };

    reader.readAsDataURL(file);

  });

}

/* =========================================================
   SAVE SITE
   ========================================================= */

async function saveSite(){

  const name =
    document.getElementById("siteName").value.trim();

  const location =
    document.getElementById("siteLocation").value.trim();

  const state =
    document.getElementById("state").value.trim();

  const city =
    document.getElementById("city").value.trim();

  const lat =
    parseFloat(document.getElementById("latitude").value);

  const lng =
    parseFloat(document.getElementById("longitude").value);

  if(!name){

    showMessage("Enter Site Name / ID.");
    return;

  }

  if(Number.isNaN(lat) || Number.isNaN(lng)){

    showMessage("Select a location on the map first.");
    return;

  }

  if(lat < -90 || lat > 90){

    showMessage("Invalid latitude.");
    return;

  }

  if(lng < -180 || lng > 180){

    showMessage("Invalid longitude.");
    return;

  }

  const editId =
    document.getElementById("editId").value.trim();

  let photoURL =
    document.getElementById("photoPreview").dataset.url || "";

  const photoFile =
    document.getElementById("photo").files[0];

  if(photoFile){

    try{

      showMessage("Processing site photo...");

      photoURL =
        await resizeImage(
          photoFile,
          1200,
          0.82
        );

    }
    catch(error){

      console.error(error);
      showMessage("Could not process photo.");
      return;

    }

  }

  const width =
    Number(document.getElementById("width").value) || 0;

  const height =
    Number(document.getElementById("height").value) || 0;

  const units =
    Number(document.getElementById("units").value) || 1;

  const rate =
    Number(document.getElementById("rate").value) || 0;

  const duration =
    Number(document.getElementById("duration").value) || 1;

  let pmRate =
    Number(document.getElementById("pmRate").value) || 0;

  const illumination =
    document.getElementById("illumination").value;

  if(illumination === "DOOH"){
    pmRate = 0;
  }

  const area =
    width * height * units;

  const displayCharges =
    rate * duration / 30;

  const pmCharges =
    area * pmRate;

  const totalCost =
    displayCharges + pmCharges;

  const siteData = {

    id:
      editId ||
      generateID(),

    site_name:
      name,

    state:
      state,

    city:
      city,

    location:
      location,

    latitude:
      lat,

    longitude:
      lng,

    width:
      width,

    height:
      height,

    units:
      units,

    total_area:
      area,

    media_type:
      document.getElementById("mediaType").value,

    illumination:
      illumination,

    traffic:
      document.getElementById("traffic").value,

    monthly_rate:
      rate,

    duration:
      duration,

    display_charges:
      displayCharges,

    pm_rate:
      pmRate,

    pm_charges:
      pmCharges,

    total_cost:
      totalCost,

    status:
      document.getElementById("status").value,

    photo_url:
      photoURL,

    remarks:
      document.getElementById("remarks").value.trim(),

    updated_at:
      new Date().toISOString()

  };

  if(editId){

    const index =
      sites.findIndex(
        site => site.id === editId
      );

    if(index !== -1){

      siteData.created_at =
        sites[index].created_at ||
        new Date().toISOString();

      sites[index] =
        siteData;

    }

    showMessage("Site updated successfully.");

  }
  else{

    siteData.created_at =
      new Date().toISOString();

    sites.unshift(siteData);

    selectedSites.add(siteData.id);

    showMessage("Site saved successfully.");

  }

  const savedSuccessfully =
    await saveLocalData();

  if(!savedSuccessfully){

    if(editId){

      await loadLocalData();

    }
    else{

      sites =
        sites.filter(
          site => site.id !== siteData.id
        );

      selectedSites.delete(siteData.id);

    }

    return;

  }

  renderSites();
  renderMarkers();
  clearForm();

}

/* =========================================================
   SELECT SITE
   ========================================================= */

function selectSite(id){

  if(selectedSites.has(id)){
    selectedSites.delete(id);
  }
  else{
    selectedSites.add(id);
  }

  renderSites();

}

/* =========================================================
   VIEW SITE
   ========================================================= */

function viewSite(id){

  const site =
    sites.find(item => item.id === id);

  if(!site){
    return;
  }

  const lat = Number(site.latitude);
  const lng = Number(site.longitude);

  if(Number.isNaN(lat) || Number.isNaN(lng)){

    showMessage("Site has invalid coordinates.");
    return;

  }

  if(!map){
    initializeMap();
  }

  map.setView([lat,lng],17);

  placeSearchMarker(
    lat,
    lng,
    site.site_name
  );

  selectedSites.add(site.id);

  renderSites();

}

/* =========================================================
   EDIT SITE
   ========================================================= */

function editSite(id){

  const site =
    sites.find(item => item.id === id);

  if(!site){
    return;
  }

  document.getElementById("editId").value =
    site.id;

  document.getElementById("siteName").value =
    site.site_name || "";

  document.getElementById("state").value =
    site.state || "";

  document.getElementById("city").value =
    site.city || "";

  document.getElementById("siteLocation").value =
    site.location || "";

  document.getElementById("latitude").value =
    site.latitude ?? "";

  document.getElementById("longitude").value =
    site.longitude ?? "";

  document.getElementById("width").value =
    site.width ?? 40;

  document.getElementById("height").value =
    site.height ?? 40;

  document.getElementById("units").value =
    site.units ?? 1;

  document.getElementById("mediaType").value =
    site.media_type || "Billboard";

  document.getElementById("illumination").value =
    site.illumination || "LIT";

  document.getElementById("traffic").value =
    site.traffic === "ET" ||
    site.traffic === "MT"
      ? site.traffic
      : "ET";

  document.getElementById("rate").value =
    site.monthly_rate ?? 0;

  document.getElementById("duration").value =
    site.duration ?? 30;

  document.getElementById("pmRate").value =
    site.pm_rate ?? 15;

  document.getElementById("status").value =
    site.status || "Available";

  document.getElementById("remarks").value =
    site.remarks || "";

  const preview =
    document.getElementById("photoPreview");

  preview.dataset.url =
    site.photo_url || "";

  if(site.photo_url){

    preview.src =
      site.photo_url;

    preview.style.display =
      "block";

  }
  else{

    preview.src = "";
    preview.style.display = "none";

  }

  document.getElementById("formTitle").innerText =
    "✏️ Edit OOH Site";

  calculateValues();

  viewSite(id);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

/* =========================================================
   DELETE SITE
   ========================================================= */

async function deleteSite(id){

  const site =
    sites.find(item => item.id === id);

  if(!site){
    return;
  }

  if(!confirm(
    "Delete " +
    site.site_name +
    " permanently?"
  )){
    return;
  }

  sites =
    sites.filter(
      item => item.id !== id
    );

  selectedSites.delete(id);

  const saved =
    await saveLocalData();

  if(!saved){

    await loadLocalData();
    return;

  }

  renderSites();
  renderMarkers();

  showMessage("Site deleted.");

}

async function clearAllSites(){

}

/* =========================================================

   ========================================================= */

async function imageUrlToDataUrl(url){

  if(!url){
    return null;
  }

  if(
    String(url).startsWith("data:image/")
  ){
    return url;
  }

  try{

    const response =
      await fetch(
        url,
        {
          mode:"cors",
          cache:"no-cache"
        }
      );

    if(!response.ok){
      throw new Error(
        "Image HTTP " +
        response.status
      );
    }

    const blob =
      await response.blob();

    return await new Promise(
      function(resolve,reject){

        const reader =
          new FileReader();

        reader.onloadend =
          function(){
            resolve(reader.result);
          };

        reader.onerror =
          function(){
            reject(
              new Error(
                "Could not read image."
              )
            );
          };

        reader.readAsDataURL(blob);

      }
    );

  }
  catch(error){

    console.error(
      "Could not convert image:",
      error
    );

    return null;

  }

}

/* =========================================================
   LOCATION MAP IMAGE FOR PPT
   ========================================================= */

async function createLocationMapDataUrl(lat, lng, width, height){

  const canvas =
    document.createElement("canvas");

  const mapWidth =
    Math.max(600, Math.round(width || 900));

  const mapHeight =
    Math.max(350, Math.round(height || 520));

  canvas.width = mapWidth;
  canvas.height = mapHeight;

  const ctx =
    canvas.getContext("2d");

  /* ---------------------------------------------------------
     FALLBACK MAP
     --------------------------------------------------------- */

  function drawFallbackMap(){

    ctx.fillStyle = "#eef2f6";
    ctx.fillRect(0, 0, mapWidth, mapHeight);

    ctx.strokeStyle = "#d2d8df";
    ctx.lineWidth = 18;

    const roads = [
      [0, mapHeight * .25, mapWidth, mapHeight * .68],
      [mapWidth * .15, mapHeight, mapWidth * .82, 0],
      [0, mapHeight * .72, mapWidth, mapHeight * .42],
      [mapWidth * .62, mapHeight, mapWidth * .35, 0]
    ];

    roads.forEach(function(r){

      ctx.beginPath();
      ctx.moveTo(r[0], r[1]);
      ctx.lineTo(r[2], r[3]);
      ctx.stroke();

    });

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 11;

    roads.forEach(function(r){

      ctx.beginPath();
      ctx.moveTo(r[0], r[1]);
      ctx.lineTo(r[2], r[3]);
      ctx.stroke();

    });

    ctx.strokeStyle = "#e0a94b";
    ctx.lineWidth = 9;

    ctx.beginPath();
    ctx.moveTo(0, mapHeight * .47);
    ctx.lineTo(mapWidth, mapHeight * .58);
    ctx.stroke();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.moveTo(0, mapHeight * .47);
    ctx.lineTo(mapWidth, mapHeight * .58);
    ctx.stroke();

    ctx.fillStyle = "#dfe8d7";

    [
      [.08,.08,.24,.18],
      [.68,.10,.25,.18],
      [.10,.73,.20,.18],
      [.70,.70,.22,.18]
    ].forEach(function(a){

      ctx.fillRect(
        mapWidth * a[0],
        mapHeight * a[1],
        mapWidth * a[2],
        mapHeight * a[3]
      );

    });

    /* Pin */

    const px = mapWidth / 2;
    const py = mapHeight / 2;

    ctx.beginPath();
    ctx.fillStyle = "#0b78c9";
    ctx.arc(px, py - 18, 24, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(px - 18, py - 2);
    ctx.lineTo(px, py + 34);
    ctx.lineTo(px + 18, py - 2);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.fillStyle = "#ffffff";
    ctx.arc(px, py - 18, 9, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#64748b";
    ctx.font = "bold 22px Arial";
    ctx.fillText(
      Number(lat).toFixed(5) + ", " + Number(lng).toFixed(5),
      18,
      mapHeight - 20
    );

  }

  if(
    Number.isNaN(Number(lat)) ||
    Number.isNaN(Number(lng))
  ){

    drawFallbackMap();

    return canvas.toDataURL("image/png");

  }

  try{

    const zoom = 15;
    const tileSize = 256;

    const latRad =
      Number(lat) * Math.PI / 180;

    const n =
      Math.pow(2, zoom);

    const centerX =
      (Number(lng) + 180) / 360 * n;

    const centerY =
      (
        1 -
        Math.asinh(Math.tan(latRad)) / Math.PI
      ) / 2 * n;

    const tilesAcross = 3;
    const tilesDown = 3;

    const startX =
      Math.floor(centerX) - 1;

    const startY =
      Math.floor(centerY) - 1;

    const canvasMap =
      document.createElement("canvas");

    canvasMap.width =
      tileSize * tilesAcross;

    canvasMap.height =
      tileSize * tilesDown;

    const mapCtx =
      canvasMap.getContext("2d");

    mapCtx.fillStyle = "#eef2f6";
    mapCtx.fillRect(
      0,
      0,
      canvasMap.width,
      canvasMap.height
    );

    async function loadTile(x, y){

      const wrappedX =
        ((x % n) + n) % n;

      if(
        y < 0 ||
        y >= n
      ){

        return;

      }

      const tileUrl =
        "https://tile.openstreetmap.org/" +
        zoom + "/" +
        wrappedX + "/" +
        y + ".png";

      const response =
        await fetch(
          tileUrl,
          {
            mode:"cors",
            cache:"force-cache"
          }
        );

      if(!response.ok){

        throw new Error(
          "Map tile HTTP " + response.status
        );

      }

      const blob =
        await response.blob();

      const bitmap =
        await createImageBitmap(blob);

      mapCtx.drawImage(
        bitmap,
        (x - startX) * tileSize,
        (y - startY) * tileSize,
        tileSize,
        tileSize
      );

      if(bitmap.close){

        bitmap.close();

      }

    }

    const tilePromises = [];

    for(
      let ty = startY;
      ty < startY + tilesDown;
      ty++
    ){

      for(
        let tx = startX;
        tx < startX + tilesAcross;
        tx++
      ){

        tilePromises.push(
          loadTile(tx, ty)
        );

      }

    }

    await Promise.all(tilePromises);

    const localPixelX =
      (centerX - startX) * tileSize;

    const localPixelY =
      (centerY - startY) * tileSize;

    /* Crop around the exact center */

    const cropW = mapWidth;
    const cropH = mapHeight;

    canvas.width = cropW;
    canvas.height = cropH;

    const sourceX =
      Math.max(
        0,
        Math.min(
          canvasMap.width - cropW,
          localPixelX - cropW / 2
        )
      );

    const sourceY =
      Math.max(
        0,
        Math.min(
          canvasMap.height - cropH,
          localPixelY - cropH / 2
        )
      );

    ctx.drawImage(
      canvasMap,
      sourceX,
      sourceY,
      Math.min(cropW, canvasMap.width),
      Math.min(cropH, canvasMap.height),
      0,
      0,
      cropW,
      cropH
    );

    /* Blue location pin */

    const px = cropW / 2;
    const py = cropH / 2;

    ctx.beginPath();
    ctx.fillStyle = "#0b78c9";
    ctx.arc(px, py - 18, 23, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(px - 17, py - 2);
    ctx.lineTo(px, py + 31);
    ctx.lineTo(px + 17, py - 2);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.fillStyle = "#ffffff";
    ctx.arc(px, py - 18, 8, 0, Math.PI * 2);
    ctx.fill();

    return canvas.toDataURL("image/png");

  }
  catch(error){

    console.warn(
      "Static map generation failed. Using fallback map.",
      error
    );

    drawFallbackMap();

    return canvas.toDataURL("image/png");

  }

}

function escapeHTML(text){

  return String(text ?? "")
    .replace(
      /[&<>"']/g,
      function(character){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[character];

      }
    );

}

/* =========================================================
   ESCAPE ATTRIBUTE
   ========================================================= */

function escapeAttribute(text){

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}

/* =========================================================
   PHOTO PREVIEW
   ========================================================= */

document
  .getElementById("photo")
  .addEventListener(
    "change",
    async function(){

      const file = this.files[0];

      const preview =
        document.getElementById("photoPreview");

      if(!file){

        preview.src = "";
        preview.style.display = "none";
        return;

      }

      try{

        const dataURL =
          await resizeImage(
            file,
            1200,
            0.82
          );

        preview.src = dataURL;

        preview.dataset.url = "";

        preview.style.display = "block";

      }
      catch(error){

        console.error(error);

        showMessage(
          "Could not preview image."
        );

      }

    }
  );

[
