<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY VISION OOH</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#172033;
}

header{
    height:62px;
    background:#111827;
    color:white;
    display:flex;
    align-items:center;
    padding:0 18px;
    gap:15px;
}

.logo{
    font-size:21px;
    font-weight:800;
}

.logo span{
    color:#22b5f2;
}

.header-buttons{
    margin-left:auto;
    display:flex;
    gap:8px;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 14px;
    font-weight:bold;
    cursor:pointer;
}

.blue{
    background:#0787c8;
    color:white;
}

.green{
    background:#16a34a;
    color:white;
}

.red{
    background:#dc2626;
    color:white;
}

.gray{
    background:#e5e7eb;
    color:#111827;
}

.layout{
    display:grid;
    grid-template-columns:370px 1fr;
    height:calc(100vh - 62px);
}

.sidebar{
    background:white;
    border-right:1px solid #ddd;
    padding:12px;
    overflow-y:auto;
}

#map{
    width:100%;
    height:100%;
}

.card{
    background:white;
    border:1px solid #dce1e7;
    border-radius:10px;
    padding:14px;
    margin-bottom:12px;
}

h2,h3{
    margin:3px 0 12px;
}

label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin:8px 0 4px;
}

input,select,textarea{
    width:100%;
    padding:9px;
    border:1px solid #cbd5e1;
    border-radius:6px;
    font-size:14px;
    background:white;
}

textarea{
    height:70px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.search-buttons{
    display:flex;
    gap:7px;
    margin-top:8px;
}

.search-buttons button{
    flex:1;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:10px;
}

.stat{
    background:#f3f6f9;
    border-radius:7px;
    padding:10px;
}

.stat b{
    display:block;
    font-size:21px;
    margin-top:3px;
}

.site{
    border:1px solid #d8dee6;
    border-radius:8px;
    padding:9px;
    margin-top:8px;
}

.site-title{
    font-size:14px;
    font-weight:bold;
}

.small{
    font-size:11px;
    color:#667085;
    margin-top:3px;
}

.site-buttons{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    margin-top:8px;
}

.site-buttons button{
    padding:6px 8px;
    font-size:11px;
}

.photo-preview{
    display:none;
    max-width:100%;
    max-height:140px;
    border-radius:7px;
    margin-top:7px;
}

#message{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#111827;
    color:white;
    padding:11px 18px;
    border-radius:8px;
    display:none;
    z-index:99999;
}

.location-result{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    border-radius:7px;
    padding:8px;
    margin-top:8px;
    font-size:12px;
}

@media(max-width:800px){

    header{
        height:auto;
        min-height:62px;
        flex-wrap:wrap;
        padding:10px;
    }

    .header-buttons{
        margin-left:0;
        width:100%;
        overflow-x:auto;
    }

    .layout{
        grid-template-columns:1fr;
        height:auto;
    }

    .sidebar{
        height:auto;
    }

    #map{
        height:60vh;
    }
}
</style>
</head>

<body>

<header>

<div class="logo">
MY VISION <span>OOH</span>
</div>

<div class="header-buttons">

<button class="green" onclick="exportExcel()">
📊 Excel
</button>

<button class="green" onclick="exportPPT()">
📑 PPT
</button>

</div>

</header>


<div class="layout">


<!-- SIDEBAR -->

<div class="sidebar">


<!-- CAMPAIGN -->

<div class="card">

<h3>Campaign</h3>

<input
id="campaign"
placeholder="Client / Campaign Name"
>

<div class="stats">

<div class="stat">
Total Sites
<b id="totalSites">0</b>
</div>

<div class="stat">
Selected
<b id="selectedSites">0</b>
</div>

</div>

</div>


<!-- LOCATION SEARCH -->

<div class="card">

<h3>🔎 Search Location</h3>

<label>
Search by Location Name
</label>

<input
id="locationSearch"
placeholder="Bandra West, Mumbai"
>

<button
class="blue"
style="width:100%;margin-top:8px"
onclick="searchLocation()"
>
🔎 SEARCH LOCATION
</button>


<label>
OR Enter Latitude & Longitude
</label>

<div class="row">

<div>

<label>Latitude</label>

<input
id="searchLat"
type="number"
step="any"
placeholder="19.0596"
>

</div>

<div>

<label>Longitude</label>

<input
id="searchLng"
type="number"
step="any"
placeholder="72.8295"
>

</div>

</div>


<button
class="blue"
style="width:100%;margin-top:8px"
onclick="searchCoordinates()"
>
📍 FIND COORDINATES
</button>


<button
class="gray"
style="width:100%;margin-top:7px"
onclick="useMyLocation()"
>
📌 USE MY LOCATION
</button>


<div
id="locationResult"
class="location-result"
style="display:none"
></div>

</div>


<!-- ADD SITE -->

<div class="card">

<h3 id="formTitle">
➕ Add OOH Site
</h3>

<input
id="editId"
type="hidden"
>

<label>
Site Name / ID
</label>

<input
id="siteName"
placeholder="MUM-001"
>


<label>
Location
</label>

<input
id="siteLocation"
placeholder="Bandra West, Mumbai"
>


<div class="row">

<div>

<label>Latitude</label>

<input
id="latitude"
type="number"
step="any"
>

</div>

<div>

<label>Longitude</label>

<input
id="longitude"
type="number"
step="any"
>

</div>

</div>


<div class="row">

<div>

<label>Width (ft)</label>

<input
id="width"
type="number"
value="40"
>

</div>

<div>

<label>Height (ft)</label>

<input
id="height"
type="number"
value="40"
>

</div>

</div>


<div class="row">

<div>

<label>Media Type</label>

<select id="mediaType">

<option>Billboard</option>
<option>Unipole</option>
<option>Gantries</option>
<option>Bus Shelter</option>
<option>Digital</option>
<option>Other</option>

</select>

</div>


<div>

<label>Illumination</label>

<select id="illumination">

<option>Lit</option>
<option>Non-Lit</option>
<option>Digital</option>

</select>

</div>

</div>


<div class="row">

<div>

<label>Monthly Rate ₹</label>

<input
id="rate"
type="number"
value="0"
>

</div>


<div>

<label>Status</label>

<select id="status">

<option>Available</option>
<option>Booked</option>
<option>Hold</option>
<option>Unavailable</option>

</select>

</div>

</div>


<label>
Site Photo
</label>

<input
id="photo"
type="file"
accept="image/*"
onchange="previewPhoto(event)"
>

<img
id="photoPreview"
class="photo-preview"
>


<label>
Remarks
</label>

<textarea
id="remarks"
placeholder="Facing direction, traffic details, etc."
></textarea>


<button
class="blue"
style="width:100%;margin-top:10px"
onclick="saveSite()"
>
💾 SAVE SITE
</button>


<button
class="gray"
style="width:100%;margin-top:7px"
onclick="clearForm()"
>
CLEAR
</button>

</div>


<!-- SAVED SITES -->

<div class="card">

<h3>
📌 Saved OOH Sites
</h3>

<input
id="siteSearch"
placeholder="Search saved sites..."
oninput="renderSites()"
>

<div id="siteList"></div>

</div>


</div>


<!-- MAP -->

<div id="map"></div>

</div>


<div id="message"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>


<script>

/* =========================================================
   MY VISION OOH
   ZERO SETUP VERSION

   Sites are saved in your browser using localStorage.
   ========================================================= */


let sites =
JSON.parse(
localStorage.getItem("MY_VISION_OOH_SITES") || "[]"
);

let selectedSites =
new Set();

let map;

let markers = [];

let searchMarker = null;

let currentPhoto = "";


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text){

const box =
document.getElementById("message");

box.innerText = text;

box.style.display = "block";

setTimeout(function(){

box.style.display = "none";

},2500);

}


/* =========================================================
   SAVE DATA TO BROWSER
   ========================================================= */

function saveToBrowser(){

localStorage.setItem(
"MY_VISION_OOH_SITES",
JSON.stringify(sites)
);

}


/* =========================================================
   MAP
   ========================================================= */

function initializeMap(){

map =
L.map("map")
.setView(
[19.0760,72.8777],
11
);


L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap contributors"
}
).addTo(map);


/* CLICK MAP */

map.on(
"click",
function(event){

const lat =
event.latlng.lat;

const lng =
event.latlng.lng;


document.getElementById(
"latitude"
).value =
lat.toFixed(6);


document.getElementById(
"longitude"
).value =
lng.toFixed(6);


document.getElementById(
"searchLat"
).value =
lat.toFixed(6);


document.getElementById(
"searchLng"
).value =
lng.toFixed(6);


placeSearchMarker(
lat,
lng,
"Selected Location"
);


showMessage(
"Coordinates selected"
);

}
);

}


/* =========================================================
   SEARCH LOCATION NAME
   ========================================================= */

async function searchLocation(){

const query =
document.getElementById(
"locationSearch"
).value.trim();


if(!query){

showMessage(
"Enter a location name"
);

return;

}


showMessage(
"Searching location..."
);


try{

const url =
"https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+
encodeURIComponent(query);


const response =
await fetch(
url,
{
headers:{
"Accept-Language":"en"
}
}
);


const data =
await response.json();


if(!data.length){

showMessage(
"Location not found"
);

return;

}


const result =
data[0];


const lat =
parseFloat(result.lat);

const lng =
parseFloat(result.lon);


showLocation(
lat,
lng,
result.display_name
);


}
catch(error){

showMessage(
"Location search failed"
);

}

}


/* =========================================================
   SEARCH LAT LONG
   ========================================================= */

function searchCoordinates(){

const lat =
parseFloat(
document.getElementById(
"searchLat"
).value
);


const lng =
parseFloat(
document.getElementById(
"searchLng"
).value
);


if(
isNaN(lat) ||
isNaN(lng)
){

showMessage(
"Enter valid Latitude and Longitude"
);

return;

}


if(
lat < -90 ||
lat > 90 ||
lng < -180 ||
lng > 180
){

showMessage(
"Invalid coordinates"
);

return;

}


showLocation(
lat,
lng,
"Selected Coordinates"
);

}


/* =========================================================
   SHOW LOCATION ON MAP
   ========================================================= */

function showLocation(
lat,
lng,
name
){

map.setView(
[lat,lng],
17
);


placeSearchMarker(
lat,
lng,
name
);


/* PUT COORDINATES IN SITE FORM */

document.getElementById(
"latitude"
).value =
lat.toFixed(6);


document.getElementById(
"longitude"
).value =
lng.toFixed(6);


document.getElementById(
"searchLat"
).value =
lat.toFixed(6);


document.getElementById(
"searchLng"
).value =
lng.toFixed(6);


/* PUT LOCATION NAME */

if(
name !== "Selected Coordinates"
){

document.getElementById(
"siteLocation"
).value =
name;

}


/* RESULT BOX */

const resultBox =
document.getElementById(
"locationResult"
);

resultBox.style.display =
"block";

resultBox.innerHTML =

"<b>📍 Location Found</b><br>"+
escapeHTML(name)+
"<br><br>"+
"<b>Latitude:</b> "+
lat.toFixed(6)+
"<br>"+
"<b>Longitude:</b> "+
lng.toFixed(6);


showMessage(
"Location highlighted on map"
);

}


/* =========================================================
   SEARCH MARKER
   ========================================================= */

function placeSearchMarker(
lat,
lng,
name
){

if(searchMarker){

searchMarker.remove();

}


searchMarker =
L.marker(
[lat,lng]
)
.addTo(map)
.bindPopup(
"<b>📍 "+
escapeHTML(name)+
"</b><br><br>"+
lat.toFixed(6)+
", "+
lng.toFixed(6)
)
.openPopup();

}


/* =========================================================
   CURRENT LOCATION
   ========================================================= */

function useMyLocation(){

if(!navigator.geolocation){

showMessage(
"Location is not supported"
);

return;

}


navigator.geolocation.getCurrentPosition(

function(position){

const lat =
position.coords.latitude;

const lng =
position.coords.longitude;


showLocation(
lat,
lng,
"My Current Location"
);

},

function(){

showMessage(
"Please allow location permission"
);

}

);

}


/* =========================================================
   SAVE SITE
   ========================================================= */

async function saveSite(){

const siteName =
document.getElementById(
"siteName"
).value.trim();


const location =
document.getElementById(
"siteLocation"
).value.trim();


const lat =
parseFloat(
document.getElementById(
"latitude"
).value
);


const lng =
parseFloat(
document.getElementById(
"longitude"
).value
);


if(!siteName){

showMessage(
"Enter Site Name / ID"
);

return;

}


if(
isNaN(lat) ||
isNaN(lng)
){

showMessage(
"Select a location first"
);

return;

}


let photo =
currentPhoto;


const file =
document.getElementById(
"photo"
).files[0];


if(file){

photo =
await convertPhoto(file);

}


const editId =
document.getElementById(
"editId"
).value;


const site = {

id:
editId ||
Date.now().toString(),

siteName:
siteName,

location:
location,

latitude:
lat,

longitude:
lng,

width:
parseFloat(
document.getElementById(
"width"
).value
) || 0,

height:
parseFloat(
document.getElementById(
"height"
).value
) || 0,

mediaType:
document.getElementById(
"mediaType"
).value,

illumination:
document.getElementById(
"illumination"
).value,

rate:
parseFloat(
document.getElementById(
"rate"
).value
) || 0,

status:
document.getElementById(
"status"
).value,

photo:
photo,

remarks:
document.getElementById(
"remarks"
).value,

createdAt:
new Date().toISOString()

};


if(editId){

const index =
sites.findIndex(
function(item){

return item.id === editId;

}
);


if(index !== -1){

sites[index] =
site;

}

showMessage(
"Site updated"
);

}
else{

sites.unshift(site);

selectedSites.add(
site.id
);

showMessage(
"Site saved successfully"
);

}


saveToBrowser();

renderSites();

renderMarkers();

clearForm();

}


/* =========================================================
   CONVERT PHOTO
   ========================================================= */

function convertPhoto(file){

return new Promise(
function(resolve,reject){

const reader =
new FileReader();


reader.onload =
function(event){

const image =
new Image();


image.onload =
function(){

const canvas =
document.createElement(
"canvas"
);


const max =
1200;


let width =
image.width;

let height =
image.height;


if(width > max){

height =
height * max / width;

width =
max;

}


if(height > max){

width =
width * max / height;

height =
max;

}


canvas.width =
width;

canvas.height =
height;


const ctx =
canvas.getContext(
"2d"
);


ctx.drawImage(
image,
0,
0,
width,
height
);


resolve(
canvas.toDataURL(
"image/jpeg",
0.72
)
);

};


image.src =
event.target.result;

};


reader.onerror =
reject;


reader.readAsDataURL(file);

}
);

}


/* =========================================================
   PHOTO PREVIEW
   ========================================================= */

function previewPhoto(event){

const file =
event.target.files[0];


if(!file){

return;

}


const reader =
new FileReader();


reader.onload =
function(e){

const img =
document.getElementById(
"photoPreview"
);


img.src =
e.target.result;

img.style.display =
"block";

currentPhoto =
e.target.result;

};


reader.readAsDataURL(file);

}


/* =========================================================
   RENDER MAP MARKERS
   ========================================================= */

function renderMarkers(){

markers.forEach(
function(marker){

marker.remove();

}
);


markers = [];


sites.forEach(
function(site){

const marker =
L.marker(
[
site.latitude,
site.longitude
]
)
.addTo(map);


marker.bindPopup(

"<b>"+
escapeHTML(site.siteName)+
"</b><br>"+

escapeHTML(
site.location || ""
)+

"<br><br>"+

"Size: "+
site.width+
" × "+
site.height+
" ft<br>"+

"Media: "+
escapeHTML(site.mediaType)+
"<br>"+

"Rate: ₹"+
Number(
site.rate || 0
).toLocaleString(
"en-IN"
)+

"<br>"+

"Status: "+
escapeHTML(site.status)

);


marker.on(
"click",
function(){

selectedSites.add(
site.id
);

renderSites();

}
);


markers.push(
marker
);

}

);

}


/* =========================================================
   RENDER SAVED SITES
   ========================================================= */

function renderSites(){

const list =
document.getElementById(
"siteList"
);


const search =
document.getElementById(
"siteSearch"
).value
.toLowerCase();


const filtered =
sites.filter(
function(site){

return (

site.siteName+
" "+
(site.location || "")+
" "+
site.mediaType

)
.toLowerCase()
.includes(search);

}
);


list.innerHTML =
"";


filtered.forEach(
function(site){

const div =
document.createElement(
"div"
);


div.className =
"site";


const selected =
selectedSites.has(
site.id
);


div.innerHTML =

"<div class='site-title'>"+
(selected ? "☑ " : "☐ ")+
escapeHTML(
site.siteName
)+
"</div>"+

"<div class='small'>"+
escapeHTML(
site.location || ""
)+
"</div>"+

"<div class='small'>"+
site.latitude+
", "+
site.longitude+
"</div>"+

"<div class='small'>"+
site.width+
" × "+
site.height+
" ft | ₹"+
Number(
site.rate || 0
).toLocaleString(
"en-IN"
)+
"</div>"+

"<div class='site-buttons'>"+

"<button class='blue' onclick=\"viewSite('"+
site.id+
"')\">MAP</button>"+

"<button class='gray' onclick=\"selectSite('"+
site.id+
"')\">"+
(selected ? "UNSELECT" : "SELECT")+
"</button>"+

"<button class='gray' onclick=\"editSite('"+
site.id+
"')\">EDIT</button>"+

"<button class='red' onclick=\"deleteSite('"+
site.id+
"')\">DELETE</button>"+

"</div>";


list.appendChild(
div
);

}
);


document.getElementById(
"totalSites"
).innerText =
sites.length;


document.getElementById(
"selectedSites"
).innerText =
selectedSites.size;

}


/* =========================================================
   SELECT
   ========================================================= */

function selectSite(id){

if(
selectedSites.has(id)
){

selectedSites.delete(id);

}
else{

selectedSites.add(id);

}


renderSites();

}


/* =========================================================
   VIEW SITE
   ========================================================= */

function viewSite(id){

const site =
sites.find(
function(item){

return item.id === id;

}
);


if(!site){

return;

}


map.setView(
[
site.latitude,
site.longitude
],
17
);


placeSearchMarker(
site.latitude,
site.longitude,
site.siteName
);


selectedSites.add(id);

renderSites();

}


/* =========================================================
   EDIT SITE
   ========================================================= */

function editSite(id){

const site =
sites.find(
function(item){

return item.id === id;

}
);


if(!site){

return;

}


document.getElementById(
"editId"
).value =
site.id;


document.getElementById(
"siteName"
).value =
site.siteName;


document.getElementById(
"siteLocation"
).value =
site.location;


document.getElementById(
"latitude"
).value =
site.latitude;


document.getElementById(
"longitude"
).value =
site.longitude;


document.getElementById(
"width"
).value =
site.width;


document.getElementById(
"height"
).value =
site.height;


document.getElementById(
"mediaType"
).value =
site.mediaType;


document.getElementById(
"illumination"
).value =
site.illumination;


document.getElementById(
"rate"
).value =
site.rate;


document.getElementById(
"status"
).value =
site.status;


document.getElementById(
"remarks"
).value =
site.remarks || "";


currentPhoto =
site.photo || "";


if(site.photo){

const image =
document.getElementById(
"photoPreview"
);

image.src =
site.photo;

image.style.display =
"block";

}


document.getElementById(
"formTitle"
).innerText =
"✏️ Edit OOH Site";


viewSite(id);

}


/* =========================================================
   DELETE
   ========================================================= */

function deleteSite(id){

if(
!confirm(
"Delete this site?"
)
){

return;

}


sites =
sites.filter(

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text){

return String(text || "")
.replace(
/[&<>"']/g,
function(character){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[character];

}
);

}


/* =========================================================
   EXPORT EXCEL
   ========================================================= */

function exportExcel(){

const data =
sites.filter(
function(site){

return selectedSites.size === 0 ||
selectedSites.has(site.id);

}
);


if(data.length === 0){

showMessage(
"No sites available"
);

return;

}


const rows =
data.map(
function(site,index){

return {

"S.No":
index + 1,

"Site Name / ID":
site.siteName,

"Location":
site.location,

"Latitude":
site.latitude,

"Longitude":
site.longitude,

"Width (ft)":
site.width,

"Height (ft)":
site.height,

"Media Type":
site.mediaType,

"Illumination":
site.illumination,

"Monthly Rate":
site.rate,

"Status":
site.status,

"Remarks":
site.remarks,

"Google Maps":
"https://www.google.com/maps?q="+
site.latitude+
","+
site.longitude

};

}
);


const worksheet =
XLSX.utils.json_to_sheet(
rows
);


const workbook =
XLSX.utils.book_new();


XLSX.utils.book_append_sheet(
workbook,
worksheet,
"OOH Sites"
);


XLSX.writeFile(
workbook,
"My_Vision_OOH_Sites.xlsx"
);


showMessage(
"Excel downloaded"
);

}
