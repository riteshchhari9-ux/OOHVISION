<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>My Vision OOH — Smart Site Planner</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --bg:#eef4fb;
  --card:rgba(255,255,255,.86);
  --cardSolid:#ffffff;
  --text:#142033;
  --muted:#718096;
  --blue:#087cf5;
  --cyan:#13d8ff;
  --purple:#725cff;
  --green:#16b978;
  --red:#ef476f;
  --orange:#ff9f2d;
  --border:rgba(150,170,195,.25);
  --shadow:0 18px 50px rgba(28,53,82,.13);
  --shadowSmall:0 7px 22px rgba(28,53,82,.10);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:
    Inter,
    Segoe UI,
    Roboto,
    Arial,
    sans-serif;
  color:var(--text);
}

body{
  overflow:hidden;
  background:
    radial-gradient(circle at 10% 10%,rgba(19,216,255,.16),transparent 28%),
    radial-gradient(circle at 90% 0%,rgba(114,92,255,.14),transparent 30%),
    linear-gradient(135deg,#edf5fc,#f7faff);
}

/* =========================================================
   ANIMATED BACKGROUND
========================================================= */

body:before,
body:after{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  filter:blur(80px);
  pointer-events:none;
  z-index:-1;
  animation:floatOrb 12s ease-in-out infinite alternate;
}

body:before{
  background:rgba(0,198,255,.13);
  left:-150px;
  top:100px;
}

body:after{
  background:rgba(114,92,255,.10);
  right:-150px;
  bottom:-100px;
  animation-delay:3s;
}

@keyframes floatOrb{
  from{
    transform:translate(0,0) scale(1);
  }
  to{
    transform:translate(50px,-35px) scale(1.15);
  }
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:relative;
  z-index:3000;

  background:rgba(255,255,255,.80);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  border-bottom:1px solid rgba(150,170,195,.25);

  box-shadow:
    0 8px 30px rgba(31,55,80,.09);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logoBox{
  width:44px;
  height:44px;
  border-radius:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:13px;
  font-weight:1000;
  color:#fff;

  background:
    linear-gradient(135deg,
      #087cf5,
      #13d8ff 55%,
      #725cff);

  box-shadow:
    0 9px 25px rgba(8,124,245,.30);

  animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
  0%,100%{
    transform:translateY(0) rotate(0deg);
  }
  50%{
    transform:translateY(-3px) rotate(2deg);
  }
}

.brandText{
  font-size:21px;
  font-weight:1000;
  letter-spacing:-.8px;
}

.brandText span{
  color:#08bfe8;
}

.tagline{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.headerActions{
  display:flex;
  gap:8px;
  align-items:center;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
  border:0;
  border-radius:12px;
  padding:10px 14px;

  font-weight:850;
  font-size:12px;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    filter .2s ease;

  white-space:nowrap;
}

.btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.03);
  box-shadow:0 10px 24px rgba(0,0,0,.13);
}

.btn:active{
  transform:translateY(0) scale(.98);
}

.btnBlue{
  color:white;
  background:
    linear-gradient(135deg,#087cf5,#00c9f5);
  box-shadow:0 7px 20px rgba(8,124,245,.20);
}

.btnGreen{
  color:white;
  background:
    linear-gradient(135deg,#0da96d,#20d28c);
  box-shadow:0 7px 20px rgba(22,185,120,.18);
}

.btnPurple{
  color:white;
  background:
    linear-gradient(135deg,#6552ef,#8a76ff);
}

.btnLight{
  color:#334155;
  background:rgba(255,255,255,.8);
  border:1px solid var(--border);
}

.btnRed{
  color:#e6395d;
  background:#fff1f4;
  border:1px solid #ffd4dd;
}

/* =========================================================
   MAIN LAYOUT
========================================================= */

.app{
  height:calc(100vh - 72px);
  display:grid;
  grid-template-columns:390px 1fr;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  padding:15px;
  overflow-y:auto;
  z-index:1500;

  background:
    linear-gradient(
      180deg,
      rgba(248,252,255,.94),
      rgba(237,245,252,.88)
    );

  border-right:1px solid rgba(150,170,195,.20);
}

.sidebar::-webkit-scrollbar{
  width:6px;
}

.sidebar::-webkit-scrollbar-thumb{
  background:#c7d5e5;
  border-radius:20px;
}

.section{
  padding:15px;
  margin-bottom:13px;

  background:var(--card);

  border:1px solid rgba(255,255,255,.8);
  border-radius:18px;

  box-shadow:var(--shadowSmall);

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  animation:sectionIn .45s ease both;
}

.section:nth-child(2){
  animation-delay:.06s;
}

.section:nth-child(3){
  animation-delay:.12s;
}

.section:nth-child(4){
  animation-delay:.18s;
}

@keyframes sectionIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.sectionTitle{
  color:#8090a5;
  font-size:10px;
  font-weight:950;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:10px;
}

/* =========================================================
   INPUTS
========================================================= */

.input{
  width:100%;
  padding:11px 12px;

  border-radius:11px;
  border:1px solid #dce6f0;

  background:rgba(247,250,253,.88);

  color:var(--text);
  font-size:13px;

  outline:none;

  transition:
    border-color .2s,
    box-shadow .2s,
    transform .2s,
    background .2s;
}

.input:hover{
  border-color:#bfd2e5;
}

.input:focus{
  border-color:#28aaf5;

  background:white;

  box-shadow:
    0 0 0 4px rgba(8,124,245,.08),
    0 5px 16px rgba(8,124,245,.07);

  transform:translateY(-1px);
}

textarea.input{
  resize:vertical;
}

/* =========================================================
   STATS
========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.stat{
  padding:12px 7px;
  border-radius:13px;

  background:
    linear-gradient(145deg,
      rgba(255,255,255,.95),
      rgba(235,244,252,.85));

  border:1px solid #e0eaf3;

  text-align:center;

  transition:.25s;
}

.stat:hover{
  transform:translateY(-3px);
  box-shadow:0 9px 20px rgba(30,60,90,.09);
}

.statNum{
  font-size:21px;
  font-weight:1000;
}

.statLabel{
  margin-top:3px;
  font-size:9px;
  color:#8492a6;
  font-weight:850;
  text-transform:uppercase;
}

.cloudStatus{
  display:flex;
  align-items:center;
  gap:7px;

  font-size:10px;
  font-weight:850;
  color:#12a96d;
}

.cloudDot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#16c77b;

  box-shadow:
    0 0 0 4px rgba(22,199,123,.12);

  animation:pulseCloud 2s infinite;
}

@keyframes pulseCloud{
  0%,100%{
    box-shadow:0 0 0 3px rgba(22,199,123,.10);
  }
  50%{
    box-shadow:0 0 0 7px rgba(22,199,123,.02);
  }
}

/* =========================================================
   FORM
========================================================= */

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.formFull{
  grid-column:1/-1;
}

/* =========================================================
   SELECTED SITE LIST
========================================================= */

.selectedHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
}

.selectedHeader h3{
  margin:0;
  font-size:16px;
}

.siteList{
  display:flex;
  flex-direction:column;
  gap:8px;

  max-height:420px;
  overflow-y:auto;
}

.siteList::-webkit-scrollbar{
  width:5px;
}

.siteList::-webkit-scrollbar-thumb{
  background:#cbd8e5;
  border-radius:10px;
}

.siteCard{
  position:relative;

  display:flex;
  gap:9px;

  padding:8px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.98),
      rgba(244,249,253,.92)
    );

  border:1px solid #dce6f0;
  border-radius:14px;

  cursor:pointer;

  box-shadow:0 4px 13px rgba(30,60,90,.06);

  transition:
    transform .22s ease,
    box-shadow .22s ease,
    border-color .22s ease;
}

.siteCard:hover{
  transform:
    translateY(-3px)
    scale(1.008);

  border-color:#75c3fb;

  box-shadow:
    0 13px 28px rgba(8,124,245,.14);
}

.siteThumb{
  width:62px;
  height:57px;

  flex-shrink:0;

  object-fit:cover;

  border-radius:9px;

  background:#e7eef5;
}

.siteInfo{
  min-width:0;
  flex:1;
}

.siteName{
  font-size:11px;
  font-weight:950;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.siteLocation{
  margin-top:3px;

  color:#77859a;
  font-size:9px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.siteMeta{
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  margin-top:5px;
}

.badge{
  padding:3px 6px;

  border-radius:5px;

  background:#edf6ff;
  color:#087cf5;

  font-size:8px;
  font-weight:900;
}

.removeBtn{
  width:24px;
  height:24px;

  border:0;
  border-radius:7px;

  background:#fff0f3;
  color:#e6395d;

  cursor:pointer;

  font-weight:1000;

  transition:.2s;
}

.removeBtn:hover{
  transform:scale(1.1) rotate(5deg);
  background:#ffe0e7;
}

/* =========================================================
   MAP AREA
========================================================= */

.mapArea{
  position:relative;
  padding:11px;

  background:
    radial-gradient(
      circle at 80% 20%,
      rgba(0,198,255,.08),
      transparent 35%
    ),
    linear-gradient(135deg,#dce8f3,#f7fafc);
}

.mapFrame{
  height:100%;
  width:100%;

  overflow:hidden;

  position:relative;

  border-radius:23px;

  border:1px solid rgba(255,255,255,.9);

  box-shadow:
    0 25px 70px rgba(31,55,80,.18),
    0 5px 20px rgba(31,55,80,.08);

  animation:mapAppear .7s ease both;
}

@keyframes mapAppear{
  from{
    opacity:0;
    transform:scale(.985);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

#map{
  width:100%;
  height:100%;
}

/* =========================================================
   MAP TOP GLASS PANEL
========================================================= */

.mapTopCard{
  position:absolute;

  top:18px;
  left:18px;

  z-index:1000;

  padding:12px 15px;

  border-radius:15px;

  background:rgba(255,255,255,.84);

  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.9);

  box-shadow:
    0 12px 30px rgba(25,55,85,.16);

  animation:cardFloat 4s ease-in-out infinite;
}

@keyframes cardFloat{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-3px);
  }
}

.mapTopTitle{
  font-size:11px;
  font-weight:1000;
}

.mapTopSub{
  margin-top:3px;
  color:#718096;
  font-size:9px;
}

/* =========================================================
   MAP MODE BUTTON
========================================================= */

.mapMode{
  position:absolute;

  top:18px;
  right:18px;

  z-index:1000;

  display:flex;
  gap:5px;

  padding:5px;

  border-radius:13px;

  background:rgba(255,255,255,.82);
  backdrop-filter:blur(16px);

  box-shadow:0 10px 25px rgba(30,60,90,.14);

  border:1px solid rgba(255,255,255,.9);
}

.mapMode button{
  border:0;
  border-radius:9px;

  padding:7px 10px;

  font-size:10px;
  font-weight:850;

  cursor:pointer;

  background:transparent;
  color:#64748b;

  transition:.2s;
}

.mapMode button:hover{
  background:#eef6ff;
  color:#087cf5;
}

.mapMode button.active{
  background:#087cf5;
  color:white;

  box-shadow:0 5px 13px rgba(8,124,245,.22);
}

/* =========================================================
   CUSTOM MARKERS
========================================================= */

.customMarkerWrap{
  position:relative;
}

.customMarker{
  width:34px;
  height:34px;

  border-radius:50% 50% 50% 0;

  transform:rotate(-45deg);

  background:
    linear-gradient(
      135deg,
      #087cf5,
      #00d9ff
    );

  border:3px solid white;

  box-shadow:
    0 7px 18px rgba(8,124,245,.35);

  animation:markerPop .35s ease both;
}

.customMarker:after{
  content:"";

  position:absolute;

  width:9px;
  height:9px;

  left:10px;
  top:10px;

  border-radius:50%;

  background:white;
}

@keyframes markerPop{
  from{
    opacity:0;
    transform:
      rotate(-45deg)
      scale(.3);
  }
  to{
    opacity:1;
    transform:
      rotate(-45deg)
      scale(1);
  }
}

/* =========================================================
   TOAST
========================================================= */

#toast{
  position:fixed;

  right:24px;
  bottom:24px;

  z-index:99999;

  min-width:220px;

  padding:13px 17px;

  border-radius:13px;

  color:white;

  background:
    linear-gradient(135deg,#142033,#253651);

  box-shadow:
    0 18px 40px rgba(0,0,0,.22);

  font-size:12px;
  font-weight:800;

  transform:
    translateY(30px)
    scale(.96);

  opacity:0;

  pointer-events:none;

  transition:.3s;
}

#toast.show{
  transform:
    translateY(0)
    scale(1);

  opacity:1;
}

/* =========================================================
   LEAFLET
========================================================= */

.leaflet-control-zoom{
  border:0!important;
  box-shadow:0 8px 20px rgba(20,40,70,.16)!important;
}

.leaflet-control-zoom a{
  border:0!important;
  background:rgba(255,255,255,.90)!important;
  backdrop-filter:blur(10px);
  color:#172033!important;
}

.leaflet-popup-content-wrapper{
  border-radius:15px!important;
  box-shadow:0 15px 35px rgba(20,40,70,.20)!important;
}

.leaflet-popup-content{
  margin:13px!important;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px){

  body{
    overflow:auto;
  }

  .topbar{
    height:auto;
    min-height:70px;
    flex-wrap:wrap;
    gap:8px;
    padding:10px;
  }

  .tagline{
    display:none;
  }

  .headerActions{
    width:100%;
    justify-content:flex-end;
  }

  .app{
    height:auto;
    display:flex;
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    max-height:none;
  }

  .mapArea{
    height:650px;
  }
}

</style>
</head>

<!-- =======================================================
     HEADER

<header class="topbar">

  <div class="brand">

    <div class="logoBox">
      MV
    </div>

    <div>

      <div class="brandText">
        MY VISION <span>OOH</span>
      </div>

      <div class="tagline">
        Professional Outdoor Advertising Site Planner
      </div>

    </div>

  </div>

  <div class="headerActions">

    <button class="btn btnLight"
      onclick="exportExcel()">
      📊 Excel
    </button>

    <button class="btn btnPurple"

      📑 PPT
    </button>

      onclick="saveCurrentSite()">
      ☁ Save to Cloud
    </button>

  </div>

</header>


<div class="app">

<!-- =======================================================
     SIDEBAR
======================================================= -->

<aside class="sidebar">

  <!-- PROJECT -->

  <div class="section">

    <div class="sectionTitle">
      Project Dashboard
    </div>

    <input
      id="campaignName"
      class="input"
      placeholder="Client / Campaign Name">

    <div style="height:11px"></div>

    <div class="stats">

      <div class="stat">
        <div class="statNum"
          id="totalCount">0</div>
        <div class="statLabel">
          Total
        </div>
      </div>

      <div class="stat">
        <div class="statNum"
          id="selectedCount">0</div>
        <div class="statLabel">
          Selected
        </div>
      </div>

      <div class="stat">
        <div class="statNum"
          id="cloudCount">0</div>
        <div class="statLabel">
          Cloud
        </div>
      </div>

    </div>

    <div style="height:11px"></div>

    <div class="cloudStatus">
      <span class="cloudDot"></span>
      Cloud database connected
    </div>

  <div class="section">

    <div class="sectionTitle">
      Add OOH Site

    <div class="formGrid">

        class="input formFull"
        placeholder="Site Name">

      <input
        id="location"
        class="input formFull"
        placeholder="Location">

      <input
        id="latitude"
        class="input"
        placeholder="Latitude">

      <input
        id="longitude"
        class="input"
        placeholder="Longitude">

      <input
        id="width"
        class="input"
        type="number"
        placeholder="Width (ft)">

      <input
        id="height"
        class="input"
        type="number"
        placeholder="Height (ft)">

      <input
        id="mediaType"
        class="input"
        placeholder="Media Type">

      <select
        id="illumination"
        class="input">

        <option value="">
          Illumination
        </option>

        <option value="F-LIT">
          F-LIT
        </option>

        <option value="Backlit">
          Backlit
        </option>

        <option value="Non-Lit">
          Non-Lit
        </option>

        <option value="LED">
          LED
        </option>

        <option value="Digital">
          Digital
        </option>

      </select>

      <input
        id="rate"
        class="input"
        type="number"
        placeholder="Rate ₹">

      <select
        id="status"
        class="input">

        <option value="Available">
          Available
        </option>

        <option value="Booked">
          Booked
        </option>

        <option value="Hold">
          Hold
        </option>

      </select>

      <input
        id="photo"
        class="input formFull"
        placeholder="Photo URL">

      <textarea
        id="remarks"
        class="input formFull"
        rows="3"
        placeholder="Remarks"></textarea>

    </div>

    <div style="height:9px"></div>

    <button
      class="btn btnBlue"
      style="width:100%"
      onclick="addSite()">

      📍 Add Site

    </button>

  </div>


  <!-- SELECTED SITES -->

  <div class="section">

    <div class="selectedHeader">

      <h3>
        Selected Sites
      </h3>

      <button
        class="btn btnRed"
        style="padding:7px 10px"
        onclick="clearSelected()">

        CLEAR

      </button>

    </div>

    <div
      id="siteList"
      class="siteList">
    </div>

  </div>


  <!-- SEARCH -->

  <div class="section">

    <div class="sectionTitle">
      Search Map
    </div>

    <input
      id="searchLocation"
      class="input"
      placeholder="Search Bandra, Andheri, Mumbai...">

    <div style="height:8px"></div>

    <button
      class="btn btnBlue"
      style="width:100%"
      onclick="searchLocation()">

      🔎 Search Location

    </button>

  </div>

</aside>


<!-- =======================================================
     MAP
======================================================= -->

<main class="mapArea">

  <div class="mapFrame">

    <div class="mapTopCard">

      <div class="mapTopTitle">
        🗺️ MY VISION OOH MAP
      </div>

      <div class="mapTopSub">
        Click anywhere to place an OOH site
      </div>

    </div>


    <div class="mapMode">

      <button
        id="standardBtn"
        class="active"
        onclick="setMapMode('standard')">

        Standard

      </button>

      <button
        id="satelliteBtn"
        onclick="setMapMode('satellite')">

        Satellite

      </button>

    </div>


    <div id="map"></div>

  </div>

</main>

</div>


<div id="toast"></div>

     LIBRARIES
======================================================= -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

let satelliteLayer;

    attribution:

  }
).addTo(map);


/* SATELLITE */

satelliteLayer =
L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:19,
    attribution:

  }
);


/* =========================================================
   MAP MODE
========================================================= */

function setMapMode(mode){

  const standardBtn =
    document.getElementById("standardBtn");

  const satelliteBtn =
    document.getElementById("satelliteBtn");


  if(mode==="satellite"){

    if(map.hasLayer(standardLayer))
      map.removeLayer(standardLayer);

    satelliteLayer.addTo(map);

    satelliteBtn.classList.add("active");
    standardBtn.classList.remove("active");

    showToast("🛰️ Satellite view enabled");

  }else{

    if(map.hasLayer(satelliteLayer))
      map.removeLayer(satelliteLayer);

    standardLayer.addTo(map);

    standardBtn.classList.add("active");
    satelliteBtn.classList.remove("active");

    showToast("🗺️ Standard map enabled");
  }
}


/* =========================================================
   CREATE MARKER
========================================================= */

function createMarker(site){

  const icon =
  L.divIcon({

    className:"customMarkerWrap",

    html:`
      <div class="customMarker"></div>
    `,

    iconSize:[34,34],
    iconAnchor:[17,34],
    popupAnchor:[0,-30]

  });


  const marker =
  L.marker(
    [
      Number(site.latitude),
      Number(site.longitude)
    ],
    {icon}
  ).addTo(map);


  marker.bindPopup(`

    <div style="min-width:230px">

      <div style="
        font-size:16px;
        font-weight:900;
        color:#142033;
      ">
        ${escapeHtml(
          site.site_name || "OOH Site"
        )}
      </div>

      <div style="
        margin-top:5px;
        color:#718096;
        font-size:11px;
      ">
        ${escapeHtml(
          site.location || ""
        )}
      </div>

      <hr style="
        border:0;
        border-top:1px solid #e5edf4;
      ">

      <div style="
        line-height:1.8;
        font-size:11px;
      ">

        📐
        <b>
          ${site.width || 0}
          ×
          ${site.height || 0} ft
        </b>

        <br>

        💡
        ${escapeHtml(
          site.illumination || "-"
        )}

        <br>

        🎞️
        ${escapeHtml(
          site.media_type || "-"
        )}

        <br>

        💰
        ₹${site.rate || 0}

        <br>

        📌
        ${escapeHtml(
          site.status || "-"
        )}

      </div>

      ${
        site.photo
        ?
        `
        <img
          src="${escapeAttr(site.photo)}"
          style="
            width:100%;
            height:130px;
            object-fit:cover;
            border-radius:10px;
            margin-top:8px;
          "
        >
        `
        :
        ""
      }

    </div>

  `);


  markers[site.id] =
    marker;


  return marker;
}

/* =========================================================
   ADD SITE
========================================================= */

async function addSite(){

  const site = {

    id:
      "site_" +
      Date.now() +
      "_" +
      Math.random()
      .toString(36)
      .substring(2,8),

    site_name:
      getValue("siteName"),

    location:
      getValue("location"),

    latitude:
      parseFloat(
        getValue("latitude")
      ),

    longitude:
      parseFloat(
        getValue("longitude")
      ),

    width:
      Number(
        getValue("width")
      ) || 0,

    height:
      Number(
        getValue("height")
      ) || 0,

    media_type:
      getValue("mediaType"),

    illumination:
      getValue("illumination"),

    rate:
      Number(
        getValue("rate")
      ) || 0,

    status:
      getValue("status") ||
      "Available",

    photo:
      getValue("photo"),

    remarks:
      getValue("remarks"),

    updated:
      new Date().toISOString()

  };


  if(!site.site_name){

    showToast(
      "⚠️ Enter site name"
    );

    return;
  }


  if(
    !Number.isFinite(site.latitude) ||
    !Number.isFinite(site.longitude)
  ){

    showToast(
      "⚠️ Select coordinates on map"
    );

    return;
  }


  sites.push(site);

  selectedSites.push(site);


  createMarker(site);

  renderSites();

  updateStats();

  clearForm();


  map.flyTo(
    [
      site.latitude,
      site.longitude
    ],
    16,
    {
      duration:1.1
    }
  );


  showToast(
    "✨ OOH site added"
  );
}


/* =========================================================
   SAVE TO SUPABASE
========================================================= */

async function saveCurrentSite(){

  if(!selectedSites.length){

    showToast(
      "⚠️ Add/select a site first"
    );

    return;
  }


  try{

    const {
      data,
      error:userError
    } =
      await supabaseClient
      .auth
      .getUser();


    if(userError)
      throw userError;


    const user =
      data?.user;


    if(!user){

      showToast(
        "⚠️ Please login to the website first"
      );

      return;
    }


    const rows =
      selectedSites.map(site => ({

        id:site.id,

        user_id:user.id,

        site_name:site.site_name,

        location:site.location,

        latitude:site.latitude,

        longitude:site.longitude,

        width:site.width,

        height:site.height,

        media_type:site.media_type,

        illumination:site.illumination,

        rate:site.rate,

        status:site.status,

        photo:site.photo,

        remarks:site.remarks,

        updated:
          new Date().toISOString()

      }));


    const {
      error
    } =
      await supabaseClient
      .from("ooh_sites")
      .upsert(
        rows,
        {
          onConflict:
            "user_id,id"
        }
      );


    if(error)
      throw error;


    showToast(
      `☁️ ${rows.length} site(s) saved`
    );


    updateStats();

  }
  catch(error){

    console.error(error);

    showToast(
      "❌ Cloud save failed"
    );

  }
}


/* =========================================================
   LOAD SAVED SITES
========================================================= */

async function loadSavedSites(){

  try{

    const {
      data,
      error:userError
    } =
      await supabaseClient
      .auth
      .getUser();


    if(userError)
      throw userError;


    const user =
      data?.user;


    if(!user){

      updateStats();

      return;
    }


    const {
      data:cloudSites,
      error
    } =
      await supabaseClient
      .from("ooh_sites")
      .select("*")
      .eq(
        "user_id",
        user.id
      )
      .order(
        "updated",
        {
          ascending:false
        }
      );


    if(error)
      throw error;


    sites =
      cloudSites || [];


    /*
      IMPORTANT:
      Cloud sites are also displayed in the
      Selected Sites panel so they appear
      on another device.
    */

    selectedSites =
      [...sites];


    Object.values(markers)
    .forEach(marker => {

      if(map.hasLayer(marker))
        map.removeLayer(marker);

    });


    markers = {};


    sites.forEach(site => {

      if(
        Number.isFinite(
          Number(site.latitude)
        ) &&
        Number.isFinite(
          Number(site.longitude)
        )
      ){

        createMarker(site);

      }

    });


    renderSites();

    updateStats();


    if(sites.length){

      showToast(
        `☁️ ${sites.length} cloud site(s) loaded`
      );

    }

  }
  catch(error){

    console.error(
      "LOAD ERROR:",
      error
    );

    showToast(
      "❌ Could not load cloud sites"
    );

  }
}


/* =========================================================
   RENDER SITES
========================================================= */

function renderSites(){

  const list =
    document.getElementById(
      "siteList"
    );


  list.innerHTML = "";


  selectedSites.forEach(
    (site,index) => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "siteCard";


      card.style.animation =
        `sectionIn .35s ease ${index*.035}s both`;


      const fallback =
        "https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=400";


      card.innerHTML = `

        <img
          class="siteThumb"
          src="${
            escapeAttr(
              site.photo || fallback
            )
          }"
          onerror="
            this.src='${fallback}'
          "
        >

        <div class="siteInfo">

          <div class="siteName">

            ${escapeHtml(
              site.site_name ||
              "OOH Site"
            )}

          </div>

          <div class="siteLocation">

            ${escapeHtml(
              site.location ||
              "Location not available"
            )}

          </div>

          <div class="siteMeta">

            <span class="badge">
              ${
                site.width || 0
              }
              ×
              ${
                site.height || 0
              } ft
            </span>

            <span class="badge">
              ${escapeHtml(
                site.illumination ||
                "-"
              )}
            </span>

          </div>

        </div>

        <button
          class="removeBtn"
          onclick="
            event.stopPropagation();
            removeSelected('${escapeAttr(site.id)}')
          "
        >
          ×
        </button>

      `;


      card.onclick =
        function(){

          if(
            Number.isFinite(
              Number(site.latitude)
            ) &&
            Number.isFinite(
              Number(site.longitude)
            )
          ){

            map.flyTo(
              [
                Number(site.latitude),
                Number(site.longitude)
              ],
              17,
              {
                duration:1
              }
            );


            setTimeout(
              () => {

                if(markers[site.id])
                  markers[site.id]
                  .openPopup();

              },
              500
            );

          }

        };


      list.appendChild(card);

    }
  );


  updateStats();
}


/* =========================================================
   REMOVE SELECTED
========================================================= */

function removeSelected(id){

  selectedSites =
    selectedSites.filter(
      site =>
        site.id !== id
    );


  renderSites();

  showToast(
    "Site removed from selection"
  );
}


/* =========================================================
   CLEAR
========================================================= */

function clearSelected(){

  selectedSites = [];

  renderSites();

  showToast(
    "Selection cleared"
  );
}


/* =========================================================
   SEARCH LOCATION
========================================================= */

async function searchLocation(){

  const query =
    getValue(
      "searchLocation"
    );


  if(!query){

    showToast(
      "Enter a location"
    );

    return;
  }


  try{

    const response =
      await fetch(
        "https://nominatim.openstreetmap.org/search?" +
        new URLSearchParams({

          q:query,

          format:"json",

          limit:1

        })
      );


    const results =
      await response.json();


    if(!results.length){

      showToast(
        "❌ Location not found"
      );

      return;
    }


    const result =
      results[0];


    const lat =
      Number(result.lat);

    const lon =
      Number(result.lon);


    map.flyTo(
      [lat,lon],
      15,
      {
        duration:1.2
      }
    );


    document.getElementById(
      "latitude"
    ).value =
      lat.toFixed(6);


    document.getElementById(
      "longitude"
    ).value =
      lon.toFixed(6);


    document.getElementById(
      "location"
    ).value =
      result.display_name;


    showToast(
      "📍 Location found"
    );

  }
  catch(error){

    console.error(error);

    showToast(
      "❌ Search failed"
    );

  }
}

          s.location || "",

  const workbook =
    XLSX.utils.book_new();


  const worksheet =
    XLSX.utils.json_to_sheet(
      rows

  worksheet["!cols"] = [

    {wch:45},

    {wch:14},

    {wch:55},
    {wch:45}

  XLSX.utils.book_append_sheet(
    workbook,

      /[^a-z0-9]/gi,

    ) +

  );


  showToast(
    "📊 Excel exported successfully"
  );
}


/* =========================================================
   IMAGE -> DATA URI
   Helps PPT export with remote photos
========================================================= */

async function imageToDataUri(url){

  if(!url)
    return null;


  try{

    const response =
      await fetch(
        url,
        {
          mode:"cors"
        }
      );


    if(!response.ok)
      return null;


    const blob =
      await response.blob();


    return await new Promise(
      resolve => {

        const reader =
          new FileReader();


        reader.onloadend =
          () => resolve(
            reader.result
          );


        reader.onerror =
          () => resolve(null);


        reader.readAsDataURL(
          blob
        );

      }
    );

  }
  catch(error){

    console.warn(
      "Image could not be loaded:",
      url
    );

    return null;

  }
}

/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =

  return String(
    value ?? ""

  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"

}
