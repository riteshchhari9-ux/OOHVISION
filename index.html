<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Vision OOH — Professional Site Planner</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
:root{
  --bg:#020914;
  --sidebar:#071525;
  --sidebar2:#0b1c30;
  --card:#0c2035;
  --card2:#102942;
  --line:#19344e;
  --text:#f4f8ff;
  --muted:#8296aa;
  --blue:#00a8ff;
  --cyan:#22d9ff;
  --green:#20d391;
  --red:#ff4568;
  --yellow:#ffc247;
  --shadow:0 15px 45px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  font-family:
    Inter,
    Segoe UI,
    Arial,
    sans-serif;

  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* =====================================================
   TOP BAR
===================================================== */

.topbar{
  height:54px;

  background:
    linear-gradient(
      90deg,
      #06111f,
      #07192b 50%,
      #06111f
    );

  border-bottom:1px solid #16304a;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 16px;

  position:relative;
  z-index:5000;

  box-shadow:
    0 8px 30px rgba(0,0,0,.28);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  font-size:19px;
  font-weight:1000;
  letter-spacing:-1px;
  white-space:nowrap;
}

.logo span{
  color:var(--cyan);
}

.tagline{
  color:#8196aa;
  font-size:12px;
  border-left:1px solid #28445e;
  padding-left:12px;
}

.headerActions{
  display:flex;
  align-items:center;
  gap:8px;
}

.btn{
  border:0;
  cursor:pointer;

  border-radius:9px;

  padding:9px 13px;

  font-weight:800;
  font-size:12px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn:active{
  transform:scale(.96);
}

.btnBlue{
  color:white;

  background:
    linear-gradient(
      135deg,
      #008df0,
      #15d4ff
    );

  box-shadow:
    0 7px 20px rgba(0,174,255,.22);
}

.btnGreen{
  color:#001c13;

  background:
    linear-gradient(
      135deg,
      #19c989,
      #45e6ae
    );
}

.btnDark{
  color:#d8e8f5;
  background:#112940;
  border:1px solid #21435e;
}

.btnRed{
  color:white;
  background:#d72e52;
}

/* =====================================================
   MAIN LAYOUT
===================================================== */

.app{
  height:calc(100vh - 54px);

  display:grid;

  grid-template-columns:
    360px 1fr;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
  background:
    linear-gradient(
      180deg,
      #071525 0%,
      #061322 100%
    );

  border-right:1px solid #17324b;

  overflow-y:auto;

  padding:12px;

  position:relative;
  z-index:2000;
}

.sidebar::-webkit-scrollbar{
  width:5px;
}

.sidebar::-webkit-scrollbar-thumb{
  background:#21445f;
  border-radius:20px;
}

.sidebar::-webkit-scrollbar-track{
  background:transparent;
}

/* =====================================================
   PANELS
===================================================== */

.section{
  background:
    linear-gradient(
      145deg,
      rgba(13,35,57,.98),
      rgba(7,24,41,.98)
    );

  border:1px solid #18354e;

  border-radius:15px;

  padding:13px;

  margin-bottom:11px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.22);

  animation:
    slideIn .45s ease both;
}

.section:nth-child(2){
  animation-delay:.05s;
}

.section:nth-child(3){
  animation-delay:.1s;
}

.section:nth-child(4){
  animation-delay:.15s;
}

@keyframes slideIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.sectionTitle{
  color:#71899f;

  font-size:10px;

  text-transform:uppercase;

  font-weight:900;

  letter-spacing:1.2px;

  margin-bottom:8px;
}

/* =====================================================
   PROJECT
===================================================== */

.projectTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:10px;
}

.projectTitle strong{
  font-size:16px;
}

.projectIcon{
  width:28px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:8px;

  background:#102e49;

  color:#28d9ff;
}

/* =====================================================
   INPUTS
===================================================== */

.input{
  width:100%;

  border:
    1px solid #1b3a55;

  background:#061423;

  color:#eaf4ff;

  padding:
    10px 11px;

  border-radius:9px;

  outline:none;

  font-size:12px;

  transition:
    border .2s,
    box-shadow .2s,
    background .2s;
}

.input::placeholder{
  color:#61778b;
}

.input:focus{
  border-color:#00aef5;

  background:#081a2b;

  box-shadow:
    0 0 0 3px rgba(0,174,245,.10);
}

select.input{
  cursor:pointer;
}

textarea.input{
  resize:vertical;
}

/* =====================================================
   STATS
===================================================== */

.stats{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:6px;
}

.stat{
  background:
    linear-gradient(
      145deg,
      #102942,
      #0b2035
    );

  border:
    1px solid #1a3a54;

  border-radius:10px;

  padding:9px 5px;

  text-align:center;

  transition:.25s;
}

.stat:hover{
  transform:translateY(-3px);

  border-color:#24749c;
}

.statNum{
  font-size:20px;
  font-weight:1000;
}

.statLabel{
  color:#6f879b;
  font-size:8px;
  text-transform:uppercase;
  font-weight:900;
  margin-top:2px;
}

/* =====================================================
   CLOUD STATUS
===================================================== */

.cloudStatus{
  display:flex;
  align-items:center;
  gap:7px;

  color:#38d99a;

  font-size:10px;
  font-weight:800;
}

.cloudDot{
  width:7px;
  height:7px;

  background:#2fe3a1;

  border-radius:50%;

  box-shadow:
    0 0 0 4px rgba(47,227,161,.10),
    0 0 15px rgba(47,227,161,.55);

  animation:pulse 1.8s infinite;
}

@keyframes pulse{
  0%,100%{
    box-shadow:
      0 0 0 4px rgba(47,227,161,.10),
      0 0 15px rgba(47,227,161,.55);
  }

  50%{
    box-shadow:
      0 0 0 7px rgba(47,227,161,.03),
      0 0 22px rgba(47,227,161,.85);
  }
}

/* =====================================================
   FORM
===================================================== */

.formGrid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:7px;
}

.formFull{
  grid-column:1/-1;
}

.addButton{
  width:100%;

  margin-top:2px;

  height:38px;

  font-size:12px;
}

/* =====================================================
   SELECTED SITES
===================================================== */

.selectedHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:9px;
}

.selectedHeader h3{
  margin:0;

  font-size:15px;
}

.siteList{
  display:flex;
  flex-direction:column;
  gap:7px;

  max-height:340px;

  overflow-y:auto;
}

.siteList::-webkit-scrollbar{
  width:4px;
}

.siteList::-webkit-scrollbar-thumb{
  background:#264b67;
  border-radius:20px;
}

.siteCard{
  background:
    linear-gradient(
      145deg,
      #0c233a,
      #091b2e
    );

  border:1px solid #183a54;

  border-radius:10px;

  padding:6px;

  display:flex;

  gap:8px;

  cursor:pointer;

  transition:
    transform .2s,
    border .2s,
    box-shadow .2s;
}

.siteCard:hover{
  transform:
    translateX(4px);

  border-color:#00aef5;

  box-shadow:
    0 7px 20px rgba(0,157,238,.14);
}

.siteThumb{
  width:53px;
  height:49px;

  object-fit:cover;

  border-radius:7px;

  background:#10253a;

  flex-shrink:0;
}

.siteInfo{
  min-width:0;
  flex:1;
}

.siteName{
  font-size:11px;

  font-weight:900;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.siteLocation{
  font-size:9px;

  color:#71889c;

  margin-top:3px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.siteMeta{
  display:flex;

  gap:4px;

  flex-wrap:wrap;

  margin-top:5px;
}

.badge{
  font-size:8px;

  font-weight:900;

  color:#59d9ff;

  background:#0b3049;

  border:1px solid #174a67;

  padding:2px 5px;

  border-radius:4px;
}

.removeBtn{
  width:23px;
  height:23px;

  flex-shrink:0;

  border:0;

  border-radius:6px;

  background:#3a1724;

  color:#ff5a7b;

  cursor:pointer;

  font-size:16px;

  font-weight:900;

  transition:.2s;
}

.removeBtn:hover{
  background:#ff4568;
  color:white;
}

/* =====================================================
   MAP AREA
===================================================== */

.mapArea{
  position:relative;

  padding:8px;

  background:#020a13;
}

.mapFrame{
  width:100%;
  height:100%;

  position:relative;

  overflow:hidden;

  border-radius:13px;

  border:1px solid #23425a;

  box-shadow:
    0 15px 50px rgba(0,0,0,.5);
}

#map{
  width:100%;
  height:100%;
}

/* =====================================================
   MAP TOP CARD
===================================================== */

.mapTopCard{
  position:absolute;

  top:13px;
  left:13px;

  z-index:1000;

  background:
    rgba(7,23,39,.92);

  backdrop-filter:blur(12px);

  border:
    1px solid #294a62;

  border-radius:11px;

  padding:9px 12px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.30);

  animation:
    floatCard 3s ease-in-out infinite;
}

@keyframes floatCard{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-3px);
  }
}

.mapTopTitle{
  font-size:11px;
  font-weight:1000;
}

.mapTopSub{
  color:#7890a4;
  font-size:9px;
  margin-top:3px;
}

/* =====================================================
   MAP GLOW
===================================================== */

.mapFrame::after{
  content:"";

  pointer-events:none;

  position:absolute;

  inset:0;

  z-index:500;

  box-shadow:
    inset 0 0 80px rgba(0,105,160,.12);

  border-radius:13px;
}

/* =====================================================
   LEAFLET
===================================================== */

.leaflet-control-zoom{
  border:0 !important;

  box-shadow:
    0 7px 20px rgba(0,0,0,.25) !important;
}

.leaflet-control-zoom a{
  background:#fff !important;

  color:#172033 !important;

  border:0 !important;

  font-weight:900;
}

.leaflet-control-attribution{
  font-size:9px;
}

/* =====================================================
   CUSTOM MARKER
===================================================== */

.ooh-marker{
  width:36px;
  height:36px;

  position:relative;

  transform:rotate(-45deg);

  border-radius:
    50% 50% 50% 0;

  background:
    linear-gradient(
      135deg,
      #007ff0,
      #00d9ff
    );

  border:
    3px solid white;

  box-shadow:
    0 7px 18px rgba(0,111,255,.45);

  animation:
    markerPulse 2s infinite;
}

.ooh-marker::after{
  content:"";

  width:9px;
  height:9px;

  position:absolute;

  top:10px;
  left:10px;

  background:white;

  border-radius:50%;
}

@keyframes markerPulse{
  0%,100%{
    filter:drop-shadow(
      0 0 0 rgba(0,190,255,.4)
    );
  }

  50%{
    filter:drop-shadow(
      0 0 12px rgba(0,190,255,.85)
    );
  }
}

/* =====================================================
   POPUP
===================================================== */

.leaflet-popup-content-wrapper{
  border-radius:12px !important;

  box-shadow:
    0 12px 35px rgba(0,0,0,.25) !important;
}

.leaflet-popup-content{
  margin:12px !important;
}

/* =====================================================
   TOAST
===================================================== */

#toast{
  position:fixed;

  right:20px;
  bottom:20px;

  z-index:99999;

  background:
    linear-gradient(
      135deg,
      #0d263d,
      #071827
    );

  border:
    1px solid #24506d;

  color:white;

  padding:11px 16px;

  border-radius:10px;

  font-size:12px;

  font-weight:800;

  box-shadow:
    0 15px 40px rgba(0,0,0,.35);

  transform:
    translateY(80px);

  opacity:0;

  pointer-events:none;

  transition:
    .3s ease;
}

#toast.show{
  transform:
    translateY(0);

  opacity:1;
}

/* =====================================================
   LOADING
===================================================== */

#loading{
  position:fixed;

  inset:0;

  z-index:100000;

  display:none;

  align-items:center;
  justify-content:center;

  background:
    rgba(2,9,20,.75);

  backdrop-filter:blur(8px);
}

.loadingBox{
  background:#0b2035;

  border:1px solid #214660;

  padding:25px 35px;

  border-radius:15px;

  text-align:center;

  box-shadow:var(--shadow);
}

.spinner{
  width:35px;
  height:35px;

  border:
    3px solid #1b405a;

  border-top-color:#1bd8ff;

  border-radius:50%;

  animation:
    spin .8s linear infinite;

  margin:auto auto 12px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

  body{
    overflow:auto;
  }

  .topbar{
    height:auto;

    min-height:55px;

    flex-wrap:wrap;

    gap:7px;

    padding:8px 10px;
  }

  .tagline{
    display:none;
  }

  .headerActions{
    width:100%;

    justify-content:flex-end;
  }

  .app{
    height:auto;

    display:flex;

    flex-direction:column;
  }

  .sidebar{
    width:100%;

    max-height:none;
  }

  .mapArea{
    height:650px;

    padding:5px;
  }
}

/* =====================================================
   EXTRA ANIMATION
===================================================== */

.btnBlue::before{
  content:"";
}

.section:hover{
  border-color:#1e4561;
}

/* =====================================================
   NO SELECT
===================================================== */

button,
input,
select,
textarea{
  font-family:inherit;
}
</style>
</head>

<body>

<!-- =====================================================
     TOP BAR
===================================================== -->

<header class="topbar">

  <div class="brand">

    <div class="logo">
      MY VISION <span>OOH</span>
    </div>

    <div class="tagline">
      Professional Outdoor Advertising Site Planner
    </div>

  </div>

  <div class="headerActions">

    <button
      class="btn btnDark"
      onclick="exportExcel()"
    >
      📊 Excel
    </button>

    <button
      class="btn btnBlue"
      onclick="exportPPT()"
    >
      📑 PPT
    </button>

    <button
      class="btn btnGreen"
      onclick="saveCurrentSite()"
    >
      ☁ Save
    </button>

  </div>

</header>


<!-- =====================================================
     APP
===================================================== -->

<div class="app">


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar">


<!-- PROJECT -->

<div class="section">

  <div class="sectionTitle">
    Project
  </div>

  <div class="projectTitle">

    <strong>
      OOH Site Planner
    </strong>

    <div class="projectIcon">
      🗺️
    </div>

  </div>

  <input
    id="campaignName"
    class="input"
    placeholder="Client / Campaign Name"
  >

  <div style="height:10px"></div>

  <div class="stats">

    <div class="stat">

      <div
        id="totalCount"
        class="statNum"
      >
        0
      </div>

      <div class="statLabel">
        Total
      </div>

    </div>


    <div class="stat">

      <div
        id="selectedCount"
        class="statNum"
      >
        0
      </div>

      <div class="statLabel">
        Selected
      </div>

    </div>


    <div class="stat">

      <div
        id="cloudCount"
        class="statNum"
      >
        0
      </div>

      <div class="statLabel">
        Cloud
      </div>

    </div>

  </div>

  <div style="height:10px"></div>

  <div class="cloudStatus">

    <span class="cloudDot"></span>

    Cloud synced

  </div>

</div>


<!-- =====================================================
     ADD SITE
===================================================== -->

<div class="section">

  <div class="sectionTitle">
    Add / Edit Site
  </div>

  <div class="formGrid">

    <input
      id="siteName"
      class="input formFull"
      placeholder="Site Name"
    >

    <input
      id="location"
      class="input formFull"
      placeholder="Location"
    >

    <input
      id="latitude"
      class="input"
      placeholder="Latitude"
    >

    <input
      id="longitude"
      class="input"
      placeholder="Longitude"
    >

    <input
      id="width"
      class="input"
      type="number"
      placeholder="Width (ft)"
    >

    <input
      id="height"
      class="input"
      type="number"
      placeholder="Height (ft)"
    >

    <input
      id="mediaType"
      class="input"
      placeholder="Media Type"
    >

    <select
      id="illumination"
      class="input"
    >

      <option value="">
        Illumination
      </option>

      <option value="F-LIT">
        F-LIT
      </option>

      <option value="Backlit">
        Backlit
      </option>

      <option value="Non-Lit">
        Non-Lit
      </option>

      <option value="LED">
        LED
      </option>

      <option value="Digital">
        Digital
      </option>

    </select>

    <input
      id="rate"
      class="input"
      type="number"
      placeholder="Rate ₹"
    >

    <select
      id="status"
      class="input"
    >

      <option value="Available">
        Available
      </option>

      <option value="Booked">
        Booked
      </option>

      <option value="Hold">
        Hold
      </option>

    </select>

    <input
      id="photo"
      class="input formFull"
      placeholder="Photo URL"
    >

    <textarea
      id="remarks"
      class="input formFull"
      rows="2"
      placeholder="Remarks"
    ></textarea>

  </div>

  <button
    class="btn btnBlue addButton"
    onclick="addSite()"
  >
    📍 Add Site
  </button>

</div>


<!-- =====================================================
     SELECTED SITES
===================================================== -->

<div class="section">

  <div class="selectedHeader">

    <h3>
      Selected Sites
    </h3>

    <button
      class="btn btnRed"
      style="padding:6px 9px;font-size:9px"
      onclick="clearSelected()"
    >
      CLEAR
    </button>

  </div>

  <div
    id="siteList"
    class="siteList"
  ></div>

</div>


<!-- =====================================================
     SEARCH
===================================================== -->

<div class="section">

  <div class="sectionTitle">
    Map Search
  </div>

  <input
    id="searchLocation"
    class="input"
    placeholder="Search location..."
  >

  <div style="height:7px"></div>

  <button
    class="btn btnBlue"
    style="width:100%"
    onclick="searchLocation()"
  >
    🔎 Search Location
  </button>

</div>


</aside>


<!-- =====================================================
     MAP
===================================================== -->

<main class="mapArea">

  <div class="mapFrame">

    <div class="mapTopCard">

      <div class="mapTopTitle">
        🗺️ OOH SITE MAP
      </div>

      <div class="mapTopSub">
        Click anywhere on map to place a site
      </div>

    </div>

    <div id="map"></div>

  </div>

</main>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div id="toast"></div>


<!-- =====================================================
     LOADING
===================================================== -->

<div id="loading">

  <div class="loadingBox">

    <div class="spinner"></div>

    <b>
      Loading cloud sites...
    </b>

  </div>

</div>


<!-- =====================================================
     LIBRARIES
===================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.min.js"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://fdrdswbrjuigzzmskpru.supabase.co";

/*
  IMPORTANT:

  Put your Supabase PUBLISHABLE / ANON key here.

  Example:

  const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIs...";

  NEVER put your service_role key here.
*/

const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   DATA
===================================================== */

let sites = [];

let selectedSites = [];

let markers = {};

let map;


/* =====================================================
   MAP
===================================================== */

map =
  L.map(
    "map",
    {
      zoomControl:true,
      preferCanvas:true
    }
  ).setView(
    [19.0760,72.8777],
    12
  );


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,

    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);


/* =====================================================
   MARKER
===================================================== */

function createMarker(site){

  const icon =
    L.divIcon({

      className:"",

      html:
        `<div class="ooh-marker"></div>`,

      iconSize:[36,36],

      iconAnchor:[18,36],

      popupAnchor:[0,-32]

    });


  const marker =
    L.marker(
      [
        Number(site.latitude),
        Number(site.longitude)
      ],
      {
        icon
      }
    ).addTo(map);


  marker.bindPopup(`

    <div style="min-width:220px">

      <div style="
        font-weight:900;
        font-size:15px;
        margin-bottom:4px;
      ">
        ${escapeHtml(
          site.site_name ||
          "OOH Site"
        )}
      </div>

      <div style="
        color:#64748b;
        font-size:11px;
      ">
        ${escapeHtml(
          site.location || ""
        )}
      </div>

      <hr>

      <div style="
        font-size:12px;
        line-height:1.7;
      ">

        📐
        ${site.width || 0}
        ×
        ${site.height || 0}
        ft

        <br>

        💡
        ${escapeHtml(
          site.illumination || "-"
        )}

        <br>

        📺
        ${escapeHtml(
          site.media_type || "-"
        )}

        <br>

        💰
        ₹${site.rate || 0}

        <br>

        📌
        ${escapeHtml(
          site.status || "-"
        )}

      </div>

      ${
        site.photo
        ?
        `
        <img
          src="${escapeAttr(site.photo)}"
          style="
            width:100%;
            height:125px;
            object-fit:cover;
            margin-top:8px;
            border-radius:8px;
          "
          onerror="
            this.style.display='none'
          "
        >
        `
        :
        ""
      }

    </div>

  `);


  markers[site.id] =
    marker;


  return marker;
}


/* =====================================================
   MAP CLICK
===================================================== */

map.on(

/* =====================================================
   ADD SITE
===================================================== */

async function addSite(){

  const site = {

    id:
      "site_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2,8),

    site_name:
      document
        .getElementById("siteName")
        .value
        .trim(),

    location:
      document
        .getElementById("location")
        .value
        .trim(),

    latitude:
      parseFloat(
        document
          .getElementById("latitude")
          .value
      ),

    longitude:
      parseFloat(
        document
          .getElementById("longitude")
          .value
      ),

    width:
      Number(
        document
          .getElementById("width")
          .value
      ) || 0,

    height:
      Number(
        document
          .getElementById("height")
          .value
      ) || 0,

    media_type:
      document
        .getElementById("mediaType")
        .value
        .trim(),

    illumination:
      document
        .getElementById("illumination")
        .value,

    rate:
      Number(
        document
          .getElementById("rate")
          .value
      ) || 0,

    status:
      document
        .getElementById("status")
        .value,

    photo:
      document
        .getElementById("photo")
        .value
        .trim(),

    remarks:
      document
        .getElementById("remarks")
        .value
        .trim()

  };


  if(!site.site_name){

    showToast(
      "⚠️ Enter site name"
    );

    return;
  }


  if(
    !Number.isFinite(site.latitude) ||
    !Number.isFinite(site.longitude)
  ){

    showToast(
      "⚠️ Select map coordinates"
    );

    return;
  }


  sites.push(site);

  selectedSites.push(site);

  createMarker(site);

  renderSites();

  updateStats();

  clearForm();

  showToast(
    "✅ Site added"
  );
}


/* =====================================================
   SAVE TO CLOUD
===================================================== */

async function saveCurrentSite(){

  if(!selectedSites.length){

    showToast(
      "⚠️ Add/select a site first"
    );

    return;
  }


  try{

    const {
      data:{
        user
      }
    } =
      await supabaseClient
        .auth
        .getUser();


    if(!user){

      showToast(
        "⚠️ Please login to Supabase"
      );

      return;
    }


    const rows =
      selectedSites.map(
        site => ({

          id:
            site.id,

          user_id:
            user.id,

          site_name:
            site.site_name,

          location:
            site.location,

          latitude:
            site.latitude,

          longitude:
            site.longitude,

          width:
            site.width,

          height:
            site.height,

          media_type:
            site.media_type,

          illumination:
            site.illumination,

          rate:
            site.rate,

          status:
            site.status,

          photo:
            site.photo,

          remarks:
            site.remarks,

          updated:
            new Date()
              .toISOString()

        })
      );


    const {
      error
    } =
      await supabaseClient
        .from("ooh_sites")
        .upsert(
          rows,
          {
            onConflict:
              "user_id,id"
          }
        );


    if(error)
      throw error;


    showToast(
      `☁️ ${rows.length} site(s) saved`
    );

  }
  catch(error){

    console.error(error);

    showToast(
      "❌ Cloud save failed"
    );
  }
}


/* =====================================================
   LOAD CLOUD SITES
===================================================== */

async function loadSavedSites(){

  try{

    const {
      data:{
        user
      }
    } =
      await supabaseClient
        .auth
        .getUser();


    if(!user){

      updateStats();

      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("ooh_sites")
        .select("*")
        .eq(
          "user_id",
          user.id
        )
        .order(
          "updated",
          {
            ascending:false
          }
        );


    if(error)
      throw error;


    sites =
      data || [];


    selectedSites = [];


    Object
      .values(markers)
      .forEach(
        marker => {

          try{
            map.removeLayer(marker);
          }
          catch(e){}

        }
      );


    markers = {};


    sites.forEach(
      site => {

        if(
          Number.isFinite(
            Number(site.latitude)
          ) &&
          Number.isFinite(
            Number(site.longitude)
          )
        ){

          createMarker(site);

        }

      }
    );


    renderSites();

    updateStats();


    if(sites.length){

      showToast(
        `☁️ ${sites.length} saved sites loaded`
      );

    }

  }
  catch(error){

    console.error(
      "LOAD ERROR:",
      error
    );

    showToast(
      "❌ Could not load cloud sites"
    );

  }
}


/* =====================================================
   RENDER
===================================================== */

function renderSites(){

  const list =
    document.getElementById(
      "siteList"
    );


  list.innerHTML = "";


  selectedSites.forEach(
    site => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "siteCard";


      card.innerHTML = `

        <img
          class="siteThumb"
          src="${
            site.photo ||
            "https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=300"
          }"
          onerror="
            this.src='https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=300'
          "
        >

        <div class="siteInfo">

          <div class="siteName">

            ${escapeHtml(
              site.site_name ||
              "OOH Site"
            )}

          </div>

          <div class="siteLocation">

            ${escapeHtml(
              site.location ||
              "Location not available"
            )}

          </div>

          <div class="siteMeta">

            <span class="badge">

              ${
                site.width || 0
              }
              ×
              ${
                site.height || 0
              }
              ft

            </span>

            <span class="badge">

              ${escapeHtml(
                site.illumination ||
                "-"
              )}

            </span>

          </div>

        </div>

        <button
          class="removeBtn"
          onclick="
            event.stopPropagation();
            removeSelected(
              '${escapeAttr(site.id)}'
            )
          "
        >
          ×
        </button>

      `;


      card.onclick =
        () => {

          const lat =
            Number(site.latitude);

          const lng =
            Number(site.longitude);


          if(
            Number.isFinite(lat) &&
            Number.isFinite(lng)
          ){

            map.setView(
              [lat,lng],
              16,
              {
                animate:true
              }
            );


            if(
              markers[site.id]
            ){

              setTimeout(
                () => {

                  markers[
                    site.id
                  ].openPopup();

                },
                400
              );

            }

          }

        };


      list.appendChild(card);

    }
  );


  updateStats();
}


/* =====================================================
   REMOVE
===================================================== */

function removeSelected(id){

  selectedSites =
    selectedSites.filter(
      site =>
        site.id !== id
    );


  renderSites();


  showToast(
    "Site removed from selection"
  );
}


/* =====================================================
   CLEAR
===================================================== */

function clearSelected(){

  selectedSites = [];

  renderSites();

  showToast(
    "Selection cleared"
  );
}


/* =====================================================
   SEARCH LOCATION
===================================================== */

async function searchLocation(){

  const query =
    document
      .getElementById(
        "searchLocation"
      )
      .value
      .trim();


  if(!query){

    showToast(
      "Enter a location"
    );

    return;
  }


  try{

    const response =
      await fetch(
        "https://nominatim.openstreetmap.org/search?" +
        new URLSearchParams({

          q:query,

          format:"json",

          limit:1

        })
      );


    const results =
      await response.json();


    if(!results.length){

      showToast(
        "Location not found"
      );

      return;
    }


    const result =
      results[0];


    const lat =
      Number(result.lat);

    const lon =
      Number(result.lon);


    map.setView(
      [lat,lon],
      15,
      {
        animate:true
      }
    );


    document
      .getElementById(
        "latitude"
      )
      .value =
      lat.toFixed(6);


    document
      .getElementById(
        "longitude"
      )
      .value =
      lon.toFixed(6);


    document
      .getElementById(
        "location"
      )
      .value =
      result.display_name;


    showToast(
      "📍 Location found"
    );

  }
  catch(error){

    console.error(error);

    showToast(
      "❌ Search failed"
    );

  }
}


/* =====================================================
   EXCEL
===================================================== */

function exportExcel(){

  if(!selectedSites.length){

    showToast(
      "Select sites first"
    );

    return;
  }


  if(
    typeof XLSX ===
    "undefined"
  ){

    showToast(
      "Excel library not loaded"
    );

    return;
  }


  const rows =
    selectedSites.map(
      (s,index) => ({

        "Sr No":
          index + 1,

        "Site Name":
          s.site_name || "",

        "Location":
          s.location || "",

        "Latitude":
          s.latitude || "",

        "Longitude":
          s.longitude || "",

        "Width (ft)":
          s.width || 0,

        "Height (ft)":
          s.height || 0,

        "Media Type":
          s.media_type || "",

        "Illumination":
          s.illumination || "",

        "Rate":
          s.rate || 0,

        "Status":
          s.status || "",

        "Remarks":
          s.remarks || ""

      })
    );


  const workbook =
    XLSX.utils.book_new();


  const worksheet =
    XLSX.utils.json_to_sheet(
      rows
    );


  XLSX.utils.book_append_sheet(
    workbook,
    worksheet,
    "OOH Sites"
  );


  XLSX.writeFile(
    workbook,
    "My_Vision_OOH_Sites.xlsx"
  );


  showToast(
    "📊 Excel exported"
  );
}

    "latitude",
    "longitude",
    "width",
    "height",

    "rate",

/* =====================================================
   STATS
===================================================== */

function updateStats(){

  document
    .getElementById(
      "totalCount"
    )
    .textContent =
    sites.length;


  document
    .getElementById(
      "selectedCount"
    )
    .textContent =
    selectedSites.length;


  document
    .getElementById(
      "cloudCount"
    )
    .textContent =

/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      3000
    );
}


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );
}


function escapeAttr(value){

  return escapeHtml(value);
}


/* =====================================================
   KEYBOARD SHORTCUT
===================================================== */

document.addEventListener(
  "keydown",
  function(e){

    /*
      Ctrl + S
      saves selected sites
    */

    if(
      e.ctrlKey &&
      e.key.toLowerCase() === "s"
    ){

      e.preventDefault();

      saveCurrentSite();

    }

  }
);


/* =====================================================
   START
===================================================== */

updateStats();


window.addEventListener(
  "load",
  function(){

    setTimeout(
      loadSavedSites,
      700
    );

  }
);


/* =====================================================
   AUTH LISTENER
===================================================== */

supabaseClient
  .auth

    }

</script>
