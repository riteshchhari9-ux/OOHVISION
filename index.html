<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
"https://fdrdswbrjuigzzmskpru.supabase.co";

/*
 IMPORTANT:
 Use your Supabase PUBLISHABLE/ANON key here.
 This is the publishable key you provided.
*/

const SUPABASE_KEY =
"sb_publishable_H_iVOgmPDIf-cSXUcdAWow_mT3SXLZr";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   OLD DATABASE
   Used to recover your existing 54 sites
   ========================================================= */

const OLD_DB_NAME =
"MY_VISION_OOH_DATABASE";

const OLD_DB_VERSION = 1;

const OLD_STORE_NAME = "sites";


/* =========================================================
   GLOBALS
   ========================================================= */

let sites = [];

let selectedSites = new Set();

let map;

let markers = [];

let searchMarker = null;

let currentPhoto = "";

let realtimeChannel = null;


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text){

    const box =
        document.getElementById("message");

    box.innerText = text;

    box.style.display = "block";

    clearTimeout(window.messageTimer);

    window.messageTimer =
        setTimeout(function(){

            box.style.display = "none";

        },2800);
}


/* =========================================================
   SYNC STATUS
   ========================================================= */

function setSyncStatus(type,text){

    const el =
        document.getElementById("syncStatus");

    el.className =
        "sync-status sync-"+type;

    el.innerText = text;
}


/* =========================================================
   OLD INDEXEDDB
   ========================================================= */

function openOldDatabase(){

    return new Promise(function(resolve,reject){

        const request =
            indexedDB.open(
                OLD_DB_NAME,
                OLD_DB_VERSION
            );

        request.onsuccess =
            function(event){

                resolve(
                    event.target.result
                );

            };

        request.onerror =
            function(){

                reject(
                    request.error
                );

            };

    });

}


function getOldSites(){

    return new Promise(async function(resolve){

        try{

            const oldDB =
                await openOldDatabase();

            if(
                !oldDB.objectStoreNames.contains(
                    OLD_STORE_NAME
                )
            ){

                resolve([]);

                return;

            }

            const tx =
                oldDB.transaction(
                    OLD_STORE_NAME,
                    "readonly"
                );

            const store =
                tx.objectStore(
                    OLD_STORE_NAME
                );

            const request =
                store.getAll();

            request.onsuccess =
                function(){

                    resolve(
                        request.result || []
                    );

                };

            request.onerror =
                function(){

                    resolve([]);

                };

        }
        catch(error){

            resolve([]);

        }

    });

}


/* =========================================================
   CONVERT OLD SITE TO CLOUD FORMAT
   ========================================================= */

function normalizeSite(site){

    return {

        id:
            site.id ||
            crypto.randomUUID(),

        site_name:
            site.site_name ||
            site.siteName ||
            "",

        location:
            site.location ||
            "",

        latitude:
            Number(site.latitude) || 0,

        longitude:
            Number(site.longitude) || 0,

        width:
            Number(site.width) || 0,

        height:
            Number(site.height) || 0,

        media_type:
            site.media_type ||
            site.mediaType ||
            "Billboard",

        illumination:
            site.illumination ||
            "Lit",

        rate:
            Number(site.rate) || 0,

        status:
            site.status ||
            "Available",

        photo:
            site.photo ||
            "",

        remarks:
            site.remarks ||
            "",

        updated_at:
            site.updated_at ||
            site.updated ||
            new Date().toISOString()

    };

}


/* =========================================================
   LOAD CLOUD SITES
   ========================================================= */

async function loadCloudSites(){

    setSyncStatus(
        "loading",
        "☁ Syncing..."
    );

    const {data,error} =
        await supabaseClient
        .from("sites")
        .select("*")
        .order(
            "updated_at",
            {ascending:false}
        );

    if(error){

        console.error(
            "Supabase load error:",
            error
        );

        setSyncStatus(
            "offline",
            "☁ Cloud error"
        );

        showMessage(
            "Supabase table not available"
        );

        return false;

    }

    sites =
        (data || []).map(function(site){

            return {

                id:site.id,

                siteName:
                    site.site_name || "",

                location:
                    site.location || "",

                latitude:
                    Number(site.latitude) || 0,

                longitude:
                    Number(site.longitude) || 0,

                width:
                    Number(site.width) || 0,

                height:
                    Number(site.height) || 0,

                mediaType:
                    site.media_type || "Billboard",

                illumination:
                    site.illumination || "Lit",

                rate:
                    Number(site.rate) || 0,

                status:
                    site.status || "Available",

                photo:
                    site.photo || "",

                remarks:
                    site.remarks || "",

                updated:
                    site.updated_at || ""

            };

        });

    setSyncStatus(
        "online",
        "☁ Cloud synced"
    );

    renderSites();
    renderMarkers();

    return true;
}


/* =========================================================
   SAVE TO SUPABASE
   ========================================================= */

async function saveCloudSite(site){

    const cloud =
        normalizeSite(site);

    const {error} =
        await supabaseClient
        .from("sites")
        .upsert(
            cloud,
            {
                onConflict:"id"
            }
        );

    if(error){

        console.error(
            "Supabase save error:",
            error
        );

        throw error;

    }

}


/* =========================================================
   DELETE FROM SUPABASE
   ========================================================= */

async function deleteCloudSite(id){

    const {error} =
        await supabaseClient
        .from("sites")
        .delete()
        .eq("id",id);

    if(error){

        console.error(
            "Supabase delete error:",
            error
        );

        throw error;

    }

}


/* =========================================================
   MIGRATE YOUR OLD 54 SITES
   ========================================================= */

async function migrateOldSites(){

    const oldSites =
        await getOldSites();

    if(!oldSites.length){

        return;

    }

    showMessage(
        "Found "+oldSites.length+
        " old saved sites. Syncing..."
    );

    let count = 0;

    for(
        const oldSite of oldSites
    ){

        try{

            await saveCloudSite(
                oldSite
            );

            count++;

        }
        catch(error){

            console.error(
                "Migration failed:",
                oldSite,
                error
            );

        }

    }

    if(count){

        showMessage(
            count+
            " existing sites synced to cloud"
        );

    }

}


/* =========================================================
   REALTIME SYNC
   ========================================================= */

function startRealtime(){

    if(realtimeChannel){

        supabaseClient
        .removeChannel(
            realtimeChannel
        );

    }

    realtimeChannel =
        supabaseClient
        .channel(
            "my-vision-ooh-sites"
        )
        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"sites"
            },
            function(){

                loadCloudSites();

            }
        )
        .subscribe(
            function(status){

                console.log(
                    "Realtime:",
                    status
                );

            }
        );

}


/* =========================================================
   PERIODIC CLOUD SYNC
   Backup for realtime
   ========================================================= */

setInterval(
    async function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            await loadCloudSites();

        }

    },
    15000
);


/* =========================================================
   MAP
   ========================================================= */

function initializeMap(){

    map =
        L.map("map")
        .setView(
            [19.0760,72.8777],
            11
        );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
                "© OpenStreetMap contributors"
        }
    ).addTo(map);

    map.on(
        "click",
        function(event){

            const lat =
                event.latlng.lat;

            const lng =
                event.latlng.lng;

            document.getElementById(
                "latitude"
            ).value =
                lat.toFixed(6);

            document.getElementById(
                "longitude"
            ).value =
                lng.toFixed(6);

            document.getElementById(
                "searchLat"
            ).value =
                lat.toFixed(6);

            document.getElementById(
                "searchLng"
            ).value =
                lng.toFixed(6);

            placeSearchMarker(
                lat,
                lng,
                "Selected Location"
            );

            showMessage(
                "Location selected"
            );

        }
    );

}


/* =========================================================
   LOCATION SEARCH
   ========================================================= */

async function searchLocation(){

    const query =
        document.getElementById(
            "locationSearch"
        ).value.trim();

    if(!query){

        showMessage(
            "Enter a location name"
        );

        return;

    }

    showMessage("Searching...");

    try{

        const url =
            "https://nominatim.openstreetmap.org/search"+
            "?format=json"+
            "&limit=1"+
            "&q="+
            encodeURIComponent(query);

        const response =
            await fetch(url);

        const data =
            await response.json();

        if(!data.length){

            showMessage(
                "Location not found"
            );

            return;

        }

        const result =
            data[0];

        showLocation(
            parseFloat(result.lat),
            parseFloat(result.lon),
            result.display_name
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            "Location search failed"
        );

    }

}


/* =========================================================
   COORDINATES
   ========================================================= */

function searchCoordinates(){

    const lat =
        parseFloat(
            document.getElementById(
                "searchLat"
            ).value
        );

    const lng =
        parseFloat(
            document.getElementById(
                "searchLng"
            ).value
        );

    if(
        isNaN(lat) ||
        isNaN(lng)
    ){

        showMessage(
            "Enter valid coordinates"
        );

        return;

    }

    showLocation(
        lat,
        lng,
        "Selected Coordinates"
    );

}


/* =========================================================
   SHOW LOCATION
   ========================================================= */

function showLocation(
    lat,
    lng,
    name
){

    map.setView(
        [lat,lng],
        17
    );

    placeSearchMarker(
        lat,
        lng,
        name
    );

    document.getElementById(
        "latitude"
    ).value =
        lat.toFixed(6);

    document.getElementById(
        "longitude"
    ).value =
        lng.toFixed(6);

    document.getElementById(
        "searchLat"
    ).value =
        lat.toFixed(6);

    document.getElementById(
        "searchLng"
    ).value =
        lng.toFixed(6);

    if(
        name !== "Selected Coordinates"
    ){

        document.getElementById(
            "siteLocation"
        ).value =
            name;

    }

    const box =
        document.getElementById(
            "locationResult"
        );

    box.style.display =
        "block";

    box.innerHTML =
        "<b>📍 Location Found</b><br>"+
        escapeHTML(name)+
        "<br><br>"+
        "<b>Lat:</b> "+
        lat.toFixed(6)+
        "<br>"+
        "<b>Long:</b> "+
        lng.toFixed(6);

    showMessage(
        "Location highlighted"
    );

}


/* =========================================================
   SEARCH MARKER
   ========================================================= */

function placeSearchMarker(
    lat,
    lng,
    name
){

    if(searchMarker){

        searchMarker.remove();

    }

    searchMarker =
        L.marker(
            [lat,lng]
        )
        .addTo(map)
        .bindPopup(
            "<b>📍 "+
            escapeHTML(name)+
            "</b><br><br>"+
            lat.toFixed(6)+
            ", "+
            lng.toFixed(6)
        )
        .openPopup();

}


/* =========================================================
   MY LOCATION
   ========================================================= */

function useMyLocation(){

    if(!navigator.geolocation){

        showMessage(
            "Geolocation not supported"
        );

        return;

    }

    navigator.geolocation.getCurrentPosition(

        function(position){

/* =========================================================
   PHOTO RESIZE
   ========================================================= */

function resizePhoto(file){

    return new Promise(function(resolve,reject){

        const reader =
            new FileReader();

        reader.onload =
            function(event){

                const img =
                    new Image();

                img.onload =
                    function(){

                        const canvas =
                            document.createElement(
                                "canvas"
                            );

                        const max = 1200;

                        let width =
                            img.width;

                        let height =
                            img.height;

                        if(width > max){

                            height =
                                height *
                                max /
                                width;

                            width = max;

                        }

                        if(height > max){

                            width =
                                width *
                                max /
                                height;

                            height = max;

                        }

                        canvas.width =
                            width;

                        canvas.height =
                            height;

                        const ctx =
                            canvas.getContext(
                                "2d"
                            );

                        ctx.drawImage(
                            img,
                            0,
                            0,
                            width,
                            height
                        );

                        resolve(
                            canvas.toDataURL(
                                "image/jpeg",
                                .70
                            )
                        );

                    };

                img.onerror = reject;

                img.src =
                    event.target.result;

            };

        reader.onerror = reject;

        reader.readAsDataURL(file);

    });

}


/* =========================================================
   PHOTO PREVIEW
   ========================================================= */

function previewPhoto(event){

    const file =
        event.target.files[0];

    if(!file){

        return;

    }

    const reader =
        new FileReader();

    reader.onload =
        function(e){

            const img =
                document.getElementById(
                    "photoPreview"
                );

            img.src =
                e.target.result;

            img.style.display =
                "block";

            currentPhoto =
                e.target.result;

        };

    reader.readAsDataURL(file);

}


/* =========================================================
   SAVE SITE
   ========================================================= */

async function saveSite(){

    const name =
        document.getElementById(
            "siteName"
        ).value.trim();

    const location =
        document.getElementById(
            "siteLocation"
        ).value.trim();

    const lat =
        parseFloat(
            document.getElementById(
                "latitude"
            ).value
        );

    const lng =
        parseFloat(
            document.getElementById(
                "longitude"
            ).value
        );

    if(!name){

        showMessage(
            "Enter Site Name / ID"
        );

        return;

    }

    if(
        isNaN(lat) ||
        isNaN(lng)
    ){

        showMessage(
            "Select/search a location first"
        );

        return;

    }

    let photo =
        currentPhoto;

    const photoFile =
        document.getElementById(
            "photo"
        ).files[0];

    if(photoFile){

        try{

            photo =
                await resizePhoto(
                    photoFile
                );

        }
        catch(error){

            showMessage(
                "Photo processing failed"
            );

            return;

        }

    }

    const editId =
        document.getElementById(
            "editId"
        ).value;

    const site = {

        id:
            editId ||
            crypto.randomUUID(),

        siteName:name,

        location:location,

        latitude:lat,

        longitude:lng,

        width:
            Number(
                document.getElementById(
                    "width"
                ).value
            ) || 0,

        height:
            Number(
                document.getElementById(
                    "height"
                ).value
            ) || 0,

        mediaType:
            document.getElementById(
                "mediaType"
            ).value,

        illumination:
            document.getElementById(
                "illumination"
            ).value,

        rate:
            Number(
                document.getElementById(
                    "rate"
                ).value
            ) || 0,

        status:
            document.getElementById(
                "status"
            ).value,

        photo:
            photo || "",

        remarks:
            document.getElementById(
                "remarks"
            ).value,

        updated:
            new Date().toISOString()

    };

    setSyncStatus(
        "loading",
        "☁ Saving..."
    );

    try{

        await saveCloudSite(site);

        const index =
            sites.findIndex(
                function(item){

                    return item.id === site.id;

                }
            );

        if(index >= 0){

            sites[index] =
                site;

        }
        else{

            sites.unshift(site);

            selectedSites.add(
                site.id
            );

        }

        setSyncStatus(
            "online",
            "☁ Saved"
        );

        renderSites();
        renderMarkers();

        clearForm();

        showMessage(
            editId ?
            "Site updated in cloud" :
            "Site saved to cloud"
        );

    }
    catch(error){

        setSyncStatus(
            "offline",
            "☁ Save failed"
        );

        alert(
            "Could not save to Supabase.\n\n"+
            error.message
        );

    }

}


/* =========================================================
   MAP MARKERS
   ========================================================= */

function renderMarkers(){

    markers.forEach(
        function(marker){

            marker.remove();

        }
    );

    markers = [];

    sites.forEach(
        function(site){

            if(
                isNaN(site.latitude) ||
                isNaN(site.longitude)
            ){

                return;

            }

            const marker =
                L.marker(
                    [
                        Number(site.latitude),
                        Number(site.longitude)
                    ]
                )
                .addTo(map);

            let popup =

                "<b>"+
                escapeHTML(
                    site.siteName
                )+
                "</b><br>"+

                escapeHTML(
                    site.location || ""
                )+

                "<br><br>"+

                "Size: "+
                site.width+
                " × "+
                site.height+
                " ft<br>"+

                "Media: "+
                escapeHTML(
                    site.mediaType
                )+
                "<br>"+

                "Rate: ₹"+
                Number(
                    site.rate || 0
                ).toLocaleString(
                    "en-IN"
                )+
                "<br>"+

                "Status: "+
                escapeHTML(
                    site.status
                );

            if(site.photo){

                popup +=
                    "<br><br>"+
                    "<img src='"+
                    site.photo+
                    "' style='width:180px;height:120px;object-fit:cover;border-radius:6px'>";

            }

            marker.bindPopup(
                popup
            );

            marker.on(
                "click",
                function(){

                    selectedSites.add(
                        site.id
                    );

                    renderSites();

                }
            );

            markers.push(marker);

        }
    );

}

                    String(

                    String(
                        site.location || ""
                    )+
                    " "+
                    String(
                        site.latitude || ""
                    )+
                    " "+
                    String(
                        site.longitude || ""
                    )+
                    " "+
                    String(
                        site.mediaType || ""
                    )+
                    " "+
                    String(
                        site.status || ""
                    )+
                    " "+
                    String(
                        site.width || ""
                    )+
                    " "+
                    String(
                        site.height || ""
                    )+
                    " "+
                    String(

                "<div class='site-info'>"+

                "📍 "+

/* =========================================================

   ========================================================= */

function viewSite(id){

    const site =
        sites.find(
            function(item){

                return item.id === id;

            }
        );

    if(!site){

        return;

    }

    map.setView(
        [
            Number(site.latitude),
            Number(site.longitude)
        ],
        17
    );

    placeSearchMarker(
        Number(site.latitude),
        Number(site.longitude),
        site.siteName
    );

    selectedSites.add(
        site.id
    );

    renderSites();

}

/* =========================================================
   DELETE
   ========================================================= */

async function deleteSite(id){

    const site =
        sites.find(
            function(item){

                return item.id === id;

            }
        );

    if(!site){

        return;

    }

    if(
        !confirm(
            "Delete "+site.siteName+
            " permanently from cloud?"
        )
    ){

        return;

    }

    setSyncStatus(
        "loading",
        "☁ Deleting..."
    );

    try{

        await deleteCloudSite(id);

        sites =
            sites.filter(
                function(item){

                    return item.id !== id;

                }
            );

        selectedSites.delete(id);

        renderSites();
        renderMarkers();

        setSyncStatus(
            "online",
            "☁ Cloud synced"
        );

        showMessage(
            "Site deleted from cloud"
        );

    }
    catch(error){

        console.error(error);

        setSyncStatus(
            "offline",
            "☁ Delete failed"
        );

        alert(
            "Delete failed:\n"+
            error.message
        );

    }

}

function escapeHTML(text){

    return String(
        text || ""
    )
    .replace(
        /[&<>"']/g,
        function(character){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[character];

        }
    );

}


/* =========================================================
   START APPLICATION
   ========================================================= */

async function startApp(){

    initializeMap();

    /*
      FIRST:
      Try to load cloud sites.
    */

    const cloudLoaded =
        await loadCloudSites();

    /*
      SECOND:
      If the old database contains your
      54 sites, migrate them.
    */

    if(cloudLoaded){

        const oldSites =
            await getOldSites();

        if(
            oldSites.length &&
            sites.length === 0
        ){

            await migrateOldSites();

            await loadCloudSites();

        }
        else if(
            oldSites.length &&
            sites.length < oldSites.length
        ){

            /*
              This protects against a partial
              previous migration.
            */

            await migrateOldSites();

            await loadCloudSites();

        }

    }

    /*
      THIRD:
      Start realtime sync.
    */

    startRealtime();

    renderSites();

    renderMarkers();

    if(sites.length){

        showMessage(
            sites.length+
            " cloud site(s) loaded"
        );

    }

}


/* =========================================================
   START

startApp();
