<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f5f8;
  color:#172033;
}

header{

}

.logo{

.logo span{

}

.header-actions{

}

button{

}

button:hover{

}

.btn-blue{

}

.btn-green{

.btn-red{

.full{

}

label{

input,

  border-radius:8px;

  .main{
    display:block;

  }

  }

</style>

<script>

/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let sites = [];

let selectedSites = new Set();

let map = null;

let markers = [];

let searchMarker = null;


/* =========================================================
   STORAGE
   ========================================================= */

const DB_NAME =
  "MY_VISION_OOH_DATABASE";

const DB_VERSION = 1;

const STORE_NAME =
  "sites";

const STORAGE_KEY =
  "my_vision_ooh_sites";

const CAMPAIGN_KEY =
  "my_vision_ooh_campaign";


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text){

  const box =
    document.getElementById("message");

  box.innerText =
    text;

  box.style.display =
    "block";

  clearTimeout(
    window.messageTimer
  );

  window.messageTimer =
    setTimeout(function(){

      box.style.display =
        "none";

    },3000);

}


/* =========================================================
   MONEY
   ========================================================= */

function money(value){

  return (
    "₹" +
    Number(value || 0)
      .toLocaleString("en-IN")
  );

}


/* =========================================================
   INDEXED DB
   ========================================================= */

function openOOHDatabase(){

  return new Promise(
    function(resolve,reject){

      if(!window.indexedDB){

        reject(
          new Error(
            "IndexedDB is not supported."
          )
        );

        return;

      }


      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event){

          const db =
            event.target.result;


          if(
            !db.objectStoreNames.contains(
              STORE_NAME
            )
          ){

            db.createObjectStore(
              STORE_NAME,
              {
                keyPath:"id"
              }
            );

          }

        };


      request.onsuccess =
        function(){

          resolve(
            request.result
          );

        };


      request.onerror =
        function(){

          reject(
            request.error
          );

        };

    }
  );

}


/* =========================================================
   SAVE DATABASE
   ========================================================= */

async function saveLocalData(){

  try{

    const db =
      await openOOHDatabase();


    await new Promise(
      function(resolve,reject){

        const transaction =
          db.transaction(
            STORE_NAME,
            "readwrite"
          );


        const store =
          transaction.objectStore(
            STORE_NAME
          );


        store.clear();


        sites.forEach(
          function(site){

            store.put(site);

          }
        );


        transaction.oncomplete =
          function(){

            resolve();

          };


        transaction.onerror =
          function(){

            reject(
              transaction.error
            );

          };


        transaction.onabort =
          function(){

            reject(
              transaction.error ||
              new Error(
                "Transaction aborted."
              )
            );

          };

      }
    );


    db.close();


    localStorage.setItem(
      CAMPAIGN_KEY,
      document.getElementById(
        "campaign"
      ).value.trim()
    );


    return true;

  }
  catch(error){

    console.error(
      "IndexedDB save error:",
      error
    );


    showMessage(
      "Could not save site. Browser storage may be unavailable."
    );


    return false;

  }

}


/* =========================================================
   LOAD DATABASE
   ========================================================= */

async function loadLocalData(){

  try{

    const db =
      await openOOHDatabase();


    const storedSites =
      await new Promise(
        function(resolve,reject){

          const transaction =
            db.transaction(
              STORE_NAME,
              "readonly"
            );


          const store =
            transaction.objectStore(
              STORE_NAME
            );


          const request =
            store.getAll();


          request.onsuccess =
            function(){

              resolve(
                request.result || []
              );

            };


          request.onerror =
            function(){

              reject(
                request.error
              );

            };

        }
      );


    db.close();


    if(
      Array.isArray(storedSites) &&
      storedSites.length > 0
    ){

      sites =
        storedSites;

    }
    else{

      /*
        MIGRATE OLD LOCAL STORAGE
      */

      try{

        const oldData =
          localStorage.getItem(
            STORAGE_KEY
          );


        if(oldData){

          const oldSites =
            JSON.parse(
              oldData
            );


          if(
            Array.isArray(oldSites) &&
            oldSites.length > 0
          ){

            sites =
              oldSites;


            const migrated =
              await saveLocalData();


            if(migrated){

              localStorage.removeItem(
                STORAGE_KEY
              );

            }

          }
          else{

            sites = [];

          }

        }
        else{

          sites = [];

        }

      }
      catch(error){

        console.error(
          "Migration failed:",
          error
        );

        sites = [];

      }

    }


    const campaign =
      localStorage.getItem(
        CAMPAIGN_KEY
      );


    if(campaign){

      document.getElementById(
        "campaign"
      ).value =
        campaign;

    }


    selectedSites.clear();


    renderSites();

    renderMarkers();

  }
  catch(error){

    console.error(
      "IndexedDB load error:",
      error
    );


    /*
      FALLBACK
    */

    try{

      const oldData =
        localStorage.getItem(
          STORAGE_KEY
        );


      sites =
        oldData
          ? JSON.parse(oldData)
          : [];


      if(!Array.isArray(sites)){

        sites = [];

      }

    }
    catch(fallbackError){

      console.error(
        fallbackError
      );

      sites = [];

    }


    renderSites();

    renderMarkers();

  }

}


/* =========================================================
   CLEAR DATABASE
   ========================================================= */

async function clearOOHDatabase(){

  try{

    const db =
      await openOOHDatabase();


    await new Promise(
      function(resolve,reject){

        const transaction =
          db.transaction(
            STORE_NAME,
            "readwrite"
          );


        const store =
          transaction.objectStore(
            STORE_NAME
          );


        const request =
          store.clear();


        request.onsuccess =
          function(){

            resolve();

          };


        request.onerror =
          function(){

            reject(
              request.error
            );

          };

      }
    );


    db.close();


    localStorage.removeItem(
      STORAGE_KEY
    );

    showMessage(
      "All sites deleted."
    );

  }
  catch(error){

    console.error(error);

    showMessage(
      "Could not clear storage."
    );

  }

}


/* =========================================================
   CAMPAIGN
   ========================================================= */

document
  .getElementById("campaign")
  .addEventListener(
    "input",
    function(){

      try{

        localStorage.setItem(
          CAMPAIGN_KEY,
          this.value
        );

      }
      catch(error){

        console.error(error);

      }

    }
  );


/* =========================================================
   CALCULATIONS
   ========================================================= */

function calculateValues(){

  const width =
    Number(
      document.getElementById(
        "width"
      ).value
    ) || 0;


  const height =
    Number(
      document.getElementById(
        "height"
      ).value
    ) || 0;


  const units =
    Number(
      document.getElementById(
        "units"
      ).value
    ) || 0;


  const rate =
    Number(
      document.getElementById(
        "rate"
      ).value
    ) || 0;


  const duration =
    Number(
      document.getElementById(
        "duration"
      ).value
    ) || 0;


  let pmRate =
    Number(
      document.getElementById(
        "pmRate"
      ).value
    ) || 0;


  const illumination =
    document.getElementById(
      "illumination"
    ).value;


  if(
    illumination === "DOOH"
  ){

    pmRate = 0;

    document.getElementById(
      "pmRate"
    ).value = 0;

  }


  const area =
    width *
    height *
    units;


  const displayCharges =
    rate *
    duration /
    30;


  const pmCharges =
    area *
    pmRate;


  const totalCost =
    displayCharges +
    pmCharges;


  document.getElementById(
    "areaPreview"
  ).innerText =
    area.toLocaleString(
      "en-IN"
    ) +
    " sq.ft";


  document.getElementById(
    "displayPreview"
  ).innerText =
    money(
      displayCharges
    );


  document.getElementById(
    "pmPreview"
  ).innerText =
    money(
      pmCharges
    );


  document.getElementById(
    "totalPreview"
  ).innerText =
    money(
      totalCost
    );

}


/* =========================================================
   MAP
   ========================================================= */

function initializeMap(){

  if(map){

    setTimeout(
      function(){

        map.invalidateSize();

      },
      300
    );

    return;

  }


  map =
    L.map(
      "map"
    ).setView(
      [
        19.0760,
        72.8777
      ],
      11
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,

      attribution:
        "© OpenStreetMap contributors"
    }
  ).addTo(map);


  map.on(
    "click",
    function(event){

      const lat =
        event.latlng.lat;

      const lng =
        event.latlng.lng;


      document.getElementById(
        "latitude"
      ).value =
        lat.toFixed(6);


      document.getElementById(
        "longitude"
      ).value =
        lng.toFixed(6);


      document.getElementById(
        "searchLat"
      ).value =
        lat.toFixed(6);


      document.getElementById(
        "searchLng"
      ).value =
        lng.toFixed(6);


      placeSearchMarker(
        lat,
        lng,
        "Selected Location"
      );

    }
  );

}


/* =========================================================
   SEARCH LOCATION
   ========================================================= */

async function searchLocation(){

  const query =
    document.getElementById(
      "locationSearch"
    ).value.trim();


  if(!query){

    showMessage(
      "Enter a location."
    );

    return;

  }


  showMessage(
    "Searching location..."
  );


  try{

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json&limit=1&q=" +
      encodeURIComponent(
        query
      );


    const response =
      await fetch(
        url,
        {
          headers:{
            "Accept":
              "application/json"
          }
        }
      );


    if(!response.ok){

      throw new Error(
        "Location service unavailable."
      );

    }


    const data =
      await response.json();


    if(!data.length){

      showMessage(
        "Location not found."
      );

      return;

    }


    const result =
      data[0];


    showLocation(
      parseFloat(
        result.lat
      ),
      parseFloat(
        result.lon
      ),
      result.display_name
    );

  }
  catch(error){

    console.error(error);

    showMessage(
      "Location search failed."
    );

  }

}

   ========================================================= */

function useMyLocation(){

  if(
    !navigator.geolocation
  ){

    showMessage(
      "Geolocation is not supported."
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      showLocation(
        position.coords.latitude,
        position.coords.longitude,
        "My Current Location"
      );

    },

    function(error){

      console.error(error);

      showMessage(
        "Please allow location permission."
      );

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }

  );

}


/* =========================================================
   RESIZE IMAGE
   ========================================================= */

function resizeImage(
  file,
  maxSize,
  quality
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(event){

          const image =
            new Image();


          image.onload =
            function(){

              let width =
                image.width;

              let height =
                image.height;


              if(
                width > maxSize ||
                height > maxSize
              ){

                if(
                  width > height
                ){

                  height =
                    Math.round(
                      height *
                      maxSize /
                      width
                    );

                  width =
                    maxSize;

                }
                else{

                  width =
                    Math.round(
                      width *
                      maxSize /
                      height
                    );

                  height =
                    maxSize;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                image,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                )
              );

            };


          image.onerror =
            function(){

              reject(
                new Error(
                  "Invalid image."
                )
              );

            };


          image.src =
            event.target.result;

        };


      reader.onerror =
        function(){

          reject(
            new Error(
              "Could not read file."
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================

   ========================================================= */

function generateID(){

  return (
    Date.now().toString(36) +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,10)
  );

}


/* =========================================================
   SAVE SITE
   ========================================================= */

async function saveSite(){

  const name =
    document.getElementById(
      "siteName"
    ).value.trim();


  const location =
    document.getElementById(
      "siteLocation"
    ).value.trim();


  const state =
    document.getElementById(
      "state"
    ).value.trim();


  const city =
    document.getElementById(
      "city"
    ).value.trim();


  const lat =
    parseFloat(
      document.getElementById(
        "latitude"
      ).value
    );


  const lng =
    parseFloat(
      document.getElementById(
        "longitude"
      ).value
    );


  if(!name){

    showMessage(
      "Enter Site Name / ID."
    );

    return;

  }


  if(
    Number.isNaN(lat) ||
    Number.isNaN(lng)
  ){

    showMessage(
      "Select a location on the map first."
    );

    return;

  }


  if(
    lat < -90 ||
    lat > 90
  ){

    showMessage(
      "Invalid latitude."
    );

    return;

  }


  if(
    lng < -180 ||
    lng > 180
  ){

    showMessage(
      "Invalid longitude."
    );

    return;

  }


  const editId =
    document.getElementById(
      "editId"
    ).value.trim();


  let photoURL =
    document.getElementById(
      "photoPreview"
    ).dataset.url || "";


  const photoFile =
    document.getElementById(
      "photo"
    ).files[0];


  if(photoFile){

    try{

      showMessage(
        "Processing site photo..."
      );


      photoURL =
        await resizeImage(
          photoFile,
          1200,
          0.82
        );

    }
    catch(error){

      console.error(error);

      showMessage(
        "Could not process photo."
      );

      return;

    }

  }


  const width =
    Number(
      document.getElementById(
        "width"
      ).value
    ) || 0;


  const height =
    Number(
      document.getElementById(
        "height"
      ).value
    ) || 0;


  const units =
    Number(
      document.getElementById(
        "units"
      ).value
    ) || 1;


  const rate =
    Number(
      document.getElementById(
        "rate"
      ).value
    ) || 0;


  const duration =
    Number(
      document.getElementById(
        "duration"
      ).value
    ) || 1;


  let pmRate =
    Number(
      document.getElementById(
        "pmRate"
      ).value
    ) || 0;


  const illumination =
    document.getElementById(
      "illumination"
    ).value;


  if(
    illumination === "DOOH"
  ){

    pmRate = 0;

  }


  const area =
    width *
    height *
    units;


  const displayCharges =
    rate *
    duration /
    30;


  const pmCharges =
    area *
    pmRate;


  const totalCost =
    displayCharges +
    pmCharges;


  const siteData = {

    id:
      editId ||
      generateID(),

    site_name:
      name,

    state:
      state,

    city:
      city,

    location:
      location,

    latitude:
      lat,

    longitude:
      lng,

    width:
      width,

    height:
      height,

    units:
      units,

    total_area:
      area,

    media_type:
      document.getElementById(
        "mediaType"
      ).value,

    illumination:
      illumination,

    traffic:
      document.getElementById(
        "traffic"
      ).value,

    monthly_rate:
      rate,

    duration:
      duration,

    display_charges:
      displayCharges,

    pm_rate:
      pmRate,

    pm_charges:
      pmCharges,

    total_cost:
      totalCost,

    status:
      document.getElementById(
        "status"
      ).value,

    photo_url:
      photoURL,

    remarks:
      document.getElementById(
        "remarks"
      ).value.trim(),

    updated_at:
      new Date().toISOString()

  };


  if(editId){

    const index =
      sites.findIndex(
        site =>
          site.id === editId
      );


    if(index !== -1){

      /*
        Preserve original creation date
      */

      siteData.created_at =
        sites[index].created_at ||
        new Date().toISOString();


      sites[index] =
        siteData;

    }


    showMessage(
      "Site updated successfully."
    );

  }
  else{

    siteData.created_at =
      new Date().toISOString();


    sites.unshift(
      siteData
    );


    selectedSites.add(
      siteData.id
    );


    showMessage(
      "Site saved successfully."
    );

  }


  const savedSuccessfully =
    await saveLocalData();


  if(!savedSuccessfully){

    /*
      Roll back if storage failed
    */

    if(editId){

      /*
        Reload from database
      */

      await loadLocalData();

    }
    else{

      sites =
        sites.filter(
          site =>
            site.id !==
            siteData.id
        );


      selectedSites.delete(
        siteData.id
      );

    }

    return;

  }


  renderSites();

  renderMarkers();

  clearForm();

}

        ) +

        escapeHTML(
          site.illumination || ""
        ) +

        "<br>" +

        "Traffic: " +
        escapeHTML(
          site.traffic || ""
        ) +

        "<br>" +

        "Rate: " +
        money(
          site.monthly_rate
        ) +

        "<br>" +

        "Status: " +
        escapeHTML(
          site.status || ""
        );


      if(site.photo_url){

        popup +=
          "<br><br>" +
          "<img src='" +
          escapeAttribute(
            site.photo_url
          ) +
          "' style='width:180px;height:120px;object-fit:cover;border-radius:6px'>";

      }


      popup +=
        "<br><br>" +

        "<a href='https://www.google.com/maps?q=" +
        encodeURIComponent(
          lat +
          "," +
          lng
        ) +
        "' target='_blank'>" +

      marker.bindPopup(
        popup

      marker.on(
        "click",
        function(){

          selectedSites.add(
            site.id
          );

          renderSites();

        }
      );


      markers.push(
        marker
      );

    }
  );

}


/* =========================================================
   RENDER SITES
   ========================================================= */

function renderSites(){

  const list =
    document.getElementById(
      "siteList"
    );


  if(!list){

    return;

  }


  const searchInput =
    document.getElementById(
      "siteSearch"
    );


  const search =
    searchInput
      ? searchInput.value
          .toLowerCase()
          .trim()
      : "";


  const filtered =
    sites.filter(
      function(site){

        const text =
          [

            site.site_name,
            site.state,
            site.city,
            site.location,
            site.media_type,
            site.illumination,
            site.traffic,
            site.status,
            site.width,
            site.height,
            site.units,
            site.remarks

          ]
          .join(" ")
          .toLowerCase();


        return text.includes(
          search
        );

      }
    );


  list.innerHTML = "";


  if(!filtered.length){

    list.innerHTML =
      "<div class='empty'>" +

      (
        sites.length
          ? "No matching sites found."
          : "No saved sites yet."
      ) +

      "</div>";

  }


  filtered.forEach(
    function(site){

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "site";


      const selected =
        selectedSites.has(
          site.id
        );


      let photoHTML;


      if(site.photo_url){

        photoHTML =

          "<img src='" +
          escapeAttribute(
            site.photo_url
          ) +
          "' class='saved-site-photo' " +

          "onclick=\"viewSite('" +
          escapeAttribute(
            site.id
          ) +
          "')\">";

      }
      else{

        photoHTML =
          "<div class='no-site-photo'>📷</div>";

      }


      div.innerHTML =

        "<div class='saved-site-row'>" +

          "<div class='saved-site-image'>" +

            photoHTML +

          "</div>" +

          "<div class='saved-site-details'>" +

            "<div class='site-name'>" +

              (
                selected
                  ? "☑ "
                  : "☐ "
              ) +

              escapeHTML(
                site.site_name
              ) +

            "</div>" +

            "<div class='site-info'>" +

              escapeHTML(
                site.location || ""
              ) +

              "<br>" +

              escapeHTML(
                site.city || ""
              ) +

              ", " +

              escapeHTML(
                site.state || ""
              ) +

              "<br>" +

              "📐 " +

              Number(
                site.width || 0
              ) +

              " × " +

              Number(
                site.height || 0
              ) +

              " ft × " +

              Number(
                site.units || 1
              ) +

              " units" +

              "<br>" +

              "📊 " +

              Number(
                site.total_area || 0
              ).toLocaleString(
                "en-IN"
              ) +

              " sq.ft" +

              "<br>" +

              escapeHTML(
                site.media_type || ""
              ) +

              " | " +

              escapeHTML(
                site.illumination || ""
              ) +

              "<br>" +

              "🚦 " +

              escapeHTML(
                site.traffic || ""
              ) +

            "</div>" +

          "</div>" +

        "</div>" +


        "<div class='site-buttons'>" +

          "<button class='btn-blue' " +

          "onclick=\"viewSite('" +
          escapeAttribute(
            site.id
          ) +
          "')\">" +

          "MAP" +

          "</button>" +


          "<button class='btn-gray' " +

          "onclick=\"selectSite('" +
          escapeAttribute(
            site.id
          ) +
          "')\">" +

          (
            selected
              ? "UNSELECT"
              : "SELECT"
          ) +

          "</button>" +


          "<button class='btn-gray' " +

          "onclick=\"editSite('" +
          escapeAttribute(
            site.id
          ) +
          "')\">" +

          "EDIT" +

          "</button>" +


          "<button class='btn-red' " +

          "onclick=\"deleteSite('" +
          escapeAttribute(
            site.id
          ) +
          "')\">" +

          "DELETE" +

          "</button>" +

        "</div>";


      list.appendChild(
        div
      );

    }
  );


  document.getElementById(
    "totalSites"
  ).innerText =
    sites.length;


  document.getElementById(
    "selectedSites"
  ).innerText =
    selectedSites.size;

}


/* =========================================================
   SELECT SITE
   ========================================================= */

function selectSite(id){

  if(
    selectedSites.has(id)
  ){

    selectedSites.delete(
      id
    );

  }
  else{

    selectedSites.add(
      id
    );

  }


  renderSites();

}


/* =========================================================
   VIEW SITE
   ========================================================= */

function viewSite(id){

  const site =
    sites.find(
      item =>
        item.id === id
    );


  if(!site){

    return;

  }


  const lat =
    Number(
      site.latitude
    );


  const lng =
    Number(
      site.longitude
    );


  if(
    Number.isNaN(lat) ||
    Number.isNaN(lng)
  ){

    showMessage(
      "Site has invalid coordinates."
    );

    return;

  }


  if(!map){

    initializeMap();

  }


  map.setView(
    [
      lat,
      lng
    ],
    17
  );


  placeSearchMarker(
    lat,
    lng,
    site.site_name
  );


  selectedSites.add(
    site.id
  );


  renderSites();

}

   EDIT SITE

  document.getElementById(

  ).value =

  document.getElementById(

  ).value =

  document.getElementById(

  ).value =

    "status"
  ).value =
    site.status ||
    "Available";


  document.getElementById(
    "remarks"
  ).value =
    site.remarks || "";


  const preview =
    document.getElementById(
      "photoPreview"
    );


  preview.dataset.url =
    site.photo_url || "";


  if(site.photo_url){

    preview.src =
      site.photo_url;

    preview.style.display =
      "block";

  }
  else{

    preview.src = "";

    preview.style.display =
      "none";

  }


  document.getElementById(
    "formTitle"
  ).innerText =
    "✏️ Edit OOH Site";


  calculateValues();


  viewSite(id);


  window.scrollTo(
    {
      top:0,
      behavior:"smooth"
    }
  );

}


/* =========================================================
   DELETE SITE
   ========================================================= */

async function deleteSite(id){

  const site =
    sites.find(
      item =>
        item.id === id
    );


  if(!site){

    return;

  }


  if(
    !confirm(
      "Delete " +
      site.site_name +
      " permanently?"
    )
  ){

    return;

  }


  sites =
    sites.filter(
      item =>
        item.id !== id
    );


  selectedSites.delete(
    id
  );


  const saved =
    await saveLocalData();


  if(!saved){

    await loadLocalData();

    return;

  }


  renderSites();

  renderMarkers();


  showMessage(
    "Site deleted."
  );

}


/* =========================================================
   CLEAR ALL
   ========================================================= */

async function clearAllSites(){

  if(!sites.length){

    showMessage(
      "There are no saved sites."
    );

    return;

  }


  if(
    !confirm(
      "Delete ALL saved OOH sites? This cannot be undone."
    )
  ){

    return;

  }


  sites = [];

  selectedSites.clear();


  await clearOOHDatabase();


  renderSites();

  renderMarkers();

  clearForm();

}

/* =========================================================
   IMAGE TO DATA URL
   ========================================================= */

async function imageUrlToDataUrl(
  url
){

  if(!url){

    return null;

  }


  if(
    String(url)
      .startsWith(
        "data:image/"
      )
  ){

    return url;

  }


  try{

    const response =
      await fetch(
        url,
        {
          mode:"cors",
          cache:"no-cache"
        }
      );


    if(!response.ok){

      throw new Error(
        "Image HTTP " +
        response.status
      );

    }


    const blob =
      await response.blob();


    return await new Promise(
      function(resolve,reject){

        const reader =
          new FileReader();


        reader.onloadend =
          function(){

            resolve(
              reader.result
            );

          };


        reader.onerror =
          function(){

            reject(
              new Error(
                "Could not read image."
              )
            );

          };


        reader.readAsDataURL(
          blob
        );

      }
    );

  }
  catch(error){

    console.error(
      "Could not convert image:",
      error
    );

    return null;

  }

}

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text){

  return String(
    text ?? ""
  )
  .replace(
    /[&<>"']/g,
    function(character){

      return {

        "&":
          "&amp;",

        "<":
          "&lt;",

        ">":
          "&gt;",

        '"':
          "&quot;",

        "'":
          "&#039;"

      }[character];

    }
  );

}


/* =========================================================
   ESCAPE ATTRIBUTE
   ========================================================= */

function escapeAttribute(text){

  return String(
    text ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  );

}


/* =========================================================
   PHOTO PREVIEW
   ========================================================= */

document
  .getElementById("photo")
  .addEventListener(
    "change",
    async function(){

      const file =
        this.files[0];


      const preview =
        document.getElementById(
          "photoPreview"
        );


      if(!file){

        preview.src = "";

        preview.style.display =
          "none";

        return;

      }


      try{

        const dataURL =
          await resizeImage(
            file,
            1200,
            0.82
          );


        preview.src =
          dataURL;


        /*
          New photo.
          saveSite() will use the file.
        */

        preview.dataset.url =
          "";


        preview.style.display =
          "block";

      }
      catch(error){

        console.error(
          error
        );


        showMessage(
          "Could not preview image."
        );

      }

    }
  );
