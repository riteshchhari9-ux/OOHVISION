.site-name{

}

    padding:6px 8px;

@media(max-width:850px){

    }

    .main{
        display:block;
        height:auto;
    }

        height:auto;
    }

        height:60vh;

}

<script>

/* =====================================================
   MY VISION OOH
   ===================================================== */


/* DATABASE */

const DB_NAME = "MY_VISION_OOH_DATABASE";

const DB_VERSION = 1;

const STORE_NAME = "sites";

let db;

let sites = [];

let selectedSites = new Set();

let map;

let markers = [];

let searchMarker = null;

let currentPhoto = "";



/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text){

    const box =
    document.getElementById("message");

    box.innerText = text;

    box.style.display = "block";

    setTimeout(function(){

        box.style.display = "none";

    },2500);

}



/* =====================================================
   INDEXED DB
   PERMANENT BROWSER STORAGE
   ===================================================== */

function openDatabase(){

    return new Promise(function(resolve,reject){

        const request =
        indexedDB.open(
            DB_NAME,
            DB_VERSION
        );


        request.onupgradeneeded =
        function(event){

            const database =
            event.target.result;

            if(
                !database.objectStoreNames.contains(
                    STORE_NAME
                )
            ){

                database.createObjectStore(
                    STORE_NAME,
                    {
                        keyPath:"id"
                    }
                );

            }

        };


        request.onsuccess =
        function(event){

            db =
            event.target.result;

            resolve(db);

        };


        request.onerror =
        function(){

            reject(
                request.error
            );

        };

    });

}



function getAllSites(){

    return new Promise(function(resolve,reject){

        const transaction =
        db.transaction(
            STORE_NAME,
            "readonly"
        );

        const store =
        transaction.objectStore(
            STORE_NAME
        );

        const request =
        store.getAll();


        request.onsuccess =
        function(){

            resolve(
                request.result || []
            );

        };


        request.onerror =
        function(){

            reject(
                request.error
            );

        };

    });

}



function putSite(site){

    return new Promise(function(resolve,reject){

        const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );

        const store =
        transaction.objectStore(
            STORE_NAME
        );

        const request =
        store.put(site);


        request.onsuccess =
        function(){

            resolve();

        };


        request.onerror =
        function(){

            reject(
                request.error
            );

        };

    });

}



function removeSite(id){

    return new Promise(function(resolve,reject){

        const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );

        const store =
        transaction.objectStore(
            STORE_NAME
        );

        const request =
        store.delete(id);


        request.onsuccess =
        function(){

            resolve();

        };


        request.onerror =
        function(){

            reject(
                request.error
            );

        };

    });

}



/* =====================================================
   MAP
   ===================================================== */

function initializeMap(){

    map =
    L.map("map")
    .setView(
        [19.0760,72.8777],
        11
    );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
            "© OpenStreetMap contributors"
        }
    ).addTo(map);


    map.on(
        "click",
        function(event){

            const lat =
            event.latlng.lat;

            const lng =
            event.latlng.lng;


            document.getElementById(
                "latitude"
            ).value =
            lat.toFixed(6);


            document.getElementById(
                "longitude"
            ).value =
            lng.toFixed(6);


            document.getElementById(
                "searchLat"
            ).value =
            lat.toFixed(6);


            document.getElementById(
                "searchLng"
            ).value =
            lng.toFixed(6);


            placeSearchMarker(
                lat,
                lng,
                "Selected Location"
            );


            showMessage(
                "Location selected"
            );

        }
    );

}



/* =====================================================
   LOCATION NAME SEARCH
   ===================================================== */

async function searchLocation(){

    const query =
    document.getElementById(
        "locationSearch"
    ).value.trim();


    if(!query){

        showMessage(
            "Enter a location name"
        );

        return;

    }


    showMessage(
        "Searching..."
    );


    try{

        const url =
        "https://nominatim.openstreetmap.org/search"+
        "?format=json"+
        "&limit=1"+
        "&q="+
        encodeURIComponent(query);


        const response =
        await fetch(
            url,
            {
                headers:{
                    "Accept-Language":"en"
                }
            }
        );


        const data =
        await response.json();


        if(!data.length){

            showMessage(
                "Location not found"
            );

            return;

        }


        const result =
        data[0];


        showLocation(
            parseFloat(result.lat),
            parseFloat(result.lon),
            result.display_name
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            "Location search failed"
        );

    }

}



/* =====================================================
   LAT LONG SEARCH
   ===================================================== */

function searchCoordinates(){

    const lat =
    parseFloat(
        document.getElementById(
            "searchLat"
        ).value
    );


    const lng =
    parseFloat(
        document.getElementById(
            "searchLng"
        ).value
    );


    if(
        isNaN(lat) ||
        isNaN(lng)
    ){

        showMessage(
            "Enter valid coordinates"
        );

        return;

    }


    if(
        lat < -90 ||
        lat > 90 ||
        lng < -180 ||
        lng > 180
    ){

        showMessage(
            "Invalid coordinates"
        );

        return;

    }


    showLocation(
        lat,
        lng,
        "Selected Coordinates"
    );

}



/* =====================================================
   SHOW LOCATION
   ===================================================== */

function showLocation(
    lat,
    lng,
    name
){

    map.setView(
        [lat,lng],
        17
    );


    placeSearchMarker(
        lat,
        lng,
        name
    );


    document.getElementById(
        "latitude"
    ).value =
    lat.toFixed(6);


    document.getElementById(
        "longitude"
    ).value =
    lng.toFixed(6);


    document.getElementById(
        "searchLat"
    ).value =
    lat.toFixed(6);


    document.getElementById(
        "searchLng"
    ).value =
    lng.toFixed(6);


    if(
        name !== "Selected Coordinates"
    ){

        document.getElementById(
            "siteLocation"
        ).value =
        name;

    }


    const box =
    document.getElementById(
        "locationResult"
    );


    box.style.display =
    "block";


    box.innerHTML =
    "<b>📍 Location Found</b><br>"+
    escapeHTML(name)+
    "<br><br>"+
    "<b>Lat:</b> "+
    lat.toFixed(6)+
    "<br>"+
    "<b>Long:</b> "+
    lng.toFixed(6);


    showMessage(
        "Location highlighted"
    );

}



/* =====================================================
   SEARCH MARKER
   ===================================================== */

function placeSearchMarker(
    lat,
    lng,
    name
){

    if(searchMarker){

        searchMarker.remove();

    }


    searchMarker =
    L.marker(
        [lat,lng]
    )
    .addTo(map)
    .bindPopup(
        "<b>📍 "+
        escapeHTML(name)+
        "</b><br><br>"+
        lat.toFixed(6)+
        ", "+
        lng.toFixed(6)
    )
    .openPopup();

}



/* =====================================================
   MY LOCATION
   ===================================================== */

function useMyLocation(){

    if(
        !navigator.geolocation
    ){

        showMessage(
            "Geolocation not supported"
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position){

            showLocation(
                position.coords.latitude,
                position.coords.longitude,
                "My Current Location"
            );

        },

        function(){

            showMessage(
                "Please allow location permission"
            );

        }

    );

}



/* =====================================================
   SAVE SITE
   ===================================================== */

async function saveSite(){

    const name =
    document.getElementById(
        "siteName"
    ).value.trim();


    const location =
    document.getElementById(
        "siteLocation"
    ).value.trim();


    const lat =
    parseFloat(
        document.getElementById(
            "latitude"
        ).value
    );


    const lng =
    parseFloat(
        document.getElementById(
            "longitude"
        ).value
    );


    if(!name){

        showMessage(
            "Enter Site Name / ID"
        );

        return;

    }


    if(
        isNaN(lat) ||
        isNaN(lng)
    ){

        showMessage(
            "Search/select a location first"
        );

        return;

    }


    let photo =
    currentPhoto;


    const photoFile =
    document.getElementById(
        "photo"
    ).files[0];


    if(photoFile){

        photo =
        await resizePhoto(
            photoFile
        );

    }


    const editId =
    document.getElementById(
        "editId"
    ).value;


    const site = {

        id:
        editId ||
        crypto.randomUUID(),

        siteName:
        name,

        location:
        location,

        latitude:
        lat,

        longitude:
        lng,

        width:
        Number(
            document.getElementById(
                "width"
            ).value
        ) || 0,

        height:
        Number(
            document.getElementById(
                "height"
            ).value
        ) || 0,

        mediaType:
        document.getElementById(
            "mediaType"
        ).value,

        illumination:
        document.getElementById(
            "illumination"
        ).value,

        rate:
        Number(
            document.getElementById(
                "rate"
            ).value
        ) || 0,

        status:
        document.getElementById(
            "status"
        ).value,

        photo:
        photo || "",

        remarks:
        document.getElementById(
            "remarks"
        ).value,

        updated:
        new Date().toISOString()

    };


    await putSite(site);


    const existingIndex =
    sites.findIndex(
        function(item){
            return item.id === site.id;
        }
    );


    if(existingIndex >= 0){

        sites[existingIndex] =
        site;

        showMessage(
            "Site updated & permanently saved"
        );

    }
    else{

        sites.unshift(site);

        selectedSites.add(
            site.id
        );

        showMessage(
            "Site permanently saved"
        );

    }


    renderSites();

    renderMarkers();

    clearForm();

}



/* =====================================================
   PHOTO RESIZE
   ===================================================== */

function resizePhoto(file){

    return new Promise(function(resolve,reject){

        const reader =
        new FileReader();


        reader.onload =
        function(event){

            const img =
            new Image();


            img.onload =
            function(){

                const canvas =
                document.createElement(
                    "canvas"
                );


                const max =
                1200;


                let width =
                img.width;

                let height =
                img.height;


                if(width > max){

                    height =
                    height * max / width;

                    width =
                    max;

                }


                if(height > max){

                    width =
                    width * max / height;

                    height =
                    max;

                }


                canvas.width =
                width;

                canvas.height =
                height;


                const ctx =
                canvas.getContext(
                    "2d"
                );


                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                resolve(
                    canvas.toDataURL(
                        "image/jpeg",
                        .70
                    )
                );

            };


            img.onerror =
            reject;

            img.src =
            event.target.result;

        };


        reader.onerror =
        reject;

        reader.readAsDataURL(file);

    });

}



/* =====================================================
   PHOTO PREVIEW
   ===================================================== */

function previewPhoto(event){

    const file =
    event.target.files[0];


    if(!file){

        return;

    }


    const reader =
    new FileReader();


    reader.onload =
    function(e){

        const img =
        document.getElementById(
            "photoPreview"
        );


        img.src =
        e.target.result;

        img.style.display =
        "block";

        currentPhoto =
        e.target.result;

    };


    reader.readAsDataURL(file);

}



/* =====================================================
   MAP MARKERS
   ===================================================== */

function renderMarkers(){

    markers.forEach(
        function(marker){
            marker.remove();
        }
    );


    markers = [];


    sites.forEach(
        function(site){

            const marker =
            L.marker(
                [
                    site.latitude,
                    site.longitude
                ]
            )
            .addTo(map);


            marker.bindPopup(

                "<b>"+
                escapeHTML(
                    site.siteName
                )+
                "</b><br>"+

                escapeHTML(
                    site.location || ""
                )+

                "<br><br>"+

                "Size: "+
                site.width+
                " × "+
                site.height+
                " ft<br>"+

                "Media: "+
                escapeHTML(
                    site.mediaType
                )+
                "<br>"+

                "Rate: ₹"+
                Number(
                    site.rate
                ).toLocaleString(
                    "en-IN"
                )+
                "<br>"+

                "Status: "+
                escapeHTML(
                    site.status
                )

            );


            marker.on(
                "click",
                function(){

                    selectedSites.add(
                        site.id
                    );

                    renderSites();

                }
            );


            markers.push(
                marker
            );

        }
    );

}



/* =====================================================
   RENDER SITE LIST
   ===================================================== */

function renderSites(){

    const list =
    document.getElementById(
        "siteList"
    );


    const search =
    document.getElementById(
        "siteSearch"
    ).value
    .toLowerCase();


    const filtered =
    sites.filter(
        function(site){

            return (

                site.siteName+
                " "+
                (site.location || "")+
                " "+
                site.mediaType

            )
            .toLowerCase()
            .includes(search);

        }
    );


    list.innerHTML =
    "";


    if(!filtered.length){

        list.innerHTML =
        "<div class='empty'>"+
        "No saved sites"+
        "</div>";

    }


    filtered.forEach(
        function(site){

            const div =
            document.createElement(
                "div"
            );


            div.className =
            "site";


            const selected =
            selectedSites.has(
                site.id
            );


            div.innerHTML =

            "<div class='site-name'>"+
            (selected ? "☑ " : "☐ ")+
            escapeHTML(
                site.siteName
            )+
            "</div>"+

            "<div class='site-info'>"+
            escapeHTML(
                site.location || ""
            )+
            "<br>"+
            site.latitude+
            ", "+
            site.longitude+
            "<br>"+
            site.width+
            " × "+
            site.height+
            " ft | ₹"+
            Number(
                site.rate || 0
            ).toLocaleString(
                "en-IN"
            )+
            "</div>"+

            "<div class='site-buttons'>"+

            "<button class='btn-blue' "+
            "onclick=\"viewSite('"+
            site.id+
            "')\">MAP</button>"+

            "<button class='btn-gray' "+
            "onclick=\"selectSite('"+
            site.id+
            "')\">"+
            (selected ?
            "UNSELECT":
            "SELECT")+
            "</button>"+

            "<button class='btn-gray' "+
            "onclick=\"editSite('"+
            site.id+
            "')\">EDIT</button>"+

            "<button class='btn-red' "+
            "onclick=\"deleteSite('"+
            site.id+
            "')\">DELETE</button>"+

            "</div>";


            list.appendChild(
                div
            );

        }
    );


    document.getElementById(
        "totalSites"
    ).innerText =
    sites.length;


    document.getElementById(
        "selectedSites"
    ).innerText =
    selectedSites.size;

}



/* =====================================================
   SELECT
   ===================================================== */

function selectSite(id){

    if(
        selectedSites.has(id)
    ){

        selectedSites.delete(id);

    }
    else{

        selectedSites.add(id);

    }


    renderSites();

}



/* =====================================================
   VIEW
   ===================================================== */

function viewSite(id){

    const site =
    sites.find(
        function(item){
            return item.id === id;
        }
    );


    if(!site){

        return;

    }


    map.setView(
        [
            site.latitude,
            site.longitude
        ],
        17
    );


    placeSearchMarker(
        site.latitude,
        site.longitude,
        site.siteName
    );


    selectedSites.add(
        site.id
    );


    renderSites();

}



/* =====================================================
   EDIT
   ===================================================== */

function editSite(id){

    const site =
    sites.find(
        function(item){
            return item.id === id;
        }
    );


    if(!site){

        return;

    }


    document.getElementById(
        "editId"
    ).value =
    site.id;


    document.getElementById(
        "siteName"
    ).value =
    site.siteName;


    document.getElementById(
        "siteLocation"
    ).value =
    site.location || "";


    document.getElementById(
        "latitude"
    ).value =
    site.latitude;


    document.getElementById(
        "longitude"
    ).value =
    site.longitude;


    document.getElementById(
        "width"
    ).value =
    site.width;


    document.getElementById(
        "height"
    ).value =
    site.height;


    document.getElementById(
        "mediaType"
    ).value =
    site.mediaType;


    document.getElementById(
        "illumination"
    ).value =
    site.illumination;


    document.getElementById(
        "rate"
    ).value =
    site.rate;


    document.getElementById(
        "status"
    ).value =
    site.status;


    document.getElementById(
        "remarks"
    ).value =
    site.remarks || "";


    currentPhoto =
    site.photo || "";


    if(site.photo){

        const img =
        document.getElementById(
            "photoPreview"
        );

        img.src =
        site.photo;

        img.style.display =
        "block";

    }


    document.getElementById(
        "formTitle"
    ).innerText =
    "✏️ Edit OOH Site";


    viewSite(id);

}



/* =====================================================
   DELETE
   ===================================================== */

async function deleteSite(id){

    const confirmed =
    confirm(
        "Delete this site permanently?"
    );


    if(!confirmed){

        return;

    }


    await removeSite(id);


    sites =
    sites.filter(
        function(site){
            return site.id !== id;
        }
    );


    selectedSites.delete(id);


    renderSites();

    renderMarkers();


    showMessage(
        "Site deleted"
    );

}

function clearForm(){

/* =====================================================
   EXCEL EXPORT
   ===================================================== */

function exportExcel(){

    const data =
    sites.filter(
        function(site){

            return selectedSites.size === 0 ||
                   selectedSites.has(site.id);

        }
    );


    if(!data.length){

        showMessage(
            "No sites to export"
        );

        return;

    }


    if(
        typeof XLSX === "undefined"
    ){

        alert(
            "Excel library did not load. Refresh the page."
        );

        return;

    }


    const rows =
    data.map(
        function(site,index){

            return {

                "S.No":
                index + 1,

                "Site Name / ID":
                site.siteName,

                "Location":
                site.location,

                "Latitude":
                site.latitude,

                "Longitude":
                site.longitude,

                "Width (ft)":
                site.width,

                "Height (ft)":
                site.height,

                "Media Type":
                site.mediaType,

                "Illumination":
                site.illumination,

                "Monthly Rate":
                site.rate,

                "Status":
                site.status,

                "Remarks":
                site.remarks,

                "Google Maps":
                "https://www.google.com/maps?q="+
                site.latitude+
                ","+
                site.longitude

            };

        }
    );


    const worksheet =
    XLSX.utils.json_to_sheet(
        rows
    );


    const workbook =
    XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "OOH Sites"
    );


    XLSX.writeFile(
        workbook,
        "My_Vision_OOH_Sites.xlsx"
    );


    showMessage(
        "Excel downloaded"
    );

}

/* =====================================================
   HTML SECURITY
   ===================================================== */

function escapeHTML(text){

    return String(
        text || ""
    )
    .replace(
        /[&<>"']/g,
        function(character){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[character];

        }
    );

}
