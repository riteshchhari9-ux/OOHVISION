<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f5f8;
    color:#172033;
}

header{
    height:64px;
    background:#101827;
    color:white;
    display:flex;
    align-items:center;
    padding:0 18px;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.logo span{

}

.header-actions{
    margin-left:auto;
    display:flex;
    gap:8px;
    align-items:center;
}

.sync-status{
    font-size:11px;
    padding:7px 10px;
    border-radius:20px;
    background:#334155;
    color:#fff;
}

button{
    border:0;
    border-radius:7px;
    padding:9px 12px;
    cursor:pointer;

}

button:hover{

}

button:disabled{

}

.btn-blue{

}

.btn-green{

}

.btn-red{

.btn-gray{

.main{

}

.sidebar{

.map-container{

}

#map{

.card{

label{

}

input,
select,
textarea{

    font-size:14px;
}

textarea{
    resize:vertical;

}

.row{
    display:grid;

    gap:8px;
}

.full{
    width:100%;

}

.stats{
    display:grid;

    gap:8px;

}

.stat{

    padding:10px;

}

.stat strong{

    margin-top:3px;
}

.location-result{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    border-radius:7px;
    padding:9px;
    margin-top:9px;
    font-size:12px;
    display:none;
}

.site{
    border:1px solid #d8dee6;
    border-radius:9px;
    padding:9px;
    margin-top:8px;
    background:#fff;
}

.saved-site-row{
    display:flex;
    gap:10px;
    align-items:center;
}

.saved-site-image{
    width:82px;
    height:68px;
    flex-shrink:0;
}

.saved-site-photo{
    width:82px;
    height:68px;
    object-fit:cover;
    border-radius:7px;
    cursor:pointer;
    border:1px solid #d1d5db;
    display:block;
}

.saved-site-photo:hover{
    opacity:.85;
}

.no-site-photo{
    width:82px;
    height:68px;
    background:#e5e7eb;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    color:#64748b;
}

.saved-site-details{
    flex:1;
    min-width:0;
}

.site-name{
    font-weight:bold;
    font-size:14px;
    word-break:break-word;
}

.site-info{
    font-size:11px;
    color:#64748b;
    margin-top:4px;
    line-height:1.5;
    word-break:break-word;
}

.site-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:8px;
}

.site-buttons button{
    padding:6px 8px;
    font-size:10px;
}

.photo-preview{
    max-width:100%;
    max-height:150px;
    border-radius:7px;
    margin-top:7px;
    display:none;
}

.empty{
    text-align:center;

    padding:15px 5px;
    font-size:13px;
}

#message{
    position:fixed;

    bottom:22px;

    transform:translateX(-50%);
    background:#111827;
    color:white;
    padding:11px 18px;
    border-radius:8px;
    display:none;
    max-width:90%;
    text-align:center;
}

@media(max-width:850px){

    header{
        height:auto;
        min-height:64px;
        flex-wrap:wrap;

    }

    .header-actions{

    }

    .main{
        display:block;
        height:auto;
    }

    .sidebar{
        height:auto;
    }

    #map{
        height:60vh;
    }

}

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://fdrdswbrjuigzzmskpru.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_H_iVOgmPDIf-cSXUcdAWow_mT3SXLZr";

const {
    createClient
} = supabase;

const supabaseClient =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const TABLE_NAME =
    "ooh_sites";


/* =========================================================
   APP STATE
   ========================================================= */

let sites = [];

let selectedSites = new Set();

let map;

let markers = [];

let searchMarker = null;

let currentPhoto = "";

let realtimeChannel = null;


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text){

    const box =
        document.getElementById("message");

    box.innerText = text;

    box.style.display = "block";

    clearTimeout(
        window.messageTimer
    );

    window.messageTimer =
        setTimeout(function(){

            box.style.display = "none";

        },3000);

}


/* =========================================================
   SYNC STATUS
   ========================================================= */

function setSyncStatus(
    text,
    connected = false
){

    const box =
        document.getElementById(
            "syncStatus"
        );

    box.innerText =
        connected
        ? "☁ " + text
        : "⚠ " + text;

}


/* =========================================================
   LOAD ALL CLOUD SITES
   ========================================================= */

async function loadSites(){

    setSyncStatus(
        "Loading..."
    );

    const {
        data,
        error
    } =
        await supabaseClient
            .from(TABLE_NAME)
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(
            "LOAD ERROR:",
            error
        );

        setSyncStatus(
            "Cloud error"
        );

        showMessage(
            "Could not load cloud sites: " +
            error.message
        );

        return;

    }


    sites =
        (data || []).map(
            normalizeSite
        );


    setSyncStatus(
        "Synced",
        true
    );


    renderSites();

    renderMarkers();

}


/* =========================================================
   NORMALIZE SUPABASE DATA
   ========================================================= */

function normalizeSite(row){

    return {

        id:
            String(row.id),

        siteName:
            row.site_name || "",

        location:
            row.location || "",

        latitude:
            Number(row.latitude),

        longitude:
            Number(row.longitude),

        width:
            Number(row.width || 0),

        height:
            Number(row.height || 0),

        mediaType:
            row.media_type || "Billboard",

        illumination:
            row.illumination || "Lit",

        rate:
            Number(row.rate || 0),

        status:
            row.status || "Available",

        photo:
            row.photo || "",

        remarks:
            row.remarks || "",

        campaign:
            row.campaign || "",

        created_at:
            row.created_at,

        updated_at:
            row.updated_at

    };

}


/* =========================================================
   CONVERT SITE TO DATABASE ROW
   ========================================================= */

function siteToDatabase(site){

    return {

        id:
            site.id,

        site_name:
            site.siteName,

        location:
            site.location,

        latitude:
            Number(site.latitude),

        longitude:
            Number(site.longitude),

        width:
            Number(site.width || 0),

        height:
            Number(site.height || 0),

        media_type:
            site.mediaType,

        illumination:
            site.illumination,

        rate:
            Number(site.rate || 0),

        status:
            site.status,

        photo:
            site.photo || "",

        remarks:
            site.remarks || "",

        campaign:
            site.campaign || "",

        updated_at:
            new Date().toISOString()

    };

}


/* =========================================================
   SAVE TO SUPABASE
   ========================================================= */

async function saveToCloud(site){

    setSyncStatus(
        "Saving..."
    );


    const row =
        siteToDatabase(site);


    const {
        data,
        error
    } =
        await supabaseClient
            .from(TABLE_NAME)
            .upsert(
                row,
                {
                    onConflict:"id"
                }
            )
            .select()
            .single();


    if(error){

        console.error(
            "SAVE ERROR:",
            error
        );

        setSyncStatus(
            "Save failed"
        );

        throw error;

    }


    setSyncStatus(
        "Synced",
        true
    );


    return normalizeSite(data);

}


/* =========================================================
   DELETE FROM SUPABASE
   ========================================================= */

async function deleteFromCloud(id){

    setSyncStatus(
        "Deleting..."
    );


    const {
        error
    } =
        await supabaseClient
            .from(TABLE_NAME)
            .delete()
            .eq(
                "id",
                id
            );


    if(error){

        console.error(
            "DELETE ERROR:",
            error
        );

        setSyncStatus(
            "Delete failed"
        );

        throw error;

    }


    setSyncStatus(
        "Synced",
        true
    );

}


/* =========================================================
   REALTIME CLOUD SYNC
   ========================================================= */

function startRealtime(){

    if(realtimeChannel){

        supabaseClient
            .removeChannel(
                realtimeChannel
            );

    }


    realtimeChannel =
        supabaseClient
            .channel(
                "my-vision-ooh-live-sync"
            )
            .on(
                "postgres_changes",
                {
                    event:"*",
                    schema:"public",
                    table:TABLE_NAME
                },
                function(payload){

                    console.log(
                        "Realtime change:",
                        payload
                    );


                    if(
                        payload.eventType ===
                        "INSERT"
                    ){

                        const incoming =
                            normalizeSite(
                                payload.new
                            );


                        const exists =
                            sites.some(
                                site =>
                                    site.id ===
                                    incoming.id
                            );


                        if(!exists){

                            sites.unshift(
                                incoming
                            );

                        }
                        else{

                            sites =
                                sites.map(
                                    site =>
                                        site.id ===
                                        incoming.id
                                        ? incoming
                                        : site
                                );

                        }

                    }


                    if(
                        payload.eventType ===
                        "UPDATE"
                    ){

                        const incoming =
                            normalizeSite(
                                payload.new
                            );


                        sites =
                            sites.map(
                                site =>
                                    site.id ===
                                    incoming.id
                                    ? incoming
                                    : site
                            );

                    }


                    if(
                        payload.eventType ===
                        "DELETE"
                    ){

                        const deletedId =
                            String(
                                payload.old.id
                            );


                        sites =
                            sites.filter(
                                site =>
                                    site.id !==
                                    deletedId
                            );


                        selectedSites.delete(
                            deletedId
                        );

                    }


                    renderSites();

                    renderMarkers();

                    setSyncStatus(
                        "Synced",
                        true
                    );

                }
            )
            .subscribe(
                function(status){

                    console.log(
                        "Realtime status:",
                        status
                    );


                    if(
                        status === "SUBSCRIBED"
                    ){

                        setSyncStatus(
                            "Live Sync",
                            true
                        );

                    }

                }
            );

}


/* =========================================================
   MAP
   ========================================================= */

function initializeMap(){

    map =
        L.map("map")
        .setView(
            [19.0760,72.8777],
            11
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
                "© OpenStreetMap contributors"
        }
    ).addTo(map);


    map.on(
        "click",
        function(event){

            const lat =
                event.latlng.lat;

            const lng =
                event.latlng.lng;


            document.getElementById(
                "latitude"
            ).value =
                lat.toFixed(6);


            document.getElementById(
                "longitude"
            ).value =
                lng.toFixed(6);


            document.getElementById(
                "searchLat"
            ).value =
                lat.toFixed(6);


            document.getElementById(
                "searchLng"
            ).value =
                lng.toFixed(6);


            placeSearchMarker(
                lat,
                lng,
                "Selected Location"
            );


            showMessage(
                "Location selected"
            );

        }
    );

}


/* =========================================================
   LOCATION SEARCH
   ========================================================= */

async function searchLocation(){

    const query =
        document.getElementById(
            "locationSearch"
        ).value.trim();


    if(!query){

        showMessage(
            "Enter a location name"
        );

        return;

    }


    showMessage(
        "Searching..."
    );


    try{

        const url =
            "https://nominatim.openstreetmap.org/search" +
            "?format=json" +
            "&limit=1" +
            "&q=" +
            encodeURIComponent(query);


        const response =
            await fetch(url);


        const data =
            await response.json();


        if(!data.length){

            showMessage(
                "Location not found"
            );

            return;

        }


        const result =
            data[0];


        showLocation(
            parseFloat(result.lat),
            parseFloat(result.lon),
            result.display_name
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            "Location search failed"
        );

    }

}


/* =========================================================
   COORDINATES
   ========================================================= */

function searchCoordinates(){

    const lat =
        parseFloat(
            document.getElementById(
                "searchLat"
            ).value
        );


    const lng =
        parseFloat(
            document.getElementById(
                "searchLng"
            ).value
        );


    if(
        isNaN(lat) ||
        isNaN(lng)
    ){

        showMessage(
            "Enter valid coordinates"
        );

        return;

    }


    if(
        lat < -90 ||
        lat > 90 ||
        lng < -180 ||
        lng > 180
    ){

        showMessage(
            "Invalid coordinates"
        );

        return;

    }


    showLocation(
        lat,
        lng,
        "Selected Coordinates"
    );

}


/* =========================================================
   SHOW LOCATION
   ========================================================= */

function showLocation(
    lat,
    lng,
    name
){

    map.setView(
        [lat,lng],
        17
    );


    placeSearchMarker(
        lat,
        lng,
        name
    );


    document.getElementById(
        "latitude"
    ).value =
        lat.toFixed(6);


    document.getElementById(
        "longitude"
    ).value =
        lng.toFixed(6);


    document.getElementById(
        "searchLat"
    ).value =
        lat.toFixed(6);


    document.getElementById(
        "searchLng"
    ).value =
        lng.toFixed(6);


    if(
        name !==
        "Selected Coordinates"
    ){

        document.getElementById(
            "siteLocation"
        ).value =
            name;

    }


    const box =
        document.getElementById(
            "locationResult"
        );


    box.style.display =
        "block";


    box.innerHTML =
        "<b>📍 Location Found</b><br>" +
        escapeHTML(name) +
        "<br><br>" +
        "<b>Lat:</b> " +
        lat.toFixed(6) +
        "<br>" +
        "<b>Long:</b> " +
        lng.toFixed(6);


    showMessage(
        "Location highlighted"
    );

}


/* =========================================================
   SEARCH MARKER
   ========================================================= */

function placeSearchMarker(
    lat,
    lng,
    name
){

    if(searchMarker){

        searchMarker.remove();

    }


    searchMarker =
        L.marker(
            [lat,lng]
        )
        .addTo(map)
        .bindPopup(
            "<b>📍 " +
            escapeHTML(name) +
            "</b><br><br>" +
            lat.toFixed(6) +
            ", " +
            lng.toFixed(6)
        )
        .openPopup();

}


/* =========================================================
   MY LOCATION
   ========================================================= */

function useMyLocation(){

    if(!navigator.geolocation){

        showMessage(
            "Geolocation not supported"
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position){

            showLocation(
                position.coords.latitude,
                position.coords.longitude,
                "My Current Location"
            );

        },

        function(){

            showMessage(
                "Please allow location permission"
            );

        }

    );

}


/* =========================================================
   SAVE SITE
   ========================================================= */

async function saveSite(){

    const name =
        document.getElementById(
            "siteName"
        ).value.trim();


    const location =
        document.getElementById(
            "siteLocation"
        ).value.trim();


    const lat =
        parseFloat(
            document.getElementById(
                "latitude"
            ).value
        );


    const lng =
        parseFloat(
            document.getElementById(
                "longitude"
            ).value
        );


    if(!name){

        showMessage(
            "Enter Site Name / ID"
        );

        return;

    }


    if(
        isNaN(lat) ||
        isNaN(lng)
    ){

        showMessage(
            "Select/search a location first"
        );

        return;

    }


    try{

        let photo =
            currentPhoto;


        const photoFile =
            document.getElementById(
                "photo"
            ).files[0];


        if(photoFile){

            showMessage(
                "Processing photo..."
            );


            photo =
                await resizePhoto(
                    photoFile
                );

        }


        const editId =
            document.getElementById(
                "editId"
            ).value;


        const site = {

            id:
                editId ||
                crypto.randomUUID(),

            siteName:
                name,

            location:
                location,

            latitude:
                lat,

            longitude:
                lng,

            width:
                Number(
                    document.getElementById(
                        "width"
                    ).value
                ) || 0,

            height:
                Number(
                    document.getElementById(
                        "height"
                    ).value
                ) || 0,

            mediaType:
                document.getElementById(
                    "mediaType"
                ).value,

            illumination:
                document.getElementById(
                    "illumination"
                ).value,

            rate:
                Number(
                    document.getElementById(
                        "rate"
                    ).value
                ) || 0,

            status:
                document.getElementById(
                    "status"
                ).value,

            photo:
                photo || "",

            remarks:
                document.getElementById(
                    "remarks"
                ).value,

            campaign:
                document.getElementById(
                    "campaign"
                ).value.trim()

        };


        const saved =
            await saveToCloud(
                site
            );


        const existingIndex =
            sites.findIndex(
                item =>
                    item.id ===
                    saved.id
            );


        if(existingIndex >= 0){

            sites[existingIndex] =
                saved;

            showMessage(
                "☁ Site updated and synced"
            );

        }
        else{

            sites.unshift(
                saved
            );

            selectedSites.add(
                saved.id
            );

            showMessage(
                "☁ Site saved to cloud"
            );

        }


        renderSites();

        renderMarkers();

        clearForm();

    }
    catch(error){

        console.error(error);

        showMessage(
            "Save failed: " +
            error.message
        );

    }

}


/* =========================================================
   PHOTO RESIZE
   ========================================================= */

function resizePhoto(file){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();


            reader.onload =
                function(event){

                    const img =
                        new Image();


                    img.onload =
                        function(){

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            const max =
                                1400;


                            let width =
                                img.width;

                            let height =
                                img.height;


                            if(width > max){

                                height =
                                    height *
                                    max /
                                    width;

                                width =
                                    max;

                            }


                            if(height > max){

                                width =
                                    width *
                                    max /
                                    height;

                                height =
                                    max;

                            }


                            canvas.width =
                                Math.round(width);

                            canvas.height =
                                Math.round(height);


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                canvas.width,
                                canvas.height
                            );


                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    .72
                                )
                            );

                        };


                    img.onerror =
                        reject;


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}

function previewPhoto(event){

    const file =

    if(!file){

    reader.readAsDataURL(
        file
    );

}


/* =========================================================
   MAP MARKERS
   ========================================================= */

function renderMarkers(){

    if(!map){

        return;

    }


    markers.forEach(
        marker =>
            marker.remove()
    );


    markers = [];


    sites.forEach(
        function(site){

            if(
                isNaN(site.latitude) ||
                isNaN(site.longitude)
            ){

                return;

            }


            const marker =
                L.marker(
                    [
                        Number(
                            site.latitude
                        ),
                        Number(
                            site.longitude
                        )
                    ]
                )
                .addTo(map);


            let popup =

                "<b>" +
                escapeHTML(
                    site.siteName
                ) +
                "</b><br>" +

                escapeHTML(
                    site.location || ""
                ) +

                "<br><br>" +

                "Size: " +
                site.width +
                " × " +
                site.height +
                " ft<br>" +

                "Media: " +
                escapeHTML(
                    site.mediaType
                ) +
                "<br>" +

                "Rate: ₹" +
                Number(
                    site.rate || 0
                ).toLocaleString(
                    "en-IN"
                ) +
                "<br>" +

                "Status: " +
                escapeHTML(
                    site.status
                );


            if(site.photo){

                popup +=
                    "<br><br>" +
                    "<img src='" +
                    site.photo +
                    "' style='width:180px;height:120px;object-fit:cover;border-radius:6px'>";

            }


            popup +=
                "<br><br>" +
                "<a target='_blank' href='https://www.google.com/maps?q=" +
                encodeURIComponent(
                    site.latitude +
                    "," +
                    site.longitude
                ) +
                "'>📍 Open Google Maps</a>";


            marker.bindPopup(
                popup
            );


            marker.on(
                "click",
                function(){

                    selectedSites.add(
                        site.id
                    );

                    renderSites();

                }
            );


            markers.push(
                marker
            );

        }
    );

}


/* =========================================================

   ========================================================= */

function renderSites(){

    const list =
        document.getElementById(
            "siteList"
        );


    if(!list){

        return;

    }


    const search =
        document.getElementById(
            "siteSearch"
        )
        .value
        .toLowerCase()
        .trim();


    const filtered =
        sites.filter(
            function(site){

                const searchableText =

                    String(
                        site.siteName || ""
                    ) + " " +

                    String(
                        site.location || ""
                    ) + " " +

                    String(
                        site.latitude || ""
                    ) + " " +

                    String(
                        site.longitude || ""
                    ) + " " +

                    String(
                        site.mediaType || ""
                    ) + " " +

                    String(
                        site.status || ""
                    ) + " " +

                    String(
                        site.width || ""
                    ) + " " +

                    String(
                        site.height || ""
                    ) + " " +

                    String(
                        site.remarks || ""
                    );


                return searchableText
                    .toLowerCase()
                    .includes(search);

            }
        );


    list.innerHTML =
        "";


    if(!filtered.length){

            else{

                            (

                            ) +
                            escapeHTML(

                        "</div>" +

                        "<div class='site-info'>" +

                            escapeHTML(

                            ", " +

/* =========================================================

   ========================================================= */

function selectSite(id){

    if(
        selectedSites.has(id)
    ){

        selectedSites.delete(id);

    }
    else{

        selectedSites.add(id);

    }


    renderSites();

}


/* =========================================================
   VIEW SITE
   ========================================================= */

function viewSite(id){

    const site =
        sites.find(
            item =>
                item.id === id
        );


    if(!site){

        return;

    }


    map.setView(
        [
            Number(site.latitude),
            Number(site.longitude)
        ],
        17
    );


    placeSearchMarker(
        Number(site.latitude),
        Number(site.longitude),
        site.siteName
    );


    selectedSites.add(
        site.id
    );


    renderSites();

}

/* =========================================================
   DELETE
   ========================================================= */

async function deleteSite(id){

    const site =
        sites.find(
            item =>
                item.id === id
        );


    if(!site){

        return;

    }


    if(
        !confirm(
            "Delete " +
            site.siteName +
            " permanently from cloud?"
        )
    ){

        return;

    }


    try{

        await deleteFromCloud(
            id
        );


        sites =
            sites.filter(
                site =>
                    site.id !== id
            );


        selectedSites.delete(
            id
        );


        renderSites();

        renderMarkers();


        showMessage(
            "☁ Site deleted from cloud"
        );

    }
    catch(error){

        showMessage(
            "Delete failed: " +
            error.message
        );

    }

}

/* =========================================================
   SECURITY
   ========================================================= */

function escapeHTML(text){

    return String(
        text || ""
    )
    .replace(
        /[&<>"']/g,
        function(character){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[character];

        }
    );

}
